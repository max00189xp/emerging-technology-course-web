in-height: clamp(560px, 68vh, 920px);\r\n}\r\n\r\n.np-root .np-page {\r\n  display: none;\r\n}\r\n\r\n.np-root .np-page.is-active {\r\n  display: block;\r\n  animation: npFade .25s ease;\r\n}\r\n\r\n@keyframes npFade {\r\n  from {\r\n    opacity: 0;\r\n    transform: translateY(5px);\r\n  }\r\n  to {\r\n    opacity: 1;\r\n    transform: translateY(0);\r\n  }\r\n}\r\n\r\n.np-root .np-page-head {\r\n  display: flex;\r\n  align-items: flex-start;\r\n  gap: 13px;\r\n  margin-bottom: 20px;\r\n}\r\n\r\n.np-root .np-page-number {\r\n  flex: 0 0 auto;\r\n\r\n  min-width: 48px;\r\n  height: 48px;\r\n\r\n  display: grid;\r\n  place-items: center;\r\n\r\n  padding: 0 10px;\r\n\r\n  border-radius: 15px 4px 15px 4px;\r\n\r\n  color: #fff;\r\n  background: linear-gradient(135deg, var(--np-navy), var(--np-blue));\r\n\r\n  font-weight: 900;\r\n  font-size: 1.25rem;\r\n}\r\n\r\n.np-root .np-page-head h2 {\r\n  margin: 0;\r\n  color: var(--np-ink);\r\n  font-size: clamp(1.35rem, 2.7vw, 2rem);\r\n  line-height: 1.3;\r\n}\r\n\r\n.np-root .np-page-head p {\r\n  margin: 4px 0 0;\r\n  color: var(--np-muted);\r\n  font-size: 1.25rem;\r\n}\r\n\r\n.np-root .np-section {\r\n  scroll-margin-top: 16px;\r\n}\r\n\r\n.np-root .np-section h3 {\r\n  margin: 0 0 13px;\r\n  padding-bottom: 9px;\r\n\r\n  border-bottom: 2px solid var(--np-sky);\r\n\r\n  color: var(--np-navy);\r\n\r\n  font-size: clamp(1.25rem, 2vw, 1.3rem);\r\n}\r\n\r\n.np-root .np-section h4 {\r\n  margin: 18px 0 8px;\r\n  color: var(--np-ink);\r\n}\r\n\r\n/* Cards */\r\n\r\n.np-root .np-card-grid {\r\n  display: grid;\r\n  grid-template-columns: repeat(2, minmax(0, 1fr));\r\n  gap: 15px;\r\n}\r\n\r\n.np-root .np-card {\r\n  min-width: 0;\r\n  padding: 18px;\r\n\r\n  border: 1px solid var(--np-soft-line);\r\n  border-radius: 18px 5px 18px 5px;\r\n\r\n  background: #fff;\r\n\r\n  box-shadow: 0 9px 24px rgba(29,52,103,.07);\r\n}\r\n\r\n.np-root .np-card h4 {\r\n  margin: 0 0 7px;\r\n  color: var(--np-navy);\r\n}\r\n\r\n.np-root .np-callout {\r\n  margin: 16px 0;\r\n  padding: 16px 18px;\r\n\r\n  border-left: 5px solid var(--np-blue);\r\n  border-radius: 4px 14px 14px 4px;\r\n\r\n  background: var(--np-sky);\r\n\r\n  font-weight: 700;\r\n}\r\n\r\n.np-root .np-callout.warning {\r\n  border-left-color: var(--np-coral);\r\n  background: var(--np-red-soft);\r\n}\r\n\r\n.np-root .np-callout.success {\r\n  border-left-color: var(--np-green);\r\n  background: #edf9f3;\r\n}\r\n\r\n.np-root .np-quote {\r\n  margin: 16px 0;\r\n  padding: 16px 20px;\r\n\r\n  border-left: 5px solid var(--np-coral);\r\n\r\n  background: linear-gradient(135deg, #fff7f4, #fff);\r\n\r\n  color: #6f3f36;\r\n\r\n  font-size: 1.25rem;\r\n  font-weight: 800;\r\n}\r\n\r\n.np-root .np-keywords {\r\n  display: flex;\r\n  flex-wrap: wrap;\r\n  gap: 8px;\r\n\r\n  margin: 15px 0;\r\n}\r\n\r\n.np-root .np-keyword {\r\n  padding: 8px 13px;\r\n\r\n  border: 1px solid #b8c9f4;\r\n  border-radius: 999px;\r\n\r\n  background: #f7f9ff;\r\n\r\n  color: var(--np-navy);\r\n\r\n  font-weight: 800;\r\n}\r\n\r\n/* Message */\r\n\r\n.np-root .np-message {\r\n  overflow: hidden;\r\n\r\n  border: 1px solid var(--np-line);\r\n  border-radius: 18px 5px 18px 5px;\r\n\r\n  background: #fff;\r\n}\r\n\r\n.np-root .np-message-head {\r\n  padding: 10px 14px;\r\n\r\n  color: #fff;\r\n  background: linear-gradient(110deg, var(--np-navy), #4e6bd2);\r\n\r\n  font-size: 1.25rem;\r\n  font-weight: 800;\r\n}\r\n\r\n.np-root .np-message-body {\r\n  padding: 18px;\r\n  white-space: pre-line;\r\n}\r\n\r\n.np-root .np-fake-action {\r\n  display: inline-block;\r\n  margin-top: 10px;\r\n  padding: 9px 15px;\r\n\r\n  border-radius: 8px;\r\n\r\n  background: var(--np-coral);\r\n  color: #fff;\r\n\r\n  font-weight: 900;\r\n}\r\n\r\n/* Images */\r\n\r\n.np-root .np-image-grid {\r\n  display: grid;\r\n  grid-template-columns: repeat(2, minmax(0,1fr));\r\n  gap: 15px;\r\n}\r\n\r\n.np-root .np-image-card {\n  width: 100%;\n  max-width: 100%;\n  margin-inline: auto;\r\n  margin: 0 auto;\r\n  padding: 10px;\r\n\r\n  border: 1px solid var(--np-line);\r\n  border-radius: 18px 5px 18px 5px;\r\n\r\n  background: #fff;\r\n}\r\n\r\n.np-root .np-image-card img {\r\n  width: auto;\n  max-width: 100%;\n  margin-inline: auto;\r\n  height: auto;\r\n  display: block;\r\n\r\n  border-radius: 12px 4px 12px 4px;\r\n\r\n  object-fit: contain;\r\n}\r\n\r\n.np-root .np-image-card figcaption {\r\n  padding: 9px 5px 2px;\r\n\r\n  color: var(--np-muted);\r\n  font-size: 1.25rem;\r\n  font-weight: 800;\r\n  text-align: center;\r\n}\r\n\r\n/* Embedded media */\r\n\r\n.np-root .np-embed-box {\r\n  margin: 15px 0;\r\n\r\n  overflow: hidden;\r\n\r\n  border: 1px solid var(--np-line);\r\n  border-radius: 18px 5px 18px 5px;\r\n\r\n  background: #f5f8ff;\r\n}\r\n\r\n.np-root .np-embed-head {\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: space-between;\r\n  gap: 10px;\r\n\r\n  padding: 10px 14px;\r\n\r\n  border-bottom: 1px solid var(--np-line);\r\n\r\n  background: #edf3ff;\r\n}\r\n\r\n.np-root .np-embed-title {\r\n  min-width: 0;\r\n\r\n  color: var(--np-ink);\r\n  font-weight: 900;\r\n  font-size: 1.25rem;\r\n}\r\n\r\n.np-root .np-external-link {\r\n  flex: 0 0 auto;\r\n\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: 5px;\r\n\r\n  padding: 6px 10px;\r\n\r\n  border: 1px solid #aabce9;\r\n  border-radius: 9px 3px 9px 3px;\r\n\r\n  color: var(--np-navy) !important;\r\n  background: #fff;\r\n\r\n  font-size: 1.25rem;\r\n  font-weight: 900;\r\n  text-decoration: none;\r\n}\r\n\r\n.np-root .np-video {\r\n  position: relative;\r\n  width: 100%;\r\n  aspect-ratio: 16 / 9;\r\n\r\n  background: #0c1630;\r\n}\r\n\r\n.np-root .np-video iframe {\r\n  position: absolute;\r\n  inset: 0;\r\n\r\n  width: 100%;\r\n  height: 100%;\r\n\r\n  display: block;\r\n\r\n  border: 0;\r\n}\r\n\r\n.np-root .np-site-frame {\r\n  width: 100%;\r\n  height: clamp(520px, 70vh, 900px);\r\n\r\n  display: block;\r\n\r\n  border: 0;\r\n\r\n  background: #fff;\r\n}\r\n\r\n.np-root .np-site-note {\r\n  padding: 10px 14px;\r\n\r\n  border-top: 1px solid var(--np-line);\r\n\r\n  color: var(--np-muted);\r\n\r\n  background: #fbfcff;\r\n\r\n  font-size: 1.25rem;\r\n}\r\n\r\n/* Tables */\r\n\r\n.np-root .np-table-wrap {\r\n  width: 100%;\r\n  overflow-x: auto;\r\n\r\n  margin: 15px 0;\r\n\r\n  border: 1px solid var(--np-line);\r\n  border-radius: 15px 5px 15px 5px;\r\n}\r\n\r\n.np-root .np-table {\r\n  width: 100%;\r\n  min-width: 720px;\r\n\r\n  border-collapse: collapse;\r\n\r\n  background: #fff;\r\n}\r\n\r\n.np-root .np-table th,\r\n.np-root .np-table td {\r\n  padding: 11px 12px;\r\n\r\n  border-bottom: 1px solid #e2e9f7;\r\n\r\n  vertical-align: top;\r\n  text-align: left;\r\n}\r\n\r\n.np-root .np-table th {\r\n  color: #fff;\r\n  background: var(--np-navy);\r\n\r\n  font-size: 1.25rem;\r\n}\r\n\r\n.np-root .np-table td {\r\n  font-size: 1.25rem;\r\n}\r\n\r\n.np-root .np-table tr:last-child td {\r\n  border-bottom: 0;\r\n}\r\n\r\n.np-root .np-table tr:nth-child(even) td {\r\n  background: #f8faff;\r\n}\r\n\r\n/* Attack chain */\r\n\r\n.np-root .np-chain {\r\n  display: grid;\r\n  grid-template-columns:\r\n    minmax(0,1fr) auto\r\n    minmax(0,1fr) auto\r\n    minmax(0,1fr) auto\r\n    minmax(0,1fr) auto\r\n    minmax(0,1fr);\r\n\r\n  align-items: center;\r\n  gap: 8px;\r\n\r\n  margin: 25px 0;\r\n}\r\n\r\n.np-root .np-chain-step {\r\n  min-height: 94px;\r\n\r\n  display: grid;\r\n  place-items: center;\r\n\r\n  padding: 12px;\r\n\r\n  border: 1px solid #b9c9ee;\r\n  border-radius: 17px 5px 17px 5px;\r\n\r\n  background: linear-gradient(145deg, #fff, #edf3ff);\r\n\r\n  color: var(--np-navy);\r\n\r\n  font-weight: 900;\r\n  text-align: center;\r\n}\r\n\r\n.np-root .np-chain-arrow {\r\n  color: var(--np-coral);\r\n  font-size: 1.4rem;\r\n  font-weight: 900;\r\n}\r\n\r\n/* Stop Check Verify */\r\n\r\n.np-root .np-scv {\r\n  display: grid;\r\n  grid-template-columns: repeat(3, minmax(0,1fr));\r\n  gap: 14px;\r\n\r\n  margin: 18px 0;\r\n}\r\n\r\n.np-root .np-scv-card {\r\n  padding: 18px;\r\n\r\n  border: 1px solid var(--np-line);\r\n  border-radius: 19px 5px 19px 5px;\r\n\r\n  background: #fff;\r\n}\r\n\r\n.np-root .np-scv-letter {\r\n  width: 48px;\r\n  height: 48px;\r\n\r\n  display: grid;\r\n  place-items: center;\r\n\r\n  margin-bottom: 10px;\r\n\r\n  border-radius: 14px 4px 14px 4px;\r\n\r\n  color: #fff;\r\n  background: var(--np-blue);\r\n\r\n  font-size: 1.25rem;\r\n  font-weight: 900;\r\n}\r\n\r\n.np-root .np-scv-card:nth-child(1) .np-scv-letter {\r\n  background: var(--np-coral);\r\n}\r\n\r\n.np-root .np-scv-card:nth-child(3) .np-scv-letter {\r\n  background: var(--np-green);\r\n}\r\n\r\n/* Puzzle */\r\n\r\n.np-root .np-puzzle {\r\n  display: grid;\r\n  gap: 10px;\r\n}\r\n\r\n.np-root .np-puzzle-step {\r\n  position: relative;\r\n\r\n  padding: 14px 15px 14px 56px;\r\n\r\n  border: 1px solid var(--np-line);\r\n  border-radius: 15px 5px 15px 5px;\r\n\r\n  background: #fff;\r\n}\r\n\r\n.np-root .np-puzzle-step::before {\r\n  content: attr(data-step);\r\n\r\n  position: absolute;\r\n  left: 13px;\r\n  top: 13px;\r\n\r\n  width: 29px;\r\n  height: 29px;\r\n\r\n  display: grid;\r\n  place-items: center;\r\n\r\n  border-radius: 9px 3px 9px 3px;\r\n\r\n  color: #fff;\r\n  background: var(--np-blue);\r\n\r\n  font-size: 1.25rem;\r\n  font-weight: 900;\r\n}\r\n\r\n/* Checklist */\r\n\r\n.np-root .np-check-list {\r\n  display: grid;\r\n  grid-template-columns: repeat(2, minmax(0,1fr));\r\n  gap: 10px;\r\n\r\n  padding: 0;\r\n  margin: 0;\r\n\r\n  list-style: none;\r\n}\r\n\r\n.np-root .np-check-list li {\r\n  position: relative;\r\n\r\n  padding: 12px 14px 12px 42px;\r\n\r\n  border: 1px solid var(--np-soft-line);\r\n  border-radius: 13px 4px 13px 4px;\r\n\r\n  background: #fff;\r\n}\r\n\r\n.np-root .np-check-list li::before {\r\n  content: \"✓\";\r\n\r\n  position: absolute;\r\n  left: 13px;\r\n  top: 10px;\r\n\r\n  color: var(--np-green);\r\n\r\n  font-weight: 900;\r\n}\r\n\r\n/* Prompt */\r\n\r\n.np-root .np-prompt {\r\n  position: relative;\r\n\r\n  margin: 15px 0;\r\n  padding: 18px;\r\n\r\n  overflow-x: auto;\r\n\r\n  border-radius: 14px 4px 14px 4px;\r\n\r\n  color: #eaf2ff;\r\n  background: #17264b;\r\n\r\n  font-family:\r\n    \"JetBrains Mono\",\r\n    Consolas,\r\n    \"Microsoft JhengHei\",\r\n    monospace;\r\n\r\n  white-space: pre-wrap;\r\n}\r\n\r\n/* Controls */\r\n\r\n.np-root .np-controls {\r\n  display: grid;\r\n  grid-template-columns: 48px minmax(0,1fr) 48px;\r\n  align-items: center;\r\n  gap: 12px;\r\n\r\n  margin-top: 17px;\r\n}\r\n\r\n.np-root .np-control {\r\n  width: 48px;\r\n  height: 42px;\r\n\r\n  display: grid;\r\n  place-items: center;\r\n\r\n  border: 1px solid var(--np-line);\r\n  border-radius: 14px 5px 14px 5px;\r\n\r\n  color: var(--np-navy);\r\n  background: #fff;\r\n\r\n  font-size: 1.25rem;\r\n  font-weight: 900;\r\n\r\n  cursor: pointer;\r\n}\r\n\r\n.np-root .np-control:hover:not(:disabled) {\r\n  color: #fff;\r\n  background: var(--np-navy);\r\n}\r\n\r\n.np-root .np-control:disabled {\r\n  opacity: .3;\r\n  cursor: default;\r\n}\r\n\r\n.np-root .np-progress {\r\n  height: 8px;\r\n\r\n  overflow: hidden;\r\n\r\n  border-radius: 999px;\r\n  background: #e4ebfa;\r\n}\r\n\r\n.np-root .np-progress-bar {\r\n  width: 0;\r\n  height: 100%;\r\n\r\n  border-radius: inherit;\r\n\r\n  background:\r\n    linear-gradient(\r\n      90deg,\r\n      var(--np-navy),\r\n      var(--np-blue),\r\n      var(--np-coral)\r\n    );\r\n\r\n  transition: width .22s ease;\r\n}\r\n\r\n.np-root .np-page-count {\r\n  grid-column: 2;\r\n  justify-self: center;\r\n\r\n  margin-top: -6px;\r\n\r\n  color: var(--np-muted);\r\n\r\n  font-size: 1.25rem;\r\n  font-weight: 900;\r\n  letter-spacing: .12em;\r\n}\r\n\r\n/* Footer */\r\n\r\n.np-root .np-footer {\r\n  padding: 16px 22px;\r\n\r\n  border-top: 1px solid var(--np-line);\r\n\r\n  color: var(--np-muted);\r\n  background: #f0f5ff;\r\n\r\n  font-size: 1.25rem;\r\n  text-align: center;\r\n}\r\n\r\n/* Accessibility */\r\n\r\n.np-root .np-nav-button:focus-visible,\r\n.np-root .np-tab:focus-visible,\r\n.np-root .np-control:focus-visible,\r\n.np-root .np-external-link:focus-visible {\r\n  outline: 3px solid rgba(255,117,95,.5);\r\n  outline-offset: 2px;\r\n}\r\n\r\n/* Wide desktop / 16:9 classroom displays */\r\n\r\n@media (min-width: 1440px) {\r\n\r\n  .np-root {\r\n    width: calc(100% - 48px);\r\n    max-width: 1800px;\r\n  }\r\n\r\n  .np-root .np-main {\r\n    padding: 24px 28px 32px;\r\n  }\r\n\r\n  .np-root .np-stage {\r\n    padding: clamp(20px, 1.8vw, 32px);\r\n  }\r\n\r\n  .np-root .np-page-head h2 {\r\n    font-size: clamp(1.55rem, 2vw, 2.2rem);\r\n  }\r\n}\r\n\r\n\r\n/* Tablet */\r\n\r\n@media (max-width: 980px) {\r\n\r\n  .np-root {\r\n    border-radius: 20px;\r\n  }\r\n\r\n  .np-root .np-layout {\r\n    grid-template-columns: 190px minmax(0,1fr);\r\n  }\r\n\r\n  .np-root .np-main {\r\n    padding: 15px;\r\n  }\r\n\r\n  .np-root .np-card-grid {\r\n    grid-template-columns: 1fr;\r\n  }\r\n\r\n  .np-root .np-chain {\r\n    grid-template-columns: 1fr;\r\n  }\r\n\r\n  .np-root .np-chain-arrow {\r\n    transform: rotate(90deg);\r\n    text-align: center;\r\n  }\r\n}\r\n\r\n/* Mobile */\r\n\r\n@media (max-width: 720px) {\r\n\r\n  .np-root {\r\n    width: 100%;\r\n    margin: 0 auto;\r\n    border-radius: 14px;\r\n  }\r\n\r\n  .np-root .np-masthead {\r\n    min-height: 92px;\r\n    padding: 15px;\r\n  }\r\n\r\n  .np-root .np-brand-icon {\r\n    width: 52px;\r\n    height: 52px;\r\n\r\n    border-radius: 14px 4px 14px 4px;\r\n\r\n    font-size: 1.4rem;\r\n  }\r\n\r\n  .np-root .np-titleblock h1 {\r\n    letter-spacing: .02em;\r\n  }\r\n\r\n  .np-root .np-titleblock p {\r\n    display: none;\r\n  }\r\n\r\n  .np-root .np-layout {\r\n    display: block;\r\n    min-height: 0;\r\n  }\r\n\r\n  .np-root .np-sidebar {\r\n    padding: 10px;\r\n\r\n    border-right: 0;\r\n    border-bottom: 1px solid var(--np-line);\r\n  }\r\n\r\n  .np-root .np-sidebar-title {\r\n    display: none;\r\n  }\r\n\r\n  .np-root .np-nav {\r\n    display: flex;\r\n    gap: 6px;\r\n\r\n    overflow-x: auto;\r\n\r\n    padding-bottom: 5px;\r\n  }\r\n\r\n  .np-root .np-nav-button {\r\n    flex: 0 0 auto;\r\n\r\n    width: auto;\r\n    max-width: 170px;\r\n  }\r\n\r\n  .np-root .np-nav-label {\r\n    white-space: nowrap;\r\n  }\r\n\r\n  .np-root .np-main {\r\n    padding: 11px 8px 16px;\r\n  }\r\n\r\n  .np-root .np-stage {\r\n    min-height: 0;\r\n    padding: 12px;\r\n    border-radius: 16px 5px 16px 5px;\r\n  }\r\n\r\n  .np-root .np-page-head {\r\n    gap: 9px;\r\n  }\r\n\r\n  .np-root .np-page-number {\r\n    min-width: 40px;\r\n    height: 40px;\r\n  }\r\n\r\n  .np-root .np-card-grid,\r\n  .np-root .np-image-grid,\r\n  .np-root .np-scv,\r\n  .np-root .np-check-list {\r\n    grid-template-columns: 1fr;\r\n  }\r\n\r\n  .np-root .np-site-frame {\r\n    height: 70vh;\r\n    min-height: 480px;\r\n  }\r\n\r\n  .np-root .np-embed-head {\r\n    align-items: flex-start;\r\n    flex-direction: column;\r\n  }\r\n\r\n  .np-root .np-external-link {\r\n    align-self: flex-start;\r\n  }\r\n}\r\n\r\n@media (prefers-reduced-motion: reduce) {\r\n\r\n  .np-root *,\r\n  .np-root *::before,\r\n  .np-root *::after {\r\n    animation-duration: .01ms !important;\r\n    transition-duration: .01ms !important;\r\n    scroll-behavior: auto !important;\r\n  }\r\n}\r\n\n/* Readability: minimum 20px text and space for enlarged navigation labels. */\n.np-root { font-size: 20px; }\n.np-root .np-nav-button { grid-template-columns: 38px minmax(0, 1fr); min-height: 50px; }\n.np-root .np-nav-index { width: 36px; height: 36px; }\n.np-root .np-nav-label { white-space: normal; overflow: visible; text-overflow: clip; line-height: 1.4; }\n@media (max-width: 720px) { .np-root .np-nav-button { max-width: 240px; } }\n/* Self-contained flight simulator: iframe isolates course styles and keyboard input. */\n.np-root .np-formation-toolbar {display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:0 0 16px;}\n.np-root .np-formation-toolbar p {margin:0;flex:1;min-width:220px;}\n.np-root .np-formation-fullscreen {font:inherit;padding:10px 18px;border:1px solid var(--np-blue);border-radius:12px;background:var(--np-blue);color:#fff;cursor:pointer;}\n.np-root .np-formation-fullscreen:focus-visible {outline:3px solid var(--np-coral);outline-offset:3px;}\n.np-root .np-formation-frame {display:block;width:100%;height:1120px;border:1px solid var(--np-line);border-radius:18px;background:#070d19;}\n.np-root .np-formation-frame:fullscreen {height:100vh;width:100vw;border:0;border-radius:0;}\n.np-root .np-formation-notice {margin:12px 0 0;color:var(--np-muted);}\n@media(max-width:1100px){.np-root .np-formation-frame{height:1800px;}}\n@media(max-width:720px){.np-root .np-formation-frame{height:2050px;}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"np-root\">\r\n\r\n\u003cheader class=\"np-masthead\">\r\n  \u003cdiv class=\"np-brand-icon\" aria-hidden=\"true\">🚁\u003c/div>\r\n\r\n  \u003cdiv class=\"np-titleblock\">\r\n    \u003ch1>無人機種類、結構與飛行原理\u003c/h1>\r\n    \u003cp>從機型分類、核心零件到飛行控制｜新興科技・科技介紹課程\u003c/p>\r\n  \u003c/div>\r\n\u003c/header>\r\n\r\n\u003cdiv class=\"np-layout\">\r\n\r\n\u003caside class=\"np-sidebar\">\r\n  \u003cp class=\"np-sidebar-title\">COURSE CONTENT\u003c/p>\r\n  \u003cnav class=\"np-nav\" id=\"np-nav\" aria-label=\"課程章節\">\u003c/nav>\r\n\u003c/aside>\r\n\r\n\u003cmain class=\"np-main\">\r\n\r\n\u003cdiv class=\"np-tabs-wrap\">\r\n  \u003cdiv class=\"np-tabs\" id=\"np-tabs\" role=\"tablist\" aria-label=\"章節內容\">\r\n  \u003c/div>\r\n\u003c/div>\r\n\r\n\u003csection class=\"np-stage\" id=\"np-stage\" aria-live=\"polite\">\r\n\r\n\u003carticle class=\"np-page\" data-title=\"學習目標\">\u003cdiv class=\"np-section\" data-tab-title=\"學習目標\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">01\u003c/div>\u003cdiv>\u003ch2>學習目標\u003c/h2>\u003cp>學習目標｜無人機種類、結構與飛行原理\u003c/p>\u003c/div>\u003c/div>\u003cp>完成本課程後，你應能依任務需求比較四種無人機，說出四旋翼的主要零件，解釋電力、控制訊號與感測資料如何協作，並以推力與力矩說明升降、俯仰、滾轉及偏航。\u003c/p>\u003c/div>\u003c/article>\n\u003carticle class=\"np-page\" data-title=\"無人機種類\">\u003cdiv class=\"np-section\" data-tab-title=\"主題總覽\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">02\u003c/div>\u003cdiv>\u003ch2>無人機種類：依任務選擇機型\u003c/h2>\u003cp>無人機種類｜無人機種類、結構與飛行原理\u003c/p>\u003c/div>\u003c/div>\n\u003cfigure class=\"np-image-card\" style=\"max-width:1194px\" data-source-crop=\"02-00-機型尺寸比較.png\">\u003cimg width=\"1172\" height=\"303\" src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/15e67a9d4ff28183edf9ae876d4b254164c3be3136a4dd72140d5eb851e901ef.png\" alt=\"常見機型尺寸比較（近似值）\">\u003cfigcaption>常見機型尺寸比較（近似值）\u003c/figcaption>\u003c/figure>\n\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"多旋翼無人機\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">02\u003c/div>\u003cdiv>\u003ch2>2.1 多旋翼無人機\u003c/h2>\u003cp>無人機種類｜無人機種類、結構與飛行原理\u003c/p>\u003c/div>\u003c/div>\n\u003cfigure class=\"np-image-card\" style=\"max-width:1189px\" data-source-crop=\"02-01-多旋翼.png\">\u003cimg width=\"1167\" height=\"207\" src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/46fb91d05f936e4f04cdb462af5425cf75663891d97fac61ec009e7306e5edbb.png\" alt=\"多旋翼無人機：懸停與垂直起降\">\u003cfigcaption>多旋翼無人機：懸停與垂直起降\u003c/figcaption>\u003c/figure>\n\u003cp>多旋翼依靠多組馬達與螺旋槳產生推力，可垂直起降並在空中懸停，適合需要固定位置觀察的任務。原圖列出的用途包括航拍、巡檢，也是入門常見的選擇。四旋翼就是多旋翼的一種。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"固定翼無人機\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">02\u003c/div>\u003cdiv>\u003ch2>2.2 固定翼無人機\u003c/h2>\u003cp>無人機種類｜無人機種類、結構與飛行原理\u003c/p>\u003c/div>\u003c/div>\n\u003cfigure class=\"np-image-card\" style=\"max-width:1189px\" data-source-crop=\"02-02-固定翼.png\">\u003cimg width=\"1167\" height=\"219\" src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/e92239c035722a2bf353a248b503d18cbe4b6e6b820681c4a93189aa492ca48e.png\" alt=\"固定翼無人機：航程與效率\">\u003cfigcaption>固定翼無人機：航程與效率\u003c/figcaption>\u003c/figure>\n\u003cp>固定翼具有固定的機翼，飛行時利用氣流通過機翼產生升力。它適合持續向前飛行，通常具有較好的巡航效率，原圖列出測繪、大範圍巡查及長航時任務等用途。一般固定翼不能像多旋翼一樣原地懸停。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"單旋翼無人機\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">02\u003c/div>\u003cdiv>\u003ch2>2.3 單旋翼無人機\u003c/h2>\u003cp>無人機種類｜無人機種類、結構與飛行原理\u003c/p>\u003c/div>\u003c/div>\n\u003cfigure class=\"np-image-card\" style=\"max-width:1189px\" data-source-crop=\"02-03-單旋翼.png\">\u003cimg width=\"1167\" height=\"213\" src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/df3a587278c0e9707f660c107000fc9be052b859ad78a59c511fec49d7f8c03f.png\" alt=\"單旋翼無人機：載重與專業任務\">\u003cfigcaption>單旋翼無人機：載重與專業任務\u003c/figcaption>\u003c/figure>\n\u003cp>單旋翼外形類似直升機，主要靠一組主旋翼提供升力，並需處理主旋翼造成的反作用扭矩。原圖強調其載重表現與較複雜的構造，適合農業、救災等專業任務；實際能力仍須依機型與載荷判斷。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"垂直起降固定翼（VTOL）\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">02\u003c/div>\u003cdiv>\u003ch2>2.4 垂直起降固定翼（VTOL）\u003c/h2>\u003cp>無人機種類｜無人機種類、結構與飛行原理\u003c/p>\u003c/div>\u003c/div>\n\u003cfigure class=\"np-image-card\" style=\"max-width:1189px\" data-source-crop=\"02-04-垂直起降固定翼.png\">\u003cimg width=\"1167\" height=\"209\" src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/fc5bfb3e2f73f46b0a0e842c8dc728bd5dafb45db0b27810c6697809d54bbbd9.png\" alt=\"垂直起降固定翼：起降與巡航\">\u003cfigcaption>垂直起降固定翼：起降與巡航\u003c/figcaption>\u003c/figure>\n\u003cp>這類機型結合垂直起降與固定翼巡航，能在起降空間受限時作業，也能執行較長距離任務。原圖列出的用途為靈活起降、長距作業，並強調地形適應性。\u003c/p>\n\u003cdiv class=\"np-callout\">\u003cstrong>觀念補充：\u003c/strong> VTOL 是「垂直起降」能力的縮寫，並非只指固定翼。這裡依原圖分類，特指兼具垂直起降與固定翼巡航能力的機型。\u003c/div>\n\u003cdiv class=\"np-table-wrap\">\u003ctable class=\"np-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">機型\u003c/th>\u003cth scope=\"col\">原圖強調的特點\u003c/th>\u003cth scope=\"col\">代表用途\u003c/th>\u003cth scope=\"col\">原圖尺寸示意\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>多旋翼\u003c/td>\u003ctd>起降方便、懸停穩定\u003c/td>\u003ctd>航拍、巡檢、入門\u003c/td>\u003ctd>約 30–40 公分\u003c/td>\u003c/tr>\u003ctr>\u003ctd>固定翼\u003c/td>\u003ctd>飛行距離遠、效率高\u003c/td>\u003ctd>測繪、大範圍巡查\u003c/td>\u003ctd>約 1–3 公尺\u003c/td>\u003c/tr>\u003ctr>\u003ctd>單旋翼\u003c/td>\u003ctd>載重較佳、構造較複雜\u003c/td>\u003ctd>農業、救災\u003c/td>\u003ctd>約 1–2 公尺\u003c/td>\u003c/tr>\u003ctr>\u003ctd>垂直起降固定翼\u003c/td>\u003ctd>兼具垂直起降與長航程\u003c/td>\u003ctd>地形受限、長距作業\u003c/td>\u003ctd>約 1.2–3 公尺\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"np-quote\">\u003cstrong>想一想：\u003c/strong> 拍攝建築物外牆細節和測繪大片農地，對懸停、航程與效率的需求有何不同？\u003c/div>\u003c/div>\u003c/article>\n\u003carticle class=\"np-page\" data-title=\"四旋翼結構\">\u003cdiv class=\"np-section\" data-tab-title=\"主題總覽\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">03\u003c/div>\u003cdiv>\u003ch2>四旋翼的主要結構\u003c/h2>\u003cp>四旋翼結構｜無人機種類、結構與飛行原理\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card\" style=\"max-width:1652px\">\u003cimg width=\"1630\" height=\"965\" src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/0d5a4453e3cfd1ad37763312015612bbbbf5e3fd73e7a86593fd8099f3994d6d.png\" alt=\"四旋翼無人機零件位置\">\u003cfigcaption>四旋翼無人機零件位置\u003c/figcaption>\u003c/figure>\n\u003cp>四旋翼不是只有四個螺旋槳，而是機械、電力、感測與控制系統共同運作的結果。觀察圖中的標示，可先把零件分成支撐機身、產生動力、控制飛行及執行任務四類。\u003c/p>\n\u003cdiv class=\"np-table-wrap\">\u003ctable class=\"np-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">零件\u003c/th>\u003cth scope=\"col\">功能\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>機身框架、機臂\u003c/td>\u003ctd>支撐零件、連接馬達，形成機體結構\u003c/td>\u003c/tr>\u003ctr>\u003ctd>螺旋槳\u003c/td>\u003ctd>推動空氣，對機體產生推力\u003c/td>\u003c/tr>\u003ctr>\u003ctd>馬達\u003c/td>\u003ctd>將電能轉為旋轉運動，帶動螺旋槳\u003c/td>\u003c/tr>\u003ctr>\u003ctd>電子調速器（ESC）\u003c/td>\u003ctd>接收控制命令，調節馬達運轉\u003c/td>\u003c/tr>\u003ctr>\u003ctd>電池\u003c/td>\u003ctd>提供飛行與機載設備所需電力\u003c/td>\u003c/tr>\u003ctr>\u003ctd>飛行控制器\u003c/td>\u003ctd>整合操控指令與感測資料，計算各馬達的控制輸出\u003c/td>\u003c/tr>\u003ctr>\u003ctd>GPS 模組\u003c/td>\u003ctd>提供定位與導航所需資料\u003c/td>\u003c/tr>\u003ctr>\u003ctd>天線\u003c/td>\u003ctd>傳送或接收遙控、圖傳等通訊訊號\u003c/td>\u003c/tr>\u003ctr>\u003ctd>相機與雲台\u003c/td>\u003ctd>拍攝影像，並以雲台減少畫面晃動\u003c/td>\u003c/tr>\u003ctr>\u003ctd>起落架\u003c/td>\u003ctd>支撐起降，提供機身與地面間的空間\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"馬達與螺旋槳\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">03\u003c/div>\u003cdiv>\u003ch2>3.1 馬達與螺旋槳\u003c/h2>\u003cp>四旋翼結構｜無人機種類、結構與飛行原理\u003c/p>\u003c/div>\u003c/div>\n\u003cfigure class=\"np-image-card\" style=\"max-width:1125px\" data-source-crop=\"03-01-馬達與螺旋槳.png\">\u003cimg width=\"1103\" height=\"418\" src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/b5771760015b13bfa6000db295b054a54164a4af4f43dd8386ab728f8cd01111.png\" alt=\"馬達與螺旋槳特寫\">\u003cfigcaption>馬達與螺旋槳特寫\u003c/figcaption>\u003c/figure>\n\n\u003cp>馬達負責旋轉，螺旋槳負責推動空氣。原圖以「螺旋槳產生向下氣流」說明旋翼的作用：空氣被向下推動，機體受到向上的反作用力。無刷馬達常用於這類機型，原圖強調其效率與壽命。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"相機與雲台\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">03\u003c/div>\u003cdiv>\u003ch2>3.2 相機與雲台\u003c/h2>\u003cp>四旋翼結構｜無人機種類、結構與飛行原理\u003c/p>\u003c/div>\u003c/div>\n\u003cfigure class=\"np-image-card\" style=\"max-width:1125px\" data-source-crop=\"03-02-相機與雲台.png\">\u003cimg width=\"1103\" height=\"432\" src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/98bc1f725a69f6d46333deaef8726c202e69b872bae21f69a2e0d4795a8d0fc4.png\" alt=\"三軸雲台與相機特寫\">\u003cfigcaption>三軸雲台與相機特寫\u003c/figcaption>\u003c/figure>\n\u003cp>相機負責記錄影像；雲台負責穩定相機方向。三軸雲台能補償機體不同方向的晃動，使航拍或巡檢畫面較平穩。雲台穩定畫面，飛行控制器穩定機體，兩者工作對象不同。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"電池與供電\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">03\u003c/div>\u003cdiv>\u003ch2>3.3 電池與供電\u003c/h2>\u003cp>四旋翼結構｜無人機種類、結構與飛行原理\u003c/p>\u003c/div>\u003c/div>\n\u003cfigure class=\"np-image-card\" style=\"max-width:1125px\" data-source-crop=\"03-03-電池與供電.png\">\u003cimg width=\"1103\" height=\"433\" src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/7d2185e5b77bb30f6933ba7876f9e895c0a90a00b2e1aa0f733c5438d9f2057a.png\" alt=\"電池與電源系統特寫\">\u003cfigcaption>電池與電源系統特寫\u003c/figcaption>\u003c/figure>\n\u003cp>原圖使用鋰聚合物電池（LiPo）作為例子，強調能量密度與重量。電力經分配供應 ESC 與其他模組；電池同時影響續航、重量及可用載荷，不能只以容量大小判斷飛行時間。\u003c/p>\u003c/div>\u003c/article>\n\u003carticle class=\"np-page\" data-title=\"系統協作\">\u003cdiv class=\"np-section\" data-tab-title=\"主題總覽\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">04\u003c/div>\u003cdiv>\u003ch2>零件如何協作：電力、指令與回饋\u003c/h2>\u003cp>系統協作｜無人機種類、結構與飛行原理\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card\" style=\"max-width:1700px\">\u003cimg width=\"1678\" height=\"937\" src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/e17bf7fa47cbefa42d49c4472349188598bece42a985ecbb7b521dde176d4900.png\" alt=\"四旋翼系統協作與資料流\">\u003cfigcaption>四旋翼系統協作與資料流\u003c/figcaption>\u003c/figure>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"動力系統\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">04\u003c/div>\u003cdiv>\u003ch2>4.1 動力系統\u003c/h2>\u003cp>系統協作｜無人機種類、結構與飛行原理\u003c/p>\u003c/div>\u003c/div>\u003cp>動力的基本順序是「電池供電 → ESC 調節 → 馬達旋轉 → 螺旋槳產生推力」。電池提供能量，ESC 依命令控制馬達，馬達再帶動螺旋槳；這些零件缺一不可。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"控制系統\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">04\u003c/div>\u003cdiv>\u003ch2>4.2 控制系統\u003c/h2>\u003cp>系統協作｜無人機種類、結構與飛行原理\u003c/p>\u003c/div>\u003c/div>\u003cp>操作者利用遙控器送出指令，接收器將訊號交給飛行控制器。飛行控制器再決定各個馬達的輸出，讓機體完成指定動作。因此，遙控器輸入的「向前」是目標指令，並不等於直接指定每一顆馬達轉速。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"感測系統與回饋修正\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">04\u003c/div>\u003cdiv>\u003ch2>4.3 感測系統與回饋修正\u003c/h2>\u003cp>系統協作｜無人機種類、結構與飛行原理\u003c/p>\u003c/div>\u003c/div>\u003cp>感測器持續提供姿態、位置及高度等資料。飛行控制器比較目標狀態與感測結果後，修正馬達輸出；機體受風擾動時，也需要這種持續回饋，才能維持穩定。\u003c/p>\n\u003cdiv class=\"np-callout\">\u003cstrong>觀念補充：\u003c/strong> 原圖將陀螺儀、加速度計、氣壓計等集中在感測系統中。實際產品可能把其中多種元件整合在飛行控制器電路板上，並非每種感測器都一定是獨立外接模組。\u003c/div>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"任務設備\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">04\u003c/div>\u003cdiv>\u003ch2>4.4 任務設備\u003c/h2>\u003cp>系統協作｜無人機種類、結構與飛行原理\u003c/p>\u003c/div>\u003c/div>\u003cp>相機、雲台及其他酬載用來完成特定任務。飛行系統讓無人機到達並維持工作位置，任務設備則負責拍攝、偵測、噴灑或運送等工作。\u003c/p>\u003c/div>\u003c/article>\n\u003carticle class=\"np-page\" data-title=\"飛行原理\">\u003cdiv class=\"np-section\" data-tab-title=\"主題總覽\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">05\u003c/div>\u003cdiv>\u003ch2>飛行原理：改變推力與力矩\u003c/h2>\u003cp>飛行原理｜無人機種類、結構與飛行原理\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"np-callout\">依序認識旋翼轉向與受力，並觀察升降、俯仰、滾轉及偏航的對應圖解。\u003c/div>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"為什麼旋翼要分成順時針與逆時針？\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">05\u003c/div>\u003cdiv>\u003ch2>5.1 為什麼旋翼要分成順時針與逆時針？\u003c/h2>\u003cp>飛行原理｜無人機種類、結構與飛行原理\u003c/p>\u003c/div>\u003c/div>\n\u003cfigure class=\"np-image-card\" style=\"max-width:948px\" data-source-crop=\"05-01-旋翼轉向.png\">\u003cimg width=\"926\" height=\"470\" src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/4df6ca9e5d4194e19dc641929ec8c215a625379b1cf2f2f6d907fdea5949fad8.png\" alt=\"旋翼轉向：順時針與逆時針配置\">\u003cfigcaption>旋翼轉向：順時針與逆時針配置\u003c/figcaption>\u003c/figure>\n\u003cp>從上方觀察，原圖的四個旋翼分為順時針（CW）與逆時針（CCW），相鄰旋翼轉向相反、對角旋翼轉向相同。這種配置可讓不同轉向旋翼造成的反作用扭矩互相抵銷，避免機身持續向同一方向旋轉。\u003c/p>\n\u003cdiv class=\"np-callout\">\u003cstrong>觀念補充：\u003c/strong> 圖中轉向是配置示例，不能直接當成所有機型的馬達安裝規則。實機須依機型手冊確認馬達位置、槳型與轉向。\u003c/div>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"懸停與升降\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">05\u003c/div>\u003cdiv>\u003ch2>5.2 懸停與升降\u003c/h2>\u003cp>飛行原理｜無人機種類、結構與飛行原理\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv class=\"np-image-grid\">\u003cfigure class=\"np-image-card\" style=\"max-width:640px\" data-source-crop=\"05-02-受力.png\">\u003cimg width=\"618\" height=\"474\" src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/bae6edb893d24962367250b9b825f99ae27b4ae930db1b963fdd6aeb1d4ca70e.png\" alt=\"受力示意：推力、重力與阻力\">\u003cfigcaption>受力示意：推力、重力與阻力\u003c/figcaption>\u003c/figure>\n\u003cfigure class=\"np-image-card\" style=\"max-width:370px\" data-source-crop=\"05-02-升降.png\">\u003cimg width=\"348\" height=\"338\" src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/564cee07f94c11657cd1b83f3b63220bf5055149930b9275e69fa9d513e03fae.png\" alt=\"升降：改變總推力\">\u003cfigcaption>升降：改變總推力\u003c/figcaption>\u003c/figure>\u003c/div>\n\u003cp>在理想、水平、無風的穩定懸停狀態，旋翼向上合力約等於重量。若向上的合力大於重量，無人機產生向上的加速度；若小於重量，則產生向下的加速度。基本升降控制會協調改變四個旋翼的推力。\u003c/p>\n\u003cdiv class=\"np-callout\">\u003cstrong>觀念補充：\u003c/strong> 「推力大於重量」直接決定的是加速度，不能簡化成所有上升狀態都必須如此。例如穩定等速上升時，仍須考慮阻力及受力平衡。\u003c/div>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"俯仰（Pitch）：機頭抬起或壓低\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">05\u003c/div>\u003cdiv>\u003ch2>5.3 俯仰（Pitch）：機頭抬起或壓低\u003c/h2>\u003cp>飛行原理｜無人機種類、結構與飛行原理\u003c/p>\u003c/div>\u003c/div>\n\u003cfigure class=\"np-image-card\" style=\"max-width:421px\" data-source-crop=\"05-03-俯仰.png\">\u003cimg width=\"399\" height=\"338\" src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/667addf4433753ba6c0b69da8f732b688f8194b91b6001babedab71d9f4bf054.png\" alt=\"俯仰：改變前後推力差\">\u003cfigcaption>俯仰：改變前後推力差\u003c/figcaption>\u003c/figure>\n\u003cp>俯仰是機體繞左右方向的軸轉動。飛行控制器改變前後旋翼群的推力分配，使機體前傾或後傾。當推力方向傾斜，就會出現水平分力，使無人機能前進或後退。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"滾轉（Roll）：機體向左或向右傾斜\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">05\u003c/div>\u003cdiv>\u003ch2>5.4 滾轉（Roll）：機體向左或向右傾斜\u003c/h2>\u003cp>飛行原理｜無人機種類、結構與飛行原理\u003c/p>\u003c/div>\u003c/div>\n\u003cfigure class=\"np-image-card\" style=\"max-width:422px\" data-source-crop=\"05-04-滾轉.png\">\u003cimg width=\"400\" height=\"338\" src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/d4aa20918ba559f6efb7a83fb99611dc069d94d4cacf7d327e6ec89944494c88.png\" alt=\"滾轉：改變左右推力差\">\u003cfigcaption>滾轉：改變左右推力差\u003c/figcaption>\u003c/figure>\n\u003cp>滾轉是機體繞前後方向的軸轉動。左右兩側推力不平衡時，機體會側傾，傾斜後的推力產生水平分力，使無人機可向左或向右移動。原圖以「滾轉／左右平移（側傾）」呈現兩者的關聯。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"偏航（Yaw）：機頭改變方向\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">05\u003c/div>\u003cdiv>\u003ch2>5.5 偏航（Yaw）：機頭改變方向\u003c/h2>\u003cp>飛行原理｜無人機種類、結構與飛行原理\u003c/p>\u003c/div>\u003c/div>\n\u003cfigure class=\"np-image-card\" style=\"max-width:397px\" data-source-crop=\"05-05-偏航.png\">\u003cimg width=\"375\" height=\"338\" src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/2576597e2b1a5e301adbf602463c5ed319eb686409432d3828d4a8289fa552ab.png\" alt=\"偏航：改變反作用扭矩平衡\">\u003cfigcaption>偏航：改變反作用扭矩平衡\u003c/figcaption>\u003c/figure>\n\u003cp>偏航是機體繞垂直軸轉動。控制器調整順時針與逆時針兩組旋翼的輸出，改變反作用扭矩的平衡，使機頭向左或向右轉。執行時還要協調總推力，才能減少不必要的高度變化。\u003c/p>\n\u003cdiv class=\"np-table-wrap\">\u003ctable class=\"np-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">控制項目\u003c/th>\u003cth scope=\"col\">主要改變\u003c/th>\u003cth scope=\"col\">可觀察的動作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>升降\u003c/td>\u003ctd>總推力\u003c/td>\u003ctd>高度改變\u003c/td>\u003c/tr>\u003ctr>\u003ctd>俯仰\u003c/td>\u003ctd>前後推力分配\u003c/td>\u003ctd>前傾或後傾，進而前後移動\u003c/td>\u003c/tr>\u003ctr>\u003ctd>滾轉\u003c/td>\u003ctd>左右推力分配\u003c/td>\u003ctd>左傾或右傾，進而左右移動\u003c/td>\u003c/tr>\u003ctr>\u003ctd>偏航\u003c/td>\u003ctd>兩組反向旋翼的扭矩平衡\u003c/td>\u003ctd>機頭方向改變\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>這是原圖的「四個控制自由度」。機體在空間的運動仍包含三個平移方向及三個旋轉方向；四個控制項目不表示空間運動只有四個自由度。\u003c/p>\u003c/div>\u003c/article>\n\u003carticle class=\"np-page\" data-title=\"感測器與功能\">\u003cdiv class=\"np-section\" data-tab-title=\"感測器與功能\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">06\u003c/div>\u003cdiv>\u003ch2>常見感測器與功能\u003c/h2>\u003cp>感測器與功能｜無人機種類、結構與飛行原理\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card\" style=\"max-width:2189px\">\u003cimg width=\"2167\" height=\"725\" src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/9e620077f68eb32389db7039f1dbbb6181f20924d15b86a6c92f543d61638db2.png\" alt=\"常見感測器功能對照\">\u003cfigcaption>常見感測器功能對照\u003c/figcaption>\u003c/figure>\n\u003cp>無人機要穩定飛行，需要知道自己如何轉動、位於何處，以及距離地面或障礙物多遠。不同感測器提供不同線索，控制器會綜合判斷，而不是只依賴單一數值。\u003c/p>\n\u003cdiv class=\"np-table-wrap\">\u003ctable class=\"np-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">感測器\u003c/th>\u003cth scope=\"col\">主要量測或提供的資料\u003c/th>\u003cth scope=\"col\">對飛行的幫助\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>陀螺儀\u003c/td>\u003ctd>角速度\u003c/td>\u003ctd>估計機體旋轉變化、輔助姿態控制\u003c/td>\u003c/tr>\u003ctr>\u003ctd>加速度計\u003c/td>\u003ctd>比力訊號，含重力相關資訊\u003c/td>\u003ctd>配合其他感測器估計姿態與運動\u003c/td>\u003c/tr>\u003ctr>\u003ctd>氣壓計\u003c/td>\u003ctd>氣壓變化\u003c/td>\u003ctd>估計高度變化\u003c/td>\u003c/tr>\u003ctr>\u003ctd>GPS\u003c/td>\u003ctd>衛星定位資料\u003c/td>\u003ctd>定位與導航\u003c/td>\u003c/tr>\u003ctr>\u003ctd>磁力計\u003c/td>\u003ctd>磁場方向\u003c/td>\u003ctd>輔助判斷方位\u003c/td>\u003c/tr>\u003ctr>\u003ctd>視覺／超音波感測\u003c/td>\u003ctd>影像特徵或距離\u003c/td>\u003ctd>輔助避障、定高及定位；依設備而異\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"np-callout\">\u003cstrong>觀念補充：\u003c/strong> 原圖以簡短文字概括功能。嚴格來說，陀螺儀量測角速度，傾角須由控制器整合估計；加速度計也不能單獨直接給出可靠的長時間位置。氣壓計估算的是氣壓相關高度，不能視為直接量得離地距離。GPS 可提供定位，並不等於能偵測附近障礙物。\u003c/div>\u003c/div>\u003c/article>\n\u003carticle class=\"np-page\" data-title=\"應用與操作\">\u003cdiv class=\"np-section\" data-tab-title=\"主題總覽\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">07\u003c/div>\u003cdiv>\u003ch2>無人機的應用與操作重點\u003c/h2>\u003cp>應用與操作｜無人機種類、結構與飛行原理\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"np-callout\">依序閱讀航拍與巡檢、農業與搜救、物流運輸及安全操作，各子題皆搭配對應圖解。\u003c/div>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"航拍攝影與測繪巡檢\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">07\u003c/div>\u003cdiv>\u003ch2>7.1 航拍攝影與測繪巡檢\u003c/h2>\u003cp>應用與操作｜無人機種類、結構與飛行原理\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv class=\"np-image-grid\">\u003cfigure class=\"np-image-card\" style=\"max-width:419px\" data-source-crop=\"07-01-航拍攝影.png\">\u003cimg width=\"397\" height=\"340\" src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/cd7e18bbdb1fa674c71f7183474f2139ffcdff70b97459b9e69bd37a55551447.png\" alt=\"航拍攝影\">\u003cfigcaption>航拍攝影\u003c/figcaption>\u003c/figure>\n\u003cfigure class=\"np-image-card\" style=\"max-width:423px\" data-source-crop=\"07-01-測繪巡檢.png\">\u003cimg width=\"401\" height=\"340\" src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/22c46a707447f19cc1de6ecb8edfa8d336762d8d3ff1ad8dc779b54aa66085c6.png\" alt=\"測繪巡檢\">\u003cfigcaption>測繪巡檢\u003c/figcaption>\u003c/figure>\u003c/div>\n\u003cp>航拍攝影利用空中視角記錄景觀與影像；測繪巡檢則可用於地形建模、設施觀察及風險偵測。前者常重視構圖與畫面穩定，後者還會重視影像覆蓋、資料品質與任務規劃。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"農業噴灑與救災搜救\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">07\u003c/div>\u003cdiv>\u003ch2>7.2 農業噴灑與救災搜救\u003c/h2>\u003cp>應用與操作｜無人機種類、結構與飛行原理\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv class=\"np-image-grid\">\u003cfigure class=\"np-image-card\" style=\"max-width:412px\" data-source-crop=\"07-02-農業噴灑.png\">\u003cimg width=\"390\" height=\"340\" src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/7dbe3be887b42f563293e2fe6986b169c1b15be46a59caca517806b58db12c5c.png\" alt=\"農業噴灑\">\u003cfigcaption>農業噴灑\u003c/figcaption>\u003c/figure>\n\u003cfigure class=\"np-image-card\" style=\"max-width:444px\" data-source-crop=\"07-02-救災搜救.png\">\u003cimg width=\"422\" height=\"340\" src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/06a31f0c70372967484336c3e0bb6e2550af86e435033a867360582a56d61f8c.png\" alt=\"救災搜救\">\u003cfigcaption>救災搜救\u003c/figcaption>\u003c/figure>\u003c/div>\n\u003cp>農業任務可搭配噴灑或觀測設備，執行精準農業管理。救災搜救則利用空中視野尋找線索、觀察災情；搭載設備、載重與續航會影響能完成的任務。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"物流運輸\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">07\u003c/div>\u003cdiv>\u003ch2>7.3 物流運輸\u003c/h2>\u003cp>應用與操作｜無人機種類、結構與飛行原理\u003c/p>\u003c/div>\u003c/div>\n\u003cfigure class=\"np-image-card\" style=\"max-width:422px\" data-source-crop=\"07-03-物流運輸.png\">\u003cimg width=\"400\" height=\"340\" src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/185c92873f14854be55fb62a4d7d8aa2a5a6e1997c5d0a0f9321cd05f5f9e98e.png\" alt=\"物流運輸\">\u003cfigcaption>物流運輸\u003c/figcaption>\u003c/figure>\n\u003cp>物流無人機可在合適條件下配送物品，原圖提及快速配送及偏遠地區。規劃時需同時考量載重、航程、起降空間與周圍環境，不能只看能否把物品提起。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"原圖列出的安全操作重點\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">07\u003c/div>\u003cdiv>\u003ch2>7.4 原圖列出的安全操作重點\u003c/h2>\u003cp>應用與操作｜無人機種類、結構與飛行原理\u003c/p>\u003c/div>\u003c/div>\n\u003cfigure class=\"np-image-card\" style=\"max-width:2070px\" data-source-crop=\"07-04-安全操作.png\">\u003cimg width=\"2048\" height=\"276\" src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/0ac5ea84ffcb08609c5fb05eebe4f65860429d345b27f3820840ac69cad411a2.png\" alt=\"安全操作重點\">\u003cfigcaption>安全操作重點\u003c/figcaption>\u003c/figure>\n\u003cp>飛行前檢查電量與螺旋槳，確認機體及設備狀況；操作時保持視距、遠離人群與障礙物，並避免不良天候。實際操作前也應確認現場環境與適用飛行規範。\u003c/p>\n\u003cdiv class=\"np-quote\">本段保留原圖的一般提醒，不提供特定地點、空域或資格的法律判定。\u003c/div>\u003c/div>\u003cdiv class=\"np-section\" data-tab-title=\"影片欣賞\">\n  \u003cdiv class=\"np-page-head\">\n    \u003cdiv class=\"np-page-number\">07\u003c/div>\n    \u003cdiv>\u003ch2>7.5 影片欣賞：無人機應用與操作\u003c/h2>\u003cp>應用與操作｜延伸影片\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"np-embed-box\">\n    \u003cdiv class=\"np-embed-head\">\n      \u003cdiv class=\"np-embed-title\">無人機應用與操作｜延伸影片\u003c/div>\n      \u003ca class=\"np-external-link\" href=\"https://www.youtube.com/watch?v=taGL4owMDlA\" target=\"_blank\" rel=\"noopener noreferrer\">在 YouTube 觀看 ↗\u003c/a>\n    \u003c/div>\n    \u003cdiv class=\"np-video\">\n      \u003ciframe src=\"https://www.youtube.com/embed/taGL4owMDlA\" title=\"無人機應用與操作延伸影片（YouTube）\" loading=\"lazy\" allow=\"encrypted-media; picture-in-picture; fullscreen\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\">\u003c/iframe>\n    \u003c/div>\n    \u003cdiv class=\"np-site-note\">若播放器無法載入，請使用上方「在 YouTube 觀看」連結。\u003c/div>\n  \u003c/div>\n\u003c/div>\u003c/article>\n\u003carticle class=\"np-page\" data-title=\"複習與討論\">\u003cdiv class=\"np-section\" data-tab-title=\"主題總覽\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">08\u003c/div>\u003cdiv>\u003ch2>課堂複習與討論\u003c/h2>\u003cp>複習與討論｜無人機種類、結構與飛行原理\u003c/p>\u003c/div>\u003c/div>\u003col>\n\u003cli>為什麼需要長時間停在建築物旁觀察時，多旋翼通常比一般固定翼適合？\u003c/li>\n\u003cli>請依序說出電池、ESC、馬達與螺旋槳的作用。\u003c/li>\n\u003cli>俯仰與偏航有何不同？哪一種主要改變機頭朝向？\u003c/li>\n\u003cli>為什麼無人機向前飛時需要傾斜？傾斜後若要維持高度，還需要協調什麼？\u003c/li>\n\u003cli>GPS 和避障感測器的功能有何不同？\u003c/li>\n\u003cli>若要巡查大片農地，你會優先比較哪三項機型能力？\u003c/li>\n\u003c/ol>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"參考回答\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">08\u003c/div>\u003cdiv>\u003ch2>參考回答\u003c/h2>\u003cp>複習與討論｜無人機種類、結構與飛行原理\u003c/p>\u003c/div>\u003c/div>\u003col>\n\u003cli>多旋翼能懸停並垂直起降，便於固定位置觀察。\u003c/li>\n\u003cli>電池供電，ESC 調節馬達運轉，馬達帶動螺旋槳，螺旋槳推動空氣而產生推力。\u003c/li>\n\u003cli>俯仰是前後傾斜；偏航是繞垂直軸轉動，主要改變機頭朝向。\u003c/li>\n\u003cli>傾斜使推力具有水平分力。維持高度時，還需協調總推力，使垂直分力滿足所需受力條件。\u003c/li>\n\u003cli>GPS 提供定位資料；避障感測器偵測周圍環境或障礙物，兩者不能互相取代。\u003c/li>\n\u003cli>可比較航程／續航、覆蓋效率與載荷能力，也可依現場條件納入起降空間。\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\n\u003carticle class=\"np-page\" data-title=\"來源與閱讀\">\u003cdiv class=\"np-section\" data-tab-title=\"來源與閱讀\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">09\u003c/div>\u003cdiv>\u003ch2>來源與閱讀方式\u003c/h2>\u003cp>來源與閱讀｜無人機種類、結構與飛行原理\u003c/p>\u003c/div>\u003c/div>\u003cul>\n\u003cli>原始素材：專案內「無人機課程／無人機種類、結構與飛行原理.png」。\u003c/li>\n\u003cli>本網頁插圖來自七張 AI 高解析重製圖；機型、零件、飛行原理與應用章節再依子題裁切，原始大圖另行保留。\u003c/li>\n\u003cli>原圖中的機型尺寸、能力與用途為概念示意，實際產品須查看各機型規格。\u003c/li>\n\u003cli>文字依原圖重新分段、改寫；觀念補充用來釐清簡化圖示，不是原圖逐字轉錄。\u003c/li>\n\u003c/ul>\u003c/div>\u003c/article>\n\u003carticle class=\"np-page\" data-title=\"模擬編隊飛行\" id=\"np-formation-chapter\">\n  \u003cdiv class=\"np-section\" data-tab-title=\"互動編隊表演\">\n    \u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">10\u003c/div>\u003cdiv>\u003ch2>模擬編隊飛行\u003c/h2>\u003cp>輸入一個字，設計燈光，再親手操控整個編隊。\u003c/p>\u003c/div>\u003c/div>\n    \u003cdiv class=\"np-formation-toolbar\">\u003cp>試試「愛」與「A」，比較無人機數量；接著改變燈光，拖曳天空移動編隊。\u003c/p>\u003cbutton type=\"button\" class=\"np-formation-fullscreen\" id=\"np-formation-fullscreen\">全螢幕操作\u003c/button>\u003c/div>\n    \u003cdiv id=\"np-formation-mount\">\u003c/div>\n    \u003ctemplate id=\"np-formation-template\">\u003ciframe class=\"np-formation-frame\" title=\"無人機編隊飛行互動模擬\" sandbox=\"allow-scripts\" allow=\"fullscreen\" allowfullscreen srcdoc=\"&lt;!DOCTYPE html&gt;\n&lt;html lang=&quot;zh-Hant ;&gt;DRONE LIGHT SHOW / INTERACTIVE LAB&lt;/p&gt;&lt;h1&gt;把一個字，點亮整片夜空。&lt;/h1&gt;&lt;p class=&quot;muted&quot;&gt;無人機編隊飛行模擬 · 輸入、配色，然後親手領航。&lt;/p&gt;&lt;/div&gt;\n    &lt;span class=&quot;badge&quot;&gt;互動教學模擬&lt;/span&gt;\n  &lt;/header&gt;\n  &lt;div class=&quot;layout&quot;&gt;\n    &lt;section class=&quot;stage&quot; aria-label=&quot;無人機表演區&quot;&gt;\n      &lt;canvas tabindex=&quot;0&quot; aria-label=&quot;無人機編隊動畫。可拖曳移動，或使用方向鍵移動、Q E 旋轉、加減鍵縮放。&quot;&gt;您的瀏覽器需要支援 Canvas 才能顯示模擬。&lt;/canvas&gt;\n      &lt;div class=&quot;stage-top&quot;&gt;&lt;div&gt;&lt;div class=&quot;stage-label&quot;&gt;NIGHT SKY / FORMATION&lt;/div&gt;&lt;div class=&quot;stage-title&quot;&gt;星空表演場&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;live&quot; data-ui=&quot;status&quot;&gt;編隊飛行中&lt;/div&gt;&lt;/div&gt;\n      &lt;div class=&quot;hud&quot;&gt;&lt;div&gt;&lt;strong data-ui=&quot;count&quot;&gt;0&lt;/strong&gt;&lt;span class=&quot;unit&quot;&gt;架&lt;/span&gt;&lt;span&gt;自動配置無人機&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;strong data-ui=&quot;progress&quot;&gt;0&lt;/strong&gt;&lt;span class=&quot;unit&quot;&gt;%&lt;/span&gt;&lt;span&gt;編隊就位率&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;strong data-ui=&quot;zoom&quot;&gt;100&lt;/strong&gt;&lt;span class=&quot;unit&quot;&gt;%&lt;/span&gt;&lt;span&gt;編隊大小&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\n    &lt;/section&gt;\n    &lt;aside aria-label=&quot;表演控制台&quot;&gt;\n      &lt;section class=&quot;panel&quot;&gt;\n        &lt;h2&gt;&lt;span class=&quot;step&quot;&gt;01&lt;/span&gt;設計你的編隊&lt;/h2&gt;\n        &lt;form novalidate&gt;&lt;label for=&quot;np-letter&quot;&gt;輸入一個中文字或英文字母&lt;/label&gt;&lt;div class=&quot;input-row&quot;&gt;&lt;input id=&quot;np-letter&quot; type=&quot;text&quot; value=&quot;夢&quot; autocomplete=&quot;off&quot; spellcheck=&quot;false&quot; aria-describedby=&quot;np-message&quot;&gt;&lt;button type=&quot;submit&quot; class=&quot;primary&quot;&gt;生成編隊&lt;/button&gt;&lt;/div&gt;&lt;/form&gt;\n        &lt;div class=&quot;presets&quot; aria-label=&quot;試試這些字&quot;&gt;&lt;button type=&quot;button&quot; data-letter=&quot;愛&quot;&gt;愛&lt;/button&gt;&lt;button type=&quot;button&quot; data-letter=&quot;飛&quot;&gt;飛&lt;/button&gt;&lt;button type=&quot;button&quot; data-letter=&quot;A&quot;&gt;A&lt;/button&gt;&lt;button type=&quot;button&quot; data-letter=&quot;M&quot;&gt;M&lt;/button&gt;&lt;/div&gt;\n        &lt;p id=&quot;np-message&quot; class=&quot;message&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;\n        &lt;p class=&quot;hint&quot;&gt;筆畫越豐富，取樣光點通常越多；數量依本機字型的筆畫面積計算。&lt;/p&gt;\n      &lt;/section&gt;\n      &lt;section class=&quot;panel&quot;&gt;\n        &lt;h2&gt;&lt;span class=&quot;step&quot;&gt;02&lt;/span&gt;為夜空上色&lt;/h2&gt;\n        &lt;div class=&quot;colors&quot; aria-label=&quot;燈光顏色&quot;&gt;\n          &lt;button type=&quot;button&quot; class=&quot;swatch&quot; style=&quot;--swatch:#6cebd9&quot; data-color=&quot;#6cebd9&quot; aria-label=&quot;薄荷青&quot; aria-pressed=&quot;true&quot;&gt;&lt;/button&gt;\n          &lt;button type=&quot;button&quot; class=&quot;swatch&quot; style=&quot;--swatch:#85b7ff&quot; data-color=&quot;#85b7ff&quot; aria-label=&quot;天空藍&quot; aria-pressed=&quot;false&quot;&gt;&lt;/button&gt;\n          &lt;button type=&quot;button&quot; class=&quot;swatch&quot; style=&quot;--swatch:#ff91c8&quot; data-color=&quot;#ff91c8&quot; aria-label=&quot;櫻花粉&quot; aria-pressed=&quot;false&quot;&gt;&lt;/button&gt;\n          &lt;button type=&quot;button&quot; class=&quot;swatch&quot; style=&quot;--swatch:#ffd47d&quot; data-color=&quot;#ffd47d&quot; aria-label=&quot;暖金色&quot; aria-pressed=&quot;false&quot;&gt;&lt;/button&gt;\n          &lt;input type=&quot;color&quot; value=&quot;#6cebd9&quot; aria-label=&quot;自訂燈光顏色&quot;&gt;\n        &lt;/div&gt;\n        &lt;label class=&quot;check&quot;&gt;&lt;input type=&quot;checkbox&quot; data-ui=&quot;rainbow&quot;&gt;彩虹漸層燈光&lt;/label&gt;\n        &lt;label for=&quot;np-brightness&quot;&gt;燈光亮度 &lt;output data-ui=&quot;brightness&quot;&gt;80%&lt;/output&gt;&lt;/label&gt;&lt;input id=&quot;np-brightness&quot; type=&quot;range&quot; min=&quot;20&quot; max=&quot;100&quot; value=&quot;80&quot;&gt;\n      &lt;/section&gt;\n      &lt;section class=&quot;panel&quot;&gt;\n        &lt;h2&gt;&lt;span class=&quot;step&quot;&gt;03&lt;/span&gt;親手操控編隊&lt;/h2&gt;\n        &lt;p class=&quot;hint&quot;&gt;拖曳天空或長按方向鍵移動整個編隊。&lt;/p&gt;\n        &lt;div class=&quot;pad&quot; aria-label=&quot;編隊移動方向&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;up&quot; data-hold=&quot;up&quot; aria-label=&quot;向上移動&quot;&gt;↑&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;left&quot; data-hold=&quot;left&quot; aria-label=&quot;向左移動&quot;&gt;←&lt;/button&gt;&lt;button type=&quot;button&quot; data-action=&quot;reset&quot;&gt;置中&lt;/button&gt;&lt;button type=&quot;button&quot; data-hold=&quot;right&quot; aria-label=&quot;向右移動&quot;&gt;→&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;up&quot; data-hold=&quot;down&quot; aria-label=&quot;向下移動&quot;&gt;↓&lt;/button&gt;&lt;/div&gt;\n        &lt;div class=&quot;row&quot;&gt;&lt;button type=&quot;button&quot; data-action=&quot;rotateLeft&quot; aria-label=&quot;向左旋轉&quot;&gt;↶ 左轉&lt;/button&gt;&lt;button type=&quot;button&quot; data-action=&quot;rotateRight&quot; aria-label=&quot;向右旋轉&quot;&gt;右轉 ↷&lt;/button&gt;&lt;/div&gt;\n        &lt;div class=&quot;row tools&quot;&gt;&lt;button type=&quot;button&quot; data-action=&quot;smaller&quot;&gt;− 縮小&lt;/button&gt;&lt;button type=&quot;button&quot; data-action=&quot;larger&quot;&gt;＋ 放大&lt;/button&gt;&lt;/div&gt;\n        &lt;div class=&quot;row tools&quot;&gt;&lt;button type=&quot;button&quot; data-action=&quot;pause&quot; aria-pressed=&quot;false&quot;&gt;暫停飛行&lt;/button&gt;&lt;button type=&quot;button&quot; data-action=&quot;replay&quot;&gt;重新起飛&lt;/button&gt;&lt;/div&gt;\n        &lt;p class=&quot;hint&quot;&gt;鍵盤：↑ ↓ ← → 移動 · Q / E 旋轉 · + / − 縮放&lt;br&gt;置中會還原位置、角度與大小。&lt;/p&gt;\n      &lt;/section&gt;\n    &lt;/aside&gt;\n  &lt;/div&gt;\n  &lt;footer&gt;&lt;span&gt;每一個光點，都是一架模擬無人機。&lt;/span&gt;&lt;span&gt;僅為視覺教學模擬；不連線實機，也不計算避碰與真實飛行路徑。&lt;/span&gt;&lt;/footer&gt;\n&lt;/main&gt;\n&lt;script&gt;\n(() =&gt; {\n  &#39;use strict&#39;;\n  const root = document.querySelector(&#39;.np-root&#39;);\n  const $ = selector =&gt; root.querySelector(selector);\n  const all = selector =&gt; [...root.querySelectorAll(selector)];\n  const ui = name =&gt; $(&#39;[data-ui=&quot;&#39; + name + &#39;&quot;]&#39;);\n  const canvas = $(&#39;canvas&#39;), ctx = canvas.getContext(&#39;2d&#39;);\n  const input = $(&#39;#np-letter&#39;), message = $(&#39;#np-message&#39;);\n  const escapeHtml = value =&gt; String(value).replace(/[&amp;&lt;&gt;&quot;&#39;]/g, char =&gt; ({&#39;&amp;&#39;:&#39;&amp;amp;&#39;,&#39;&lt;&#39;:&#39;&amp;lt;&#39;,&#39;&gt;&#39;:&#39;&amp;gt;&#39;,&#39;&quot;&#39;:&#39;&amp;quot;&#39;,&quot;&#39;&quot;:&#39;&amp;#39;&#39;}[char]));\n  if (!ctx) { message.textContent = &#39;此瀏覽器不支援 Canvas，請使用支援的瀏覽器。&#39;; return; }\n  const sample = document.createElement(&#39;canvas&#39;); sample.width = sample.height = 210;\n  const ink = sample.getContext(&#39;2d&#39;, {willReadFrequently:true});\n  const clamp = (n, a, b) =&gt; Math.max(a, Math.min(b, n));\n  const state = {glyph:&#39;夢&#39;,points:[],drones:[],x:0,y:0,angle:0,scale:1,color:&#39;#6cebd9&#39;,rainbow:false,brightness:.8,paused:false};\n  let width = 0, height = 0, last = 0, hudTime = 0, composing = false, timer = 0, drag = null;\n  const held = new Set(), pointers = new Map();\n  const reduced = matchMedia(&#39;(prefers-reduced-motion: reduce)&#39;).matches;\n  const stars = Array.from({length:95},(_,i) =&gt; ({x:((i*73+19)%997)/997,y:((i*137+31)%991)/991,r:i%5===0?1.2:.65}));\n  function resize() {\n    const box = canvas.getBoundingClientRect();\n    width = box.width; height = box.height;\n    const dpr = Math.min(devicePixelRatio || 1, 2);\n    canvas.width = Math.round(width*dpr); canvas.height = Math.round(height*dpr);\n    ctx.setTransform(dpr,0,0,dpr,0,0); constrain();\n  }\n  function createFormation() {\n    clearTimeout(timer);\n    const glyph = input.value.trim();\n    if (!/^(?:[A-Za-z]|\\p{Script=Han})$/u.test(glyph)) {\n      message.classList.add(&#39;error&#39;); message.textContent = &#39;請只輸入一個中文字或一個 A–Z 英文字母。&#39;; input.setAttribute(&#39;aria-invalid&#39;,&#39;true&#39;); return;\n    }\n    ink.clearRect(0,0,210,210); ink.fillStyle = &#39;#fff&#39;;\n    ink.font = &#39;700 170px &quot;Microsoft JhengHei&quot;, &quot;PingFang TC&quot;, &quot;Noto Sans CJK TC&quot;, sans-serif&#39;;\n    ink.textAlign = &#39;center&#39;; ink.textBaseline = &#39;middle&#39;; ink.fillText(glyph,105,110);\n    const pixels = ink.getImageData(0,0,210,210).data;\n    const points = [];\n    for(let y=4;y&lt;210;y+=6) for(let x=4;x&lt;210;x+=6) if(pixels[(y*210+x)*4+3]&gt;100) points.push({x,y});\n    if (!points.length) { message.classList.add(&#39;error&#39;); message.textContent = &#39;目前字型無法繪出此字，請試其他字。&#39;; return; }\n    const minX = Math.min(...points.map(p=&gt;p.x)), maxX = Math.max(...points.map(p=&gt;p.x));\n    const minY = Math.min(...points.map(p=&gt;p.y)), maxY = Math.max(...points.map(p=&gt;p.y));\n    const size = Math.max(maxX-minX,maxY-minY,1);\n    state.points = points.map(p=&gt;({x:(p.x-(minX+maxX)/2)/size,y:(p.y-(minY+maxY)/2)/size}));\n    state.drones = state.points.map((p,i)=&gt;state.drones[i] || {x:width*(.15+.7*Math.random()),y:height-110+Math.random()*25});\n    state.glyph = glyph; reset();\n    input.removeAttribute(&#39;aria-invalid&#39;); message.classList.remove(&#39;error&#39;);\n    message.innerHTML = &#39;「&lt;strong&gt;&#39;+escapeHtml(glyph)+&#39;&lt;/strong&gt;」編隊已生成 · &#39;+state.points.length+&#39; 架無人機&#39;;\n    ui(&#39;count&#39;).textContent = state.points.length;\n    ui(&#39;status&#39;).textContent = state.paused ? &#39;已暫停&#39; : &#39;編隊飛行中&#39;;\n  }\n  function reset() {state.x=0;state.y=0;state.angle=0;state.scale=1;constrain();}\n  function geometry() {\n    const unit=Math.min(width*.66,Math.max(100,height-255))*.86*state.scale;\n    const c=Math.cos(state.angle),s=Math.sin(state.angle);\n    return state.points.map(p=&gt;({x:(p.x*c-p.y*s)*unit,y:(p.x*s+p.y*c)*unit}));\n  }\n  function constrain() {\n    const points=geometry(); if(!points.length || !width || !height)return;\n    const boundX=Math.max(...points.map(p=&gt;Math.abs(p.x))),boundY=Math.max(...points.map(p=&gt;Math.abs(p.y)));\n    const roomX=Math.max(0,width/2-boundX-24),roomY=Math.max(0,(height-210)/2-boundY);\n    state.x=clamp(state.x,-roomX,roomX);state.y=clamp(state.y,-roomY,roomY);\n    ui(&#39;zoom&#39;).textContent=Math.round(state.scale*100);\n  }\n  function action(name) {\n    if(name===&#39;pause&#39;) {state.paused=!state.paused;held.clear();pointers.clear();drag=null;\n      const button=$(&#39;[data-action=&quot;pause&quot;]&#39;);button.textContent=state.paused?&#39;繼續飛行&#39;:&#39;暫停飛行&#39;;button.setAttribute(&#39;aria-pressed&#39;,String(state.paused));\n      ui(&#39;status&#39;).textContent=state.paused?&#39;已暫停&#39;:&#39;編隊飛行中&#39;;return;}\n    if(state.paused) {message.textContent=&#39;請先按「繼續飛行」，再操控編隊。&#39;;return;}\n    if(name===&#39;reset&#39;)reset();\n    if(name===&#39;rotateLeft&#39;)state.angle-=Math.PI/12;\n    if(name===&#39;rotateRight&#39;)state.angle+=Math.PI/12;\n    if(name===&#39;smaller&#39;)state.scale=clamp(state.scale-.1,.6,1.35);\n    if(name===&#39;larger&#39;)state.scale=clamp(state.scale+.1,.6,1.35);\n    if(name===&#39;replay&#39;)state.drones.forEach(d=&gt;{d.x=width*(.15+.7*Math.random());d.y=height-110;});\n    constrain();\n  }\n  function setColor(value) {\n    state.color=value;state.rainbow=false;ui(&#39;rainbow&#39;).checked=false;\n    $(&#39;input[type=color]&#39;).value=value;\n    all(&#39;[data-color]&#39;).forEach(b=&gt;b.setAttribute(&#39;aria-pressed&#39;,String(b.dataset.color===value)));\n  }\n  $(&#39;form&#39;).addEventListener(&#39;s  {\r\n\r\n          return;\r\n\r\n        }\r\n\r\n        selectTab(\r\n          Number(\r\n            button.getAttribute(\r\n              \"data-tab\"\r\n            )\r\n          )\r\n        );\r\n\r\n      }\r\n    );\r\n\r\n\r\n    prevButton.addEventListener(\r\n      \"click\",\r\n      function () {\r\n\r\n        movePage(-1);\r\n\r\n      }\r\n    );\r\n\r\n\r\n    nextButton.addEventListener(\r\n      \"click\",\r\n      function () {\r\n\r\n        movePage(1);\r\n\r\n      }\r\n    );\r\n\r\n\r\n    document.addEventListener(\r\n      \"keydown\",\r\n      function (event) {\r\n\r\n        var target =\r\n          event.target;\r\n\r\n        var tagName =\r\n          target &&\r\n          target.tagName\r\n            ? target.tagName.toLowerCase()\r\n            : \"\";\r\n\r\n        if (\r\n          tagName === \"input\" ||\r\n          tagName === \"textarea\" ||\r\n          tagName === \"select\"\r\n        ) {\r\n\r\n          return;\r\n\r\n        }\r\n\r\n        if (\r\n          event.key ===\r\n          \"ArrowLeft\"\r\n        ) {\r\n\r\n          movePage(-1);\r\n\r\n        }\r\n\r\n        if (\r\n          event.key ===\r\n          \"ArrowRight\"\r\n        ) {\r\n\r\n          movePage(1);\r\n\r\n        }\r\n\r\n      }\r\n    );\r\n\r\n\r\n    window.addEventListener(\r\n      \"hashchange\",\r\n      function () {\r\n\r\n        var oldChapter =\r\n          state.chapter;\r\n\r\n        var oldTab =\r\n          state.tab;\r\n\r\n        readHash();\r\n\r\n        if (\r\n          oldChapter !==\r\n            state.chapter ||\r\n          oldTab !==\r\n            state.tab\r\n        ) {\r\n\r\n          render();\r\n\r\n        }\r\n\r\n      }\r\n    );\r\n\r\n\r\n    readHash();\r\n    render();\r\n\r\n  }\r\n\r\n\r\n  document.addEventListener(\r\n    \"DOMContentLoaded\",\r\n    init\r\n  );\r\n\r\n}());\r\n\u003c/script>\r\n\r\n\u003c/div>\n\n\u003cscript>\n(() => {\n  'use strict';\n  const chapter = docume

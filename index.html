re-line;\r\n}\r\n\r\n.np-root .np-fake-action {\r\n  display: inline-block;\r\n  margin-top: 10px;\r\n  padding: 9px 15px;\r\n\r\n  border-radius: 8px;\r\n\r\n  background: var(--np-coral);\r\n  color: #fff;\r\n\r\n  font-weight: 900;\r\n}\r\n\r\n/* Images */\r\n\r\n.np-root .np-image-grid {\r\n  display: grid;\r\n  grid-template-columns: repeat(2, minmax(0,1fr));\r\n  gap: 15px;\r\n}\r\n\r\n.np-root .np-image-card {\r\n  margin: 0;\r\n  padding: 10px;\r\n\r\n  border: 1px solid var(--np-line);\r\n  border-radius: 18px 5px 18px 5px;\r\n\r\n  background: #fff;\r\n}\r\n\r\n.np-root .np-image-card img {\r\n  width: 100%;\r\n  height: auto;\r\n  display: block;\r\n\r\n  border-radius: 12px 4px 12px 4px;\r\n\r\n  object-fit: contain;\r\n}\r\n\r\n.np-root .np-image-card figcaption {\r\n  padding: 9px 5px 2px;\r\n\r\n  color: var(--np-muted);\r\n  font-size: .8rem;\r\n  font-weight: 800;\r\n  text-align: center;\r\n}\r\n\r\n/* Embedded media */\r\n\r\n.np-root .np-embed-box {\r\n  margin: 15px 0;\r\n\r\n  overflow: hidden;\r\n\r\n  border: 1px solid var(--np-line);\r\n  border-radius: 18px 5px 18px 5px;\r\n\r\n  background: #f5f8ff;\r\n}\r\n\r\n.np-root .np-embed-head {\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: space-between;\r\n  gap: 10px;\r\n\r\n  padding: 10px 14px;\r\n\r\n  border-bottom: 1px solid var(--np-line);\r\n\r\n  background: #edf3ff;\r\n}\r\n\r\n.np-root .np-embed-title {\r\n  min-width: 0;\r\n\r\n  color: var(--np-ink);\r\n  font-weight: 900;\r\n  font-size: .88rem;\r\n}\r\n\r\n.np-root .np-external-link {\r\n  flex: 0 0 auto;\r\n\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: 5px;\r\n\r\n  padding: 6px 10px;\r\n\r\n  border: 1px solid #aabce9;\r\n  border-radius: 9px 3px 9px 3px;\r\n\r\n  color: var(--np-navy) !important;\r\n  background: #fff;\r\n\r\n  font-size: .75rem;\r\n  font-weight: 900;\r\n  text-decoration: none;\r\n}\r\n\r\n.np-root .np-video {\r\n  position: relative;\r\n  width: 100%;\r\n  aspect-ratio: ;\r\n\r\n  color: var(--np-navy);\r\n\r\n  font-weight: 900;\r\n  text-align: center;\r\n}\r\n\r\n.np-root .np-chain-arrow {\r\n  color: var(--np-coral);\r\n  font-size: 1.4rem;\r\n  font-weight: 900;\r\n}\r\n\r\n/* Stop Check Verify */\r\n\r\n.np-root .np-scv {\r\n  display: grid;\r\n  grid-template-columns: repeat(3, minmax(0,1fr));\r\n  gap: 14px;\r\n\r\n  margin: 18px 0;\r\n}\r\n\r\n.np-root .np-scv-card {\r\n  padding: 18px;\r\n\r\n  border: 1px solid var(--np-line);\r\n  border-radius: 19px 5px 19px 5px;\r\n\r\n  background: #fff;\r\n}\r\n\r\n.np-root .np-scv-letter {\r\n  width: 48px;\r\n  height: 48px;\r\n\r\n  display: grid;\r\n  place-items: center;\r\n\r\n  margin-bottom: 10px;\r\n\r\n  border-radius: 14px 4px 14px 4px;\r\n\r\n  color: #fff;\r\n  background: var(--np-blue);\r\n\r\n  font-size: 1.2rem;\r\n  font-weight: 900;\r\n}\r\n\r\n.np-root .np-scv-card:nth-child(1) .np-scv-letter {\r\n  background: var(--np-coral);\r\n}\r\n\r\n.np-root .np-scv-card:nth-child(3) .np-scv-letter {\r\n  background: var(--np-green);\r\n}\r\n\r\n/* Puzzle */\r\n\r\n.np-root .np-puzzle {\r\n  display: grid;\r\n  gap: 10px;\r\n}\r\n\r\n.np-root .np-puzzle-step {\r\n  position: relative;\r\n\r\n  padding: 14px 15px 14px 56px;\r\n\r\n  border: 1px solid var(--np-line);\r\n  border-radius: 15px 5px 15px 5px;\r\n\r\n  background: #fff;\r\n}\r\n\r\n.np-root .np-puzzle-step::before {\r\n  content: attr(data-step);\r\n\r\n  position: absolute;\r\n  left: 13px;\r\n  top: 13px;\r\n\r\n  width: 29px;\r\n  height: 29px;\r\n\r\n  display: grid;\r\n  place-items: center;\r\n\r\n  border-radius: 9px 3px 9px 3px;\r\n\r\n  color: #fff;\r\n  background: var(--np-blue);\r\n\r\n  font-size: .75rem;\r\n  font-weight: 900;\r\n}\r\n\r\n/* Checklist */\r\n\r\n.np-root .np-check-list {\r\n  display: grid;\r\n  grid-template-columns: repeat(2, minmax(0,1fr));\r\n  gap: 10px;\r\n\r\n  padding: 0;\r\n  margin: 0;\r\n\r\n  list-style: none;\r\n}\r\n\r\n.np-root .np-check-list li {\r\n  position: relative;\r\n\r\n  padding: 12px 14px 12px 42px;\r\n\r\n  border: 1px solid var(--np-soft-line);\r\n  border-radius: 13px 4px 13px 4px;\r\n\r\n  background: #fff;\r\n}\r\n\r\n.np-root .np-check-list li::before {\r\n  content: \"✓\";\r\n\r\n  position: absolute;\r\n  left: 13px;\r\n  top: 10px;\r\n\r\n  color: var(--np-green);\r\n\r\n  font-weight: 900;\r\n}\r\n\r\n/* Prompt */\r\n\r\n.np-root .np-prompt {\r\n  position: relative;\r\n\r\n  margin: 15px 0;\r\n  padding: 18px;\r\n\r\n  overflow-x: auto;\r\n\r\n  border-radius: 14px 4px 14px 4px;\r\n\r\n  color: #eaf2ff;\r\n  background: #17264b;\r\n\r\n  font-family:\r\n    \"JetBrains Mono\",\r\n    Consolas,\r\n    \"Microsoft JhengHei\",\r\n    monospace;\r\n\r\n  white-space: pre-wrap;\r\n}\r\n\r\n/* Controls */\r\n\r\n.np-root .np-controls {\r\n  display: grid;\r\n  grid-template-columns: 48px minmax(0,1fr) 48px;\r\n  align-items: center;\r\n  gap: 12px;\r\n\r\n  margin-top: 17px;\r\n}\r\n\r\n.np-root .np-control {\r\n  width: 48px;\r\n  height: 42px;\r\n\r\n  display: grid;\r\n  place-items: center;\r\n\r\n  border: 1px solid var(--np-line);\r\n  border-radius: 14px 5px 14px 5px;\r\n\r\n  color: var(--np-navy);\r\n  background: #fff;\r\n\r\n  font-size: 1.2rem;\r\n  font-weight: 900;\r\n\r\n  cursor: pointer;\r\n}\r\n\r\n.np-root .np-control:hover:not(:disabled) {\r\n  color: #fff;\r\n  background: var(--np-navy);\r\n}\r\n\r\n.np-root .np-control:disabled {\r\n  opacity: .3;\r\n  cursor: default;\r\n}\r\n\r\n.np-root .np-progress {\r\n  height: 8px;\r\n\r\n  overflow: hidden;\r\n\r\n  border-radius: 999px;\r\n  background: #e4ebfa;\r\n}\r\n\r\n.np-root .np-progress-bar {\r\n  width: 0;\r\n  height: 100%;\r\n\r\n  border-radius: inherit;\r\n\r\n  background:\r\n    linear-gradient(\r\n      90deg,\r\n      var(--np-navy),\r\n      var(--np-blue),\r\n      var(--np-coral)\r\n    );\r\n\r\n  transition: width .22s ease;\r\n}\r\n\r\n.np-root .np-page-count {\r\n  grid-column: 2;\r\n  justify-self: center;\r\n\r\n  margin-top: -6px;\r\n\r\n  color: var(--np-muted);\r\n\r\n  font-size: .74rem;\r\n  font-weight: 900;\r\n  letter-spacing: .12em;\r\n}\r\n\r\n/* Footer */\r\n\r\n.np-root .np-footer {\r\n  padding: 16px 22px;\r\n\r\n  border-top: 1px solid var(--np-line);\r\n\r\n  color: var(--np-muted);\r\n  background: #f0f5ff;\r\n\r\n  font-size: .76rem;\r\n  text-align: center;\r\n}\r\n\r\n/* Accessibility */\r\n\r\n.np-root .np-nav-button:focus-visible,\r\n.np-root .np-tab:focus-visible,\r\n.np-root .np-control:focus-visible,\r\n.np-root .np-external-link:focus-visible {\r\n  outline: 3px solid rgba(255,117,95,.5);\r\n  outline-offset: 2px;\r\n}\r\n\r\n/* Wide desktop / 16:9 classroom displays */\r\n\r\n@media (min-width: 1440px) {\r\n\r\n  .np-root {\r\n    width: calc(100% - 48px);\r\n    max-width: 1800px;\r\n  }\r\n\r\n  .np-root .np-main {\r\n    padding: 24px 28px 32px;\r\n  }\r\n\r\n  .np-root .np-stage {\r\n    padding: clamp(20px, 1.8vw, 32px);\r\n  }\r\n\r\n  .np-root .np-page-head h2 {\r\n    font-size: clamp(1.55rem, 2vw, 2.2rem);\r\n  }\r\n}\r\n\r\n\r\n/* Tablet */\r\n\r\n@media (max-width: 980px) {\r\n\r\n  .np-root {\r\n    border-radius: 20px;\r\n  }\r\n\r\n  .np-root .np-layout {\r\n    grid-template-columns: 190px minmax(0,1fr);\r\n  }\r\n\r\n  .np-root .np-main {\r\n    padding: 15px;\r\n  }\r\n\r\n  .np-root .np-card-grid {\r\n    grid-template-columns: 1fr;\r\n  }\r\n\r\n  .np-root .np-chain {\r\n    grid-template-columns: 1fr;\r\n  }\r\n\r\n  .np-root .np-chain-arrow {\r\n    transform: rotate(90deg);\r\n    text-align: center;\r\n  }\r\n}\r\n\r\n/* Mobile */\r\n\r\n@media (max-width: 720px) {\r\n\r\n  .np-root {\r\n    width: 100%;\r\n    margin: 0 auto;\r\n    border-radius: 14px;\r\n  }\r\n\r\n  .np-root .np-masthead {\r\n    min-height: 92px;\r\n    padding: 15px;\r\n  }\r\n\r\n  .np-root .np-brand-icon {\r\n    width: 52px;\r\n    height: 52px;\r\n\r\n    border-radius: 14px 4px 14px 4px;\r\n\r\n    font-size: 1.4rem;\r\n  }\r\n\r\n  .np-root .np-titleblock h1 {\r\n    letter-spacing: .02em;\r\n  }\r\n\r\n  .np-root .np-titleblock p {\r\n    display: none;\r\n  }\r\n\r\n  .np-root .np-layout {\r\n    display: block;\r\n    min-height: 0;\r\n  }\r\n\r\n  .np-root .np-sidebar {\r\n    padding: 10px;\r\n\r\n    border-right: 0;\r\n    border-bottom: 1px solid var(--np-line);\r\n  }\r\n\r\n  .np-root .np-sidebar-title {\r\n    display: none;\r\n  }\r\n\r\n  .np-root .np-nav {\r\n    display: flex;\r\n    gap: 6px;\r\n\r\n    overflow-x: auto;\r\n\r\n    padding-bottom: 5px;\r\n  }\r\n\r\n  .np-root .np-nav-button {\r\n    flex: 0 0 auto;\r\n\r\n    width: auto;\r\n    max-width: 170px;\r\n  }\r\n\r\n  .np-root .np-nav-label {\r\n    white-space: nowrap;\r\n  }\r\n\r\n  .np-root .np-main {\r\n    padding: 11px 8px 16px;\r\n  }\r\n\r\n  .np-root .np-stage {\r\n    min-height: 0;\r\n    padding: 12px;\r\n    border-radius: 16px 5px 16px 5px;\r\n  }\r\n\r\n  .np-root .np-page-head {\r\n    gap: 9px;\r\n  }\r\n\r\n  .np-root .np-page-number {\r\n    min-width: 40px;\r\n    height: 40px;\r\n  }\r\n\r\n  .np-root .np-card-grid,\r\n  .np-root .np-image-grid,\r\n  .np-root .np-scv,\r\n  .np-root .np-check-list {\r\n    grid-template-columns: 1fr;\r\n  }\r\n\r\n  .np-root .np-site-frame {\r\n    height: 70vh;\r\n    min-height: 480px;\r\n  }\r\n\r\n  .np-root .np-embed-head {\r\n    align-items: flex-start;\r\n    flex-direction: column;\r\n  }\r\n\r\n  .np-root .np-external-link {\r\n    align-self: flex-start;\r\n  }\r\n}\r\n\r\n@media (prefers-reduced-motion: reduce) {\r\n\r\n  .np-root *,\r\n  .np-root *::before,\r\n  .np-root *::after {\r\n    animation-duration: .01ms !important;\r\n    transition-duration: .01ms !important;\r\n    scroll-behavior: auto !important;\r\n  }\r\n}\r\n\u003c/style>\n\u003cstyle>\n/* Local readability and image sizing overrides; reference theme and navigation are retained. */\n.np-root{font-size:20px;}\n.np-root .np-titleblock p,.np-root .np-sidebar-title,.np-root .np-nav-index,.np-root .np-nav-label,.np-root .np-tab,.np-root .np-page-number,.np-root .np-page-head p,.np-root .np-quote,.np-root .np-message-head,.np-root .np-image-card figcaption,.np-root .np-embed-title,.np-root .np-external-link,.np-root .np-site-note,.np-root .np-table th,.np-root .np-table td,.np-root .np-puzzle-step::before,.np-root .np-control,.np-root .np-page-count,.np-root .np-footer{font-size:20px;}\n.np-root .np-section h3{font-size:clamp(20px,2vw,1.3rem);}\n.np-root .np-nav-button{grid-template-columns:40px minmax(0,1fr);}\n.np-root .np-nav-index{width:36px;height:36px;}\n.np-root .np-nav-label{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;line-height:1.4;}\n.np-root .np-tab{line-height:1.4;}\n.np-root .np-footer{line-height:1.7;}\n@media(max-width:720px){.np-root .np-nav-button{max-width:240px;}}\n.np-root .vr-figure{margin:18px auto;width:100%;}\n.np-root .vr-figure img{height:auto;object-fit:contain;}\n.np-root .np-section p{overflow-wrap:anywhere;}\n\u003c/style>\n\r\n\r\n\r\n\r\n\r\n\u003c/head>\u003cbody>\n\u003cdiv class=\"np-root\">\r\n\r\n\u003cheader class=\"np-masthead\">\r\n  \u003cdiv class=\"np-brand-icon\" aria-hidden=\"true\">🥽\u003c/div>\r\n\r\n  \u003cdiv class=\"np-titleblock\">\r\n    \u003ch1>VR頭盔科技原理與生活應用\u003c/h1>\r\n    \u003cp>從硬體結構到沉浸體驗｜原理・互動・生活應用\u003c/p>\r\n  \u003c/div>\r\n\u003c/header>\r\n\r\n\u003cdiv class=\"np-layout\">\r\n\r\n\u003caside class=\"np-sidebar\">\r\n  \u003cp class=\"np-sidebar-title\">COURSE CONTENT\u003c/p>\r\n  \u003cnav class=\"np-nav\" id=\"np-nav\" aria-label=\"課程章節\">\u003c/nav>\r\n\u003c/aside>\r\n\r\n\u003cmain class=\"np-main\">\r\n\r\n\u003cdiv class=\"np-tabs-wrap\">\r\n  \u003cdiv class=\"np-tabs\" id=\"np-tabs\" role=\"tablist\" aria-label=\"章節內容\">\r\n  \u003c/div>\r\n\u003c/div>\r\n\r\n\u003csection class=\"np-stage\" id=\"np-stage\" aria-live=\"polite\">\r\n\r\n\u003carticle class=\"np-page\" data-title=\"學習目標\">\n\u003cdiv class=\"np-section\" data-tab-title=\"學習目標\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">01\u003c/div>\u003cdiv>\u003ch2>學習目標\u003c/h2>\u003cp>學習目標\u003c/p>\u003c/div>\u003c/div>\u003cp>閱讀本講義後，應能說明 VR 頭盔的主要硬體及其功能，理解感測、追蹤、運算與顯示如何配合，並能舉出生活應用、優點與使用限制。\u003c/p>\u003cfigure class=\"np-image-card vr-figure\" style=\"max-width:1100px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/f3d6224c4cd840933afb560d55ea9a1203289cce960156512df5542b70d12974.jpeg\" alt=\"完整資訊圖表\" decoding=\"async\">\u003cfigcaption>完整資訊圖表\u003c/figcaption>\u003c/figure>\u003c/div>\n\u003c/article>\n\u003carticle class=\"np-page\" data-title=\"一、VR 頭盔的硬體結構\">\n\u003cdiv class=\"np-section\" data-tab-title=\"概覽\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">02\u003c/div>\u003cdiv>\u003ch2>概覽\u003c/h2>\u003cp>一、VR 頭盔的硬體結構\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vr-figure\" style=\"max-width:900px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/c6f2d6a892fa379e64cb0fa0308db80009e632baa4cb0405b3e992330dd88f08.png\" alt=\"硬體結構圖解\" decoding=\"async\">\u003cfigcaption>硬體結構圖解\u003c/figcaption>\u003c/figure>\u003cp>\u003cem>原資訊圖表擷取：硬體結構。\u003c/em>\u003c/p>\u003cp>VR（Virtual Reality，虛擬實境）頭盔透過顯示、光學、感測、運算與電源等系統共同運作，讓使用者觀看並與虛擬世界互動，形成沉浸式體驗。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"顯示面板與鏡片\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">02\u003c/div>\u003cdiv>\u003ch2>1. 顯示面板與鏡片：讓近距離影像成為可觀看的虛擬場景\u003c/h2>\u003cp>一、VR 頭盔的硬體結構\u003c/p>\u003c/div>\u003c/div>\u003cp>顯示面板負責產生影像，原圖列出 LCD 與 OLED 兩種面板。面板位於眼睛前方，鏡片則放在眼睛與面板之間，將影像放大，讓使用者看到較寬廣的虛擬畫面。\u003c/p>\u003cp>依原圖「由眼向外」的結構示意，排列為：\u003cstrong>人眼 → 鏡片 → 顯示面板 → 機身\u003c/strong>。其中，人眼接收影像、鏡片負責光學放大、面板產生影像，機身容納元件。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"攝影機、感測器與 IMU\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">02\u003c/div>\u003cdiv>\u003ch2>2. 攝影機、感測器與 IMU：掌握頭部動作及周圍環境\u003c/h2>\u003cp>一、VR 頭盔的硬體結構\u003c/p>\u003c/div>\u003c/div>\u003cp>頭盔上的攝影機可用於 Inside-out 追蹤，也就是從頭盔本身觀察外部環境，辨識可供定位的視覺特徵。環境感測器則提供周圍空間或距離的資訊。\u003c/p>\u003cp>IMU 是慣性感測單元，原圖列出加速度計與陀螺儀，用來感測動作與轉動。軟體可整合 IMU 與攝影機的資料，更新使用者在虛擬世界中的視角。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"處理晶片、散熱模組與電池\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">02\u003c/div>\u003cdiv>\u003ch2>3. 處理晶片、散熱模組與電池：維持運算及運作\u003c/h2>\u003cp>一、VR 頭盔的硬體結構\u003c/p>\u003c/div>\u003c/div>\u003cp>處理晶片執行系統、處理感測資料並運算影像。散熱模組透過散熱片、風扇等設計協助維持運作穩定，電池或供電系統則提供裝置所需的電力。原圖以電池供電的頭盔作為示意，說明其可支援無線使用。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"配戴與聲音元件\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">02\u003c/div>\u003cdiv>\u003ch2>4. 配戴與聲音元件：影響舒適度及互動體驗\u003c/h2>\u003cp>一、VR 頭盔的硬體結構\u003c/p>\u003c/div>\u003c/div>\u003cp>外殼保護內部結構，頭帶與固定系統使頭盔穩定配戴，面部襯墊則使用柔軟材質提升舒適度。IPD（瞳距）調整功能用來調整左右鏡片間距，使鏡片位置更符合使用者雙眼。\u003c/p>\u003cp>揚聲器輸出聲音，麥克風接收語音，兩者支援溝通與語音互動。原圖標示的尺寸及重量示例為寬約 \u003cstrong>18～22 公分\u003c/strong>、重約 \u003cstrong>450～650 公克\u003c/strong>，不代表每一款裝置都落在這個範圍。\u003c/p>\u003c/div>\n\u003c/article>\n\u003carticle class=\"np-page\" data-title=\"二、VR 頭盔的硬體運作原理\">\n\u003cdiv class=\"np-section\" data-tab-title=\"光學成像\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">03\u003c/div>\u003cdiv>\u003ch2>1. 光學成像：把小面板變成寬廣畫面\u003c/h2>\u003cp>二、VR 頭盔的硬體運作原理\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vr-figure\" style=\"max-width:575px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/e3e862767cf8907e932d252ecc6abe9c465244ed93c1a8330ef2e7e1243b7087.png\" alt=\"光學成像圖解\" decoding=\"async\">\u003cfigcaption>光學成像圖解\u003c/figcaption>\u003c/figure>\u003cp>VR 頭盔的顯示面板雖然靠近眼睛，仍需透過鏡片形成適合觀看的影像。原圖以「顯示面板 → 鏡片 → 寬視角影像」說明此流程，並以約 \u003cstrong>90～120 度\u003c/strong>作為視角示例。視角描述可見範圍的大小，實際值依裝置設計而異。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"立體視覺\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">03\u003c/div>\u003cdiv>\u003ch2>2. 立體視覺：左右眼接收不同視角\u003c/h2>\u003cp>二、VR 頭盔的硬體運作原理\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vr-figure\" style=\"max-width:461px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/44ef8a492d76336f6e5aa9c0292b73e80c153a2e94fc9b66f595150631c4e6cf.png\" alt=\"立體視覺圖解\" decoding=\"async\">\u003cfigcaption>立體視覺圖解\u003c/figcaption>\u003c/figure>\u003cp>頭盔分別提供左右眼略有差異的畫面，大腦將這兩幅影像整合，產生深度與立體感。因此，VR 並非只是把同一張平面圖片放大，而是透過雙眼視差呈現空間感。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"頭部追蹤\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">03\u003c/div>\u003cdiv>\u003ch2>3. 頭部追蹤：讓畫面跟著觀看方向改變\u003c/h2>\u003cp>二、VR 頭盔的硬體運作原理\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vr-figure\" style=\"max-width:561px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/3285d4e8fe655e4c4cdc081cd161b8136c5ffe11859925fb01ad05dc86681073.png\" alt=\"頭部追蹤圖解\" decoding=\"async\">\u003cfigcaption>頭部追蹤圖解\u003c/figcaption>\u003c/figure>\u003cp>當使用者抬頭、低頭或左右轉動時，IMU 與攝影機提供動作資訊，系統據此更新虛擬攝影機的方向及位置。這讓使用者感到自己正在環視同一個虛擬空間。\u003c/p>\u003cp>原圖以 X、Y、Z 三軸表示前後、左右及上下方向，協助理解三維空間中的移動。追蹤資料必須持續更新，才能使觀看方向與畫面變化相互配合。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"空間定位\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">03\u003c/div>\u003cdiv>\u003ch2>4. 空間定位：辨識環境並建立相對位置\u003c/h2>\u003cp>二、VR 頭盔的硬體運作原理\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vr-figure\" style=\"max-width:721px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/7584a775891a315dc7c05ee6a1575af0369ba634af12db5dd88bd7867a68a746.png\" alt=\"空間定位圖解\" decoding=\"async\">\u003cfigcaption>空間定位圖解\u003c/figcaption>\u003c/figure>\u003cp>系統辨識環境中的角點、紋理等視覺特徵，進一步建立空間地圖，估計使用者與環境的相對位置。例如，使用者在現實空間向前移動，系統就需要在虛擬世界中反映相應的位置變化。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"音訊互動\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">03\u003c/div>\u003cdiv>\u003ch2>5. 音訊互動：以聲音補足空間感\u003c/h2>\u003cp>二、VR 頭盔的硬體運作原理\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vr-figure\" style=\"max-width:868px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/9eaa87089f5aedfaccb76e61649c0619830f804ee5cf5c77f72cf2b899f8c29f.png\" alt=\"音訊互動圖解\" decoding=\"async\">\u003cfigcaption>音訊互動圖解\u003c/figcaption>\u003c/figure>\u003cp>空間音訊透過聲音的方向感加強沉浸體驗。原圖以左側、右側、前方與後方聲音為例，說明聲音可以協助使用者感受虛擬物件或事件所在的方向。\u003c/p>\u003c/div>\n\u003c/article>\n\u003carticle class=\"np-page\" data-title=\"三、VR 頭盔的軟體原理\">\n\u003cdiv class=\"np-section\" data-tab-title=\"從感測資料到使用者回饋的完整流程\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">04\u003c/div>\u003cdiv>\u003ch2>1. 從感測資料到使用者回饋的完整流程\u003c/h2>\u003cp>三、VR 頭盔的軟體原理\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vr-figure\" style=\"max-width:1100px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/2a548f919c7f497c6267d17edd4882a84f843eb6441f3f95ba2b787b08fdd620.png\" alt=\"感測到回饋流程圖解\" decoding=\"async\">\u003cfigcaption>感測到回饋流程圖解\u003c/figcaption>\u003c/figure>\u003cp>VR 軟體需要將感測資料轉換為即時、正確且流暢的虛擬世界。原圖的流程可依序整理為：\u003c/p>\u003cp>\u003cstrong>感測輸入 → 姿態估測 → 場景更新 → 即時渲染 → 左右眼輸出 → 使用者回饋\u003c/strong>\u003c/p>\u003cp>首先，系統接收 IMU、攝影機與控制器等資料。接著估算頭部位置及轉動，更新虛擬場景中的物件與視角，再運算出左右眼各自需要的畫面。使用者看到影像、聽到聲音後做出動作，新的資料又回到系統，形成持續循環。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"追蹤演算法\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">04\u003c/div>\u003cdiv>\u003ch2>2. 追蹤演算法：融合不同感測來源\u003c/h2>\u003cp>三、VR 頭盔的軟體原理\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vr-figure\" style=\"max-width:380px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/6e3c62dcbf9a98961cc60c0221cb7b029ed04a13fbf2f470e0d4b8ef3aff03c6.png\" alt=\"追蹤演算法圖解\" decoding=\"async\">\u003cfigcaption>追蹤演算法圖解\u003c/figcaption>\u003c/figure>\u003cp>追蹤演算法融合 IMU 與攝影機資料，用來提升追蹤穩定度。IMU 提供動作資訊，攝影機提供環境中的視覺特徵，系統透過整合資料來估計頭盔姿態。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"SLAM 與空間建圖\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">04\u003c/div>\u003cdiv>\u003ch2>3. SLAM 與空間建圖：一邊定位，一邊認識環境\u003c/h2>\u003cp>三、VR 頭盔的軟體原理\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vr-figure\" style=\"max-width:330px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/1a162c65e6d15af4541fda862d380baa40a47f1cb4efa6ad630a76115e8b9c09.png\" alt=\"SLAM與空間建圖圖解\" decoding=\"async\">\u003cfigcaption>SLAM與空間建圖圖解\u003c/figcaption>\u003c/figure>\u003cp>SLAM 指「同步定位與建圖」。系統在尚未完整認識的環境中，持續估計自己所在的位置，同時建立周圍的地圖。原圖以辨識並建立 3D 地圖的方式呈現這項技術。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"低延遲\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">04\u003c/div>\u003cdiv>\u003ch2>4. 低延遲：縮短動作到畫面更新的等待\u003c/h2>\u003cp>三、VR 頭盔的軟體原理\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vr-figure\" style=\"max-width:356px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/ad591716bff098942aec0889dc4dfbb5822aedb857db2414f4ab53dfc36ef81d.png\" alt=\"低延遲圖解\" decoding=\"async\">\u003cfigcaption>低延遲圖解\u003c/figcaption>\u003c/figure>\u003cp>延遲是使用者做出動作後，到畫面反映該動作之間的時間差。延遲過高時，頭部動作與畫面變化較難一致；降低延遲有助於維持畫面穩定及觀看舒適度。原圖以 \u003cstrong>低於 20 毫秒\u003c/strong>作為低延遲示例，而非所有裝置或情境的統一保證。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"高刷新率\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">04\u003c/div>\u003cdiv>\u003ch2>5. 高刷新率：讓連續動作更流暢\u003c/h2>\u003cp>三、VR 頭盔的軟體原理\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vr-figure\" style=\"max-width:329px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/bfec55e15ad58b9c7f034f6d1cb2a556ea384320c32e9e185d627316a8aaa14e.png\" alt=\"高刷新率圖解\" decoding=\"async\">\u003cfigcaption>高刷新率圖解\u003c/figcaption>\u003c/figure>\u003cp>刷新率描述顯示器每秒更新畫面的次數，單位是 Hz。原圖列出 \u003cstrong>72 Hz、90 Hz、120 Hz\u003c/strong>等示例；例如 90 Hz 表示顯示器每秒更新 90 次。較高的刷新率有助於呈現流暢動作，仍需配合系統運算及內容輸出。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"畸變校正\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">04\u003c/div>\u003cdiv>\u003ch2>6. 畸變校正：補償鏡片造成的形變\u003c/h2>\u003cp>三、VR 頭盔的軟體原理\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vr-figure\" style=\"max-width:356px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/6d478ed5e81ceb314f90432c1046b971e1f7eeccdf006c1ec081111842b3e438.png\" alt=\"畸變校正圖解\" decoding=\"async\">\u003cfigcaption>畸變校正圖解\u003c/figcaption>\u003c/figure>\u003cp>頭盔鏡片可能使畫面產生幾何變形。軟體在輸出前進行相應校正，讓使用者透過鏡片觀看時，影像形狀更接近預期。原圖以校正前的變形影像與校正後的正常影像作對照。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"注視點渲染\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">04\u003c/div>\u003cdiv>\u003ch2>7. 注視點渲染：把運算集中在觀看重點\u003c/h2>\u003cp>三、VR 頭盔的軟體原理\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vr-figure\" style=\"max-width:362px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/ed29ff881a6640b73ad7e13baaa9299960a33aeacf301985839a55119e8c7859.png\" alt=\"注視點渲染圖解\" decoding=\"async\">\u003cfigcaption>注視點渲染圖解\u003c/figcaption>\u003c/figure>\u003cp>注視點渲染（Foveated Rendering）將較多繪圖資源集中在觀看重點，周圍區域則採用較低細節。原圖以「視線焦點高解析度、周邊區域較低解析度」呈現此概念，目的是讓運算資源分配更有效率。\u003c/p>\u003cdiv class=\"np-callout\">本節重點：原圖以「低延遲＋穩定幀率＝較佳沉浸體驗」整理軟體效能的重要性。刷新率是顯示端的更新頻率，幀率則是內容產生畫面的速率，閱讀時可分別理解。\u003c/div>\u003c/div>\n\u003c/article>\n\u003carticle class=\"np-page\" data-title=\"四、使用者如何與虛擬世界互動\">\n\u003cdiv class=\"np-section\" data-tab-title=\"四、使用者如何與虛擬世界互動\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">05\u003c/div>\u003cdiv>\u003ch2>四、使用者如何與虛擬世界互動\u003c/h2>\u003cp>四、使用者如何與虛擬世界互動\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vr-figure\" style=\"max-width:900px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/389c8c3f56b936091196d682d9cb042e40feafc30633086526f4b0252d8eeb9b.png\" alt=\"人機互動方式圖解\" decoding=\"async\">\u003cfigcaption>人機互動方式圖解\u003c/figcaption>\u003c/figure>\u003cp>\u003cem>原資訊圖表擷取：人機互動方式。\u003c/em>\u003c/p>\u003cp>VR 可透過多種輸入方式，讓使用者自然地操作虛擬環境。\u003c/p>\u003cdiv class=\"np-table-wrap\">\u003ctable class=\"np-table\">\u003cthead>\u003ctr>\u003cth>互動方式\u003c/th>\u003cth>原圖中的作用\u003c/th>\u003cth>課堂理解示例\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>頭部轉動\u003c/td>\u003ctd>自然觀看與轉向\u003c/td>\u003ctd>轉頭觀察虛擬場景的不同方向\u003c/td>\u003c/tr>\u003ctr>\u003ctd>手把控制器\u003c/td>\u003ctd>移動、選擇與操作\u003c/td>\u003ctd>選取物件或操作虛擬工具\u003c/td>\u003c/tr>\u003ctr>\u003ctd>手勢辨識\u003c/td>\u003ctd>以手部動作互動\u003c/td>\u003ctd>伸手指向或抓取虛擬物件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>語音輸入\u003c/td>\u003ctd>語音指令與操控\u003c/td>\u003ctd>用口語指令呼叫功能\u003c/td>\u003c/tr>\u003ctr>\u003ctd>視線追蹤\u003c/td>\u003ctd>注視選擇與互動\u003c/td>\u003ctd>將視線停留在目標上進行選擇\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>表中的課堂示例是對原圖功能的文字化說明；實際支援哪些方式，須視裝置與軟體而定。\u003c/p>\u003c/div>\n\u003c/article>\n\u003carticle class=\"np-page\" data-title=\"五、VR 的生活應用\">\n\u003cdiv class=\"np-section\" data-tab-title=\"教育學習\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">06\u003c/div>\u003cdiv>\u003ch2>1. 教育學習：把抽象或難以到達的情境帶入課堂\u003c/h2>\u003cp>五、VR 的生活應用\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vr-figure\" style=\"max-width:359px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/7a0c3dd307f550d8d6a2753e287264539467cf6a81bebf5badaaf20ad4a69944.png\" alt=\"教育學習圖解\" decoding=\"async\">\u003cfigcaption>教育學習圖解\u003c/figcaption>\u003c/figure>\u003cp>VR 可用於虛擬教室、歷史場景與科學模擬。學生透過觀看和操作探索情境，將文字與平面圖片轉化為較具空間感的學習經驗。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"醫療訓練\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">06\u003c/div>\u003cdiv>\u003ch2>2. 醫療訓練：提供模擬練習情境\u003c/h2>\u003cp>五、VR 的生活應用\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vr-figure\" style=\"max-width:342px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/0800b9ed69e71e3ee0b0156d792ed1c952b37fc09c49f59ee1ddb9ec34c79e13.png\" alt=\"醫療訓練圖解\" decoding=\"async\">\u003cfigcaption>醫療訓練圖解\u003c/figcaption>\u003c/figure>\u003cp>原圖列出手術演練與復健治療等應用，呈現 VR 可用於專業訓練及相關輔助活動。這裡是應用領域介紹，並不表示一般 VR 內容可直接取代專業醫療處置。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"工業與職業訓練\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">06\u003c/div>\u003cdiv>\u003ch2>3. 工業與職業訓練：模擬設備及作業流程\u003c/h2>\u003cp>五、VR 的生活應用\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vr-figure\" style=\"max-width:345px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/ccb4fd456100447a8a7d8ca0b77eab4662695fb4b51af14d9d42c419d1eed3d8.png\" alt=\"工業與職業訓練圖解\" decoding=\"async\">\u003cfigcaption>工業與職業訓練圖解\u003c/figcaption>\u003c/figure>\u003cp>VR 可用於危險作業模擬與設備維修訓練。學習者能在模擬環境中認識工具、熟悉步驟，並練習面對特定工作情境。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"娛樂遊戲\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">06\u003c/div>\u003cdiv>\u003ch2>4. 娛樂遊戲：結合場景、動作與聲音\u003c/h2>\u003cp>五、VR 的生活應用\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vr-figure\" style=\"max-width:345px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/d346f77c54faf55db889fcbb6b57c0b6045c60089758aa8b23abb77eba88808c.png\" alt=\"娛樂遊戲圖解\" decoding=\"async\">\u003cfigcaption>娛樂遊戲圖解\u003c/figcaption>\u003c/figure>\u003cp>沉浸式遊戲與互動體驗結合立體影像、追蹤及聲音，使玩家透過觀看、移動與操作參與虛擬世界。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"建築設計\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">06\u003c/div>\u003cdiv>\u003ch2>5. 建築設計：在空間完成前進行預覽\u003c/h2>\u003cp>五、VR 的生活應用\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vr-figure\" style=\"max-width:343px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/99a806259730cd845125dd92f9c4e7551e8609a0b10434e10d13668413671197.png\" alt=\"建築設計圖解\" decoding=\"async\">\u003cfigcaption>建築設計圖解\u003c/figcaption>\u003c/figure>\u003cp>VR 可用於空間預覽與室內設計展示。觀看者能以接近身處其中的方式，理解空間配置與設計效果。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"社交與觀光\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">06\u003c/div>\u003cdiv>\u003ch2>6. 社交與觀光：跨越實體距離參與活動\u003c/h2>\u003cp>五、VR 的生活應用\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vr-figure\" style=\"max-width:368px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/ad8a52ec8453744db316c9afbc3a4421a94e27491fdf0747407367642fe23a1f.png\" alt=\"社交與觀光圖解\" decoding=\"async\">\u003cfigcaption>社交與觀光圖解\u003c/figcaption>\u003c/figure>\u003cp>原圖列出虛擬會議與遠距導覽。使用者可透過虛擬場景參加交流活動，或探索無法立即親自前往的地點。\u003c/p>\u003c/div>\n\u003c/article>\n\u003carticle class=\"np-page\" data-title=\"六、VR 的優點與限制\">\n\u003cdiv class=\"np-section\" data-tab-title=\"優點\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">07\u003c/div>\u003cdiv>\u003ch2>1. 優點\u003c/h2>\u003cp>六、VR 的優點與限制\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vr-figure\" style=\"max-width:650px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/53e759975a3603bbc72f5b1f1ed04cceaa5c365f7e068bd578d7e7720fa4e4cc.png\" alt=\"優點圖解\" decoding=\"async\">\u003cfigcaption>優點圖解\u003c/figcaption>\u003c/figure>\u003cp>VR 的主要優點包括沉浸感高、互動性強、可模擬高風險情境，以及提升學習動機。這些特點使它適合需要空間理解、情境體驗與反覆練習的活動。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"限制\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">07\u003c/div>\u003cdiv>\u003ch2>2. 限制\u003c/h2>\u003cp>六、VR 的優點與限制\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vr-figure\" style=\"max-width:900px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/29979270f08cde499aae0b84b7c90664e0041304927da7ba529f216c0b883a55.png\" alt=\"限制圖解\" decoding=\"async\">\u003cfigcaption>限制圖解\u003c/figcaption>\u003c/figure>\u003cp>原圖提醒，VR 可能造成暈眩，配戴舒適度與續航也有限制，並且需要相應的軟硬體運算資源。長時間使用時，還必須注意眼睛與身體感受，以及周圍空間的安全。\u003c/p>\u003cp>因此，規劃課程時應把設備能力、活動時間及實體空間一併納入考量，而不只著重畫面是否逼真。\u003c/p>\u003c/div>\n\u003c/article>\n\u003carticle class=\"np-page\" data-title=\"七、教學重點整理\">\n\u003cdiv class=\"np-section\" data-tab-title=\"核心硬體\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">08\u003c/div>\u003cdiv>\u003ch2>1. 核心硬體：顯示、鏡片、感測器與運算\u003c/h2>\u003cp>七、教學重點整理\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vr-figure\" style=\"max-width:678px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/327a1a0dd96d45e73290c909c8d14759dc702ac2b14e19cc9db8887a784bfb7f.png\" alt=\"核心硬體圖解\" decoding=\"async\">\u003cfigcaption>核心硬體圖解\u003c/figcaption>\u003c/figure>\u003cp>顯示面板產生影像，鏡片提供光學成像，感測器取得動作與環境資料，處理晶片則協調運算。這些元件共同構成 VR 體驗的硬體基礎。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"核心軟體\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">08\u003c/div>\u003cdiv>\u003ch2>2. 核心軟體：追蹤、建圖、渲染與校正\u003c/h2>\u003cp>七、教學重點整理\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vr-figure\" style=\"max-width:900px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/2679e7a2fdc7ad8ea94aee23a6493318fbc47c2d9280a5867f5de0c75b2912da.png\" alt=\"核心軟體圖解\" decoding=\"async\">\u003cfigcaption>核心軟體圖解\u003c/figcaption>\u003c/figure>\u003cp>追蹤演算法估計姿態，SLAM 協助定位與建圖，即時渲染產生畫面，畸變校正補償光學形變。它們必須持續配合，才能使使用者動作與虛擬場景同步。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"核心價值\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">08\u003c/div>\u003cdiv>\u003ch2>3. 核心價值：沉浸、互動、模擬與應用擴展\u003c/h2>\u003cp>七、教學重點整理\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vr-figure\" style=\"max-width:738px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/7e0afe8db161aabe291a9676b5f6a238a531699fd6076fb55f0aad42b94ee772.png\" alt=\"核心價值圖解\" decoding=\"async\">\u003cfigcaption>核心價值圖解\u003c/figcaption>\u003c/figure>\u003cp>VR 的價值在於將視覺、聲音與操作結合，使使用者能探索情境、練習操作並理解空間。選擇應用時，可思考這項活動是否能從沉浸、互動或模擬中獲得具體幫助。\u003c/p>\u003c/div>\n\u003c/article>\n\u003carticle class=\"np-page\" data-title=\"八、課堂思考與自我檢核\">\n\u003cdiv class=\"np-section\" data-tab-title=\"概覽\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">09\u003c/div>\u003cdiv>\u003ch2>概覽\u003c/h2>\u003cp>八、課堂思考與自我檢核\u003c/p>\u003c/div>\u003c/div>\u003col>\u003cli>VR 頭盔為什麼需要鏡片，而不只是把顯示面板放在眼前？\u003c/li>\u003cli>左右眼畫面略有不同，如何幫助我們感受到立體空間？\u003c/li>\u003cli>IMU 與攝影機各提供哪類資訊？為什麼要融合使用？\u003c/li>\u003cli>請用自己的話說明 SLAM 的「定位」與「建圖」。\u003c/li>\u003cli>延遲與刷新率有什麼不同？\u003c/li>\u003cli>選擇一個生活應用，說明它運用了哪些硬體、軟體與互動方式。\u003c/li>\u003cli>規劃一次 VR 課堂體驗時，應考量哪些設備限制與空間安全問題？\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"參考答案要點\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">09\u003c/div>\u003cdiv>\u003ch2>參考答案要點\u003c/h2>\u003cp>八、課堂思考與自我檢核\u003c/p>\u003c/div>\u003c/div>\u003col>\u003cli>鏡片協助放大近距離面板影像，形成適合觀看的虛擬畫面。\u003c/li>\u003cli>雙眼接收不同視角，大腦整合後產生深度感。\u003c/li>\u003cli>IMU 提供動作與轉動資訊，攝影機提供環境視覺特徵；融合資料有助於穩定追蹤。\u003c/li>\u003cli>定位是估計自身所在位置；建圖是建立周圍環境的空間表示。\u003c/li>\u003cli>延遲是動作到畫面反映的時間差；刷新率是顯示器每秒更新畫面的次數。\u003c/li>\u003cli>例如建築預覽需要立體顯示、頭部追蹤、場景渲染，並可搭配控制器操作。\u003c/li>\u003cli>可考量暈眩、配戴舒適度、續航、運算能力、使用時間與周圍障礙物。\u003c/li>\u003c/ol>\u003chr>\u003cp>\u003cstrong>內容來源：\u003c/strong> 使用者提供之「VR頭盔科技原理與生活應用資訊圖表.png」。本講義依原圖改寫、分段與編排；教學示例及自我檢核為延伸設計。\u003c/p>\u003c/div>\n\u003c/article>\n\u003carticle class=\"np-page\" data-title=\"圖片連結清單\">\n\u003cdiv class=\"np-section\" data-tab-title=\"概覽\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">10\u003c/div>\u003cdiv>\u003ch2>概覽\u003c/h2>\u003cp>圖片連結清單\u003c/p>\u003c/div>\u003c/div>\u003cp>下列圖片由 HackMD 上傳功能產生連結，可在其他 Markdown 講義中使用 \u003ccode>![圖片說明](圖片連結)\u003c/code> 嵌入。\u003c/p>\u003cdiv class=\"np-table-wrap\">\u003ctable class=\"np-table\">\u003cthead>\u003ctr>\u003cth>圖片\u003c/th>\u003cth>連結\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>完整資訊圖表\u003c/td>\u003ctd>\u003ca href=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/f3d6224c4cd840933afb560d55ea9a1203289cce960156512df5542b70d12974.jpeg\" target=\"_blank\" rel=\"noopener noreferrer\">完整資訊圖表圖片 ↗\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>硬體結構\u003c/td>\u003ctd>\u003ca href=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/c6f2d6a892fa379e64cb0fa0308db80009e632baa4cb0405b3e992330dd88f08.png\" target=\"_blank\" rel=\"noopener noreferrer\">硬體結構圖片 ↗\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>硬體運作原理\u003c/td>\u003ctd>\u003ca href=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/bb83530e2738a6dc271f0525090917e87e2ebd9239857cd225125890dd76b315.png\" target=\"_blank\" rel=\"noopener noreferrer\">硬體運作原理圖片 ↗\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>軟體原理\u003c/td>\u003ctd>\u003ca href=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/67c157e5e67b5 x += 1\r\n    ) {\r\n\r\n      index +=\r\n        getSections(\r\n          pages[chapterIndex]\r\n        ).length;\r\n\r\n    }\r\n\r\n    index += state.tab + 1;\r\n\r\n    return index;\r\n\r\n  }\r\n\r\n\r\n  function renderNavigation() {\r\n\r\n    var html = pages.map(\r\n      function (page, index) {\r\n\r\n        var title =\r\n          page.getAttribute(\"data-title\") ||\r\n          (\"章節 \" + (index + 1));\r\n\r\n        var current =\r\n          index === state.chapter;\r\n\r\n        return (\r\n          '\u003cbutton ' +\r\n            'class=\"np-nav-button\" ' +\r\n            'type=\"button\" ' +\r\n            'data-chapter=\"' +\r\n            index +\r\n            '\" ' +\r\n            'aria-current=\"' +\r\n            (current ? \"true\" : \"false\") +\r\n            '\">' +\r\n\r\n            '\u003cspan class=\"np-nav-index\">' +\r\n              pad(index + 1) +\r\n            '\u003c/span>' +\r\n\r\n            '\u003cspan class=\"np-nav-label\">' +\r\n              escapeHtml(title) +\r\n            '\u003c/span>' +\r\n\r\n          '\u003c/button>'\r\n        );\r\n\r\n      }\r\n    ).join(\"\");\r\n\r\n    nav.innerHTML = html;\r\n\r\n  }\r\n\r\n\r\n  function renderTabs() {\r\n\r\n    var currentPage =\r\n      getCurrentPage();\r\n\r\n    var sections =\r\n      getSections(currentPage);\r\n\r\n    var html =\r\n      sections.map(\r\n        function (section, index) {\r\n\r\n          var title =\r\n            section.getAttribute(\r\n              \"data-tab-title\"\r\n            ) ||\r\n            (\"內容 \" + (index + 1));\r\n\r\n          var selected =\r\n            index === state.tab;\r\n\r\n          return (\r\n            '\u003cbutton ' +\r\n              'class=\"np-tab\" ' +\r\n              'type=\"button\" ' +\r\n              'role=\"tab\" ' +\r\n              'data-tab=\"' +\r\n              index +\r\n              '\" ' +\r\n              'aria-selected=\"' +\r\n              (selected ? \"true\" : \"false\") +\r\n              '\">' +\r\n\r\n              escapeHtml(title) +\r\n\r\n            '\u003c/button>'\r\n          );\r\n\r\n        }\r\n      ).join(\"\");\r\n\r\n    tabs.innerHTML = html;\r\n\r\n  }\r\n\r\n\r\n  function showCurrentContent() {\r\n\r\n    pages.forEach(\r\n      function (page, index) {\r\n\r\n        page.classList.toggle(\r\n          \"is-active\",\r\n          index === state.chapter\r\n        );\r\n\r\n        var sections =\r\n          getSections(page);\r\n\r\n        sections.forEach(\r\n          function (\r\n            section,\r\n            sectionIndex\r\n          ) {\r\n\r\n            section.style.display =\r\n              (\r\n                index === state.chapter &&\r\n                sectionIndex === state.tab\r\n              )\r\n                ? \"block\"\r\n                : \"none\";\r\n\r\n          }\r\n        );\r\n\r\n      }\r\n    );\r\n\r\n  }\r\n\r\n\r\n  function updateControls() {\r\n\r\n    var total =\r\n      getTotalSubPages();\r\n\r\n    var current =\r\n      getCurrentSubPageIndex();\r\n\r\n    prevButton.disabled =\r\n      current \u003c= 1;\r\n\r\n    nextButton.disabled =\r\n      current >= total;\r\n\r\n    progress.style.width =\r\n      (\r\n        (current / total) *\r\n        100\r\n      ).toFixed(2) + \"%\";\r\n\r\n    pageCount.textContent =\r\n      pad(current) +\r\n      \" / \" +\r\n      pad(total);\r\n\r\n  }\r\n\r\n\r\n  function updateHash() {\r\n\r\n    var chapter =\r\n      pad(state.chapter + 1);\r\n\r\n    var tab =\r\n      state.tab + 1;\r\n\r\n    var newHash =\r\n      \"#chapter-\" +\r\n      chapter +\r\n      \"-tab-\" +\r\n      tab;\r\n\r\n    if (\r\n      location.hash !==\r\n      newHash\r\n    ) {\r\n\r\n      history.replaceState(\r\n        null,\r\n        \"\",\r\n        newHash\r\n      );\r\n\r\n    }\r\n\r\n  }\r\n\r\n\r\n  function scrollSelectedIntoView() {\r\n\r\n    var activeNav =\r\n      nav.querySelector(\r\n        '[aria-current=\"true\"]'\r\n      );\r\n\r\n    var activeTab =\r\n      tabs.querySelector(\r\n        '[aria-selected=\"true\"]'\r\n      );\r\n\r\n    if (activeNav) {\r\n\r\n      activeNav.scrollIntoView({\r\n        behavior: \"smooth\",\r\n        block: \"nearest\",\r\n        inline: \"center\"\r\n      });\r\n\r\n    }\r\n\r\n    if (activeTab) {\r\n\r\n      activeTab.scrollIntoView({\r\n        behavior: \"smooth\",\r\n        block: \"nearest\",\r\n        inline: \"center\"\r\n      });\r\n\r\n    }\r\n\r\n  }\r\n\r\n\r\n  function render() {\r\n\r\n    var currentPage =\r\n      getCurrentPage();\r\n\r\n    var sections =\r\n      getSections(currentPage);\r\n\r\n    if (\r\n      state.tab \u003c 0 ||\r\n      state.tab >= sections.length\r\n    ) {\r\n\r\n      state.tab = 0;\r\n\r\n    }\r\n\r\n    renderNavigation();\r\n    renderTabs();\r\n    showCurrentContent();\r\n    updateControls();\r\n    updateHash();\r\n    scrollSelectedIntoView();\r\n\r\n  }\r\n\r\n\r\n  function selectChapter(index) {\r\n\r\n    if (\r\n      !Number.isInteger(index) ||\r\n      index \u003c 0 ||\r\n      index >= pages.length\r\n    ) {\r\n\r\n      return;\r\n\r\n    }\r\n\r\n    state.chapter = index;\r\n    state.tab = 0;\r\n\r\n    render();\r\n\r\n  }\r\n\r\n\r\n  function selectTab(index) {\r\n\r\n    var currentPage =\r\n      getCurrentPage();\r\n\r\n    var sections =\r\n      getSections(currentPage);\r\n\r\n    if (\r\n      !Number.isInteger(index) ||\r\n      index \u003c 0 ||\r\n      index >= sections.length\r\n    ) {\r\n\r\n      return;\r\n\r\n    }\r\n\r\n    state.tab = index;\r\n\r\n    render();\r\n\r\n  }\r\n\r\n\r\n  /*\r\n   * 重點：\r\n   * 上一頁 / 下一頁改成以子題為單位移動。\r\n   */\r\n  function movePage(delta) {\r\n\r\n    var currentPage =\r\n      getCurrentPage();\r\n\r\n    var currentSections =\r\n      getSections(currentPage);\r\n\r\n\r\n    /* 下一頁 */\r\n    if (delta > 0) {\r\n\r\n      /*\r\n       * 同一主題仍有下一個子題\r\n       */\r\n      if (\r\n        state.tab \u003c\r\n        currentSections.length - 1\r\n      ) {\r\n\r\n        state.tab += 1;\r\n\r\n        render();\r\n\r\n        return;\r\n\r\n      }\r\n\r\n\r\n      /*\r\n       * 已經是本主題最後一個子題\r\n       * 才進入下一主題\r\n       */\r\n      if (\r\n        state.chapter \u003c\r\n        pages.length - 1\r\n      ) {\r\n\r\n        state.chapter += 1;\r\n        state.tab = 0;\r\n\r\n        render();\r\n\r\n      }\r\n\r\n      return;\r\n\r\n    }\r\n\r\n\r\n    /* 上一頁 */\r\n    if (delta \u003c 0) {\r\n\r\n      /*\r\n       * 同一主題仍有上一個子題\r\n       */\r\n      if (\r\n        state.tab > 0\r\n      ) {\r\n\r\n        state.tab -= 1;\r\n\r\n        render();\r\n\r\n        return;\r\n\r\n      }\r\n\r\n\r\n      /*\r\n       * 已經是本主題第一個子題\r\n       * 回到上一主題最後一個子題\r\n       */\r\n      if (\r\n        state.chapter > 0\r\n      ) {\r\n\r\n        state.chapter -= 1;\r\n\r\n        var previousPage =\r\n          getCurrentPage();\r\n\r\n        var previousSections =\r\n          getSections(\r\n            previousPage\r\n          );\r\n\r\n        state.tab =\r\n          Math.max(\r\n            0,\r\n            previousSections.length - 1\r\n          );\r\n\r\n        render();\r\n\r\n      }\r\n\r\n    }\r\n\r\n  }\r\n\r\n\r\n  function readHash() {\r\n\r\n    var match =\r\n      location.hash.match(\r\n        /^#chapter-(\\d{1,2})-tab-(\\d{1,2})$/\r\n      );\r\n\r\n    if (!match) {\r\n      return;\r\n    }\r\n\r\n    var chapter =\r\n      Number(match[1]) - 1;\r\n\r\n    var tab =\r\n      Number(match[2]) - 1;\r\n\r\n    if (\r\n      Number.isInteger(chapter) &&\r\n      chapter >= 0 &&\r\n      chapter \u003c pages.length\r\n    ) {\r\n\r\n      state.chapter =\r\n        chapter;\r\n\r\n      var sections =\r\n        getSections(\r\n          pages[chapter]\r\n        );\r\n\r\n      if (\r\n        Number.isInteger(tab) &&\r\n        tab >= 0 &&\r\n        tab \u003c sections.length\r\n      ) {\r\n\r\n        state.tab =\r\n          tab;\r\n\r\n      } else {\r\n\r\n        state.tab = 0;\r\n\r\n      }\r\n\r\n    }\r\n\r\n  }\r\n\r\n\r\n  function init() {\r\n\r\n    root =\r\n      document.querySelector(\r\n        \".np-root\"\r\n      );\r\n\r\n    if (!root) {\r\n      return;\r\n    }\r\n\r\n    nav =\r\n      root.querySelector(\r\n        \"#np-nav\"\r\n      );\r\n\r\n    tabs =\r\n      root.querySelector(\r\n        \"#np-tabs\"\r\n      );\r\n\r\n    prevButton =\r\n      root.querySelector(\r\n        \"#np-prev\"\r\n      );\r\n\r\n    nextButton =\r\n      root.querySelector(\r\n        \"#np-next\"\r\n      );\r\n\r\n    progress =\r\n      root.querySelector(\r\n        \"#np-progress\"\r\n      );\r\n\r\n    pageCount =\r\n      root.querySelector(\r\n        \"#np-page-count\"\r\n      );\r\n\r\n    pages =\r\n      getPages();\r\n\r\n\r\n    nav.addEventListener(\r\n      \"click\",\r\n      function (event) {\r\n\r\n        var button =\r\n          event.target.closest(\r\n            \"[data-chapter]\"\r\n          );\r\n\r\n        if (\r\n          !button ||\r\n          !nav.contains(button)\r\n        ) {\r\n\r\n          return;\r\n\r\n        }\r\n\r\n        selectChapter(\r\n          Number(\r\n            button.getAttribute(\r\n              \"data-chapter\"\r\n            )\r\n          )\r\n        );\r\n\r\n      }\r\n    );\r\n\r\n\r\n    tabs.addEventListener(\r\n      \"click\",\r\n      function (event) {\r\n\r\n        var button =\r\n          event.target.closest(\r\n            \"[data-tab]\"\r\n          );\r\n\r\n        if (\r\n          !button ||\r\n          !tabs.contains(button)\r\n        ) {\r\n\r\n          return;\r\n\r\n        }\r\n\r\n        selectTab(\r\n          Number(\r\n            button.getAttribute(\r\n              \"data-tab\"\r\n            )\r\n          )\r\n        );\r\n\r\n      }\r\n    );\r\n\r\n\r\n    prevButton.addEventListener(\r\n      \"click\",\r\n      function () {\r\n\r\n        movePage(-1);\r\n\r\n      }\r\n    );\r\n\r\n\r\n    nextButton.addEventListener(\r\n      \"click\",\r\n      function () {\r\n\r\n        movePage(1);\r\n\r\n      }\r\n    );\r\n\r\n\r\n    document.addEventListener(\r\n      \"keydown\",\r\n      function (event) {\r\n\r\n        var target =\r\n          event.target;\r\n\r\n        var tagName =\r\n          target &&\r\n          target.tagName\r\n            ? target.tagName.toLowerCase()\r\n            : \"\";\r\n\r\n        if (\r\n          tagName === \"input\" ||\r\n          tagName === \"textarea\" ||\r\n          tagName === \"select\"\r\n        ) {\r\n\r\n          return;\r\n\r\n        }\r\n\r\n        if (\r\n          event.key ===\r\n          \"ArrowLeft\"\r\n        ) {\r\n\r\n          movePage(-1);\r\n\r\n        }\r\n\r\n        if (\r\n          event.key ===\r\n          \"ArrowRight\"\r\n        ) {\r\n\r\n          movePage(1);\r\n\r\n        }\r\n\r\n      }\r\n    );\r\n\r\n\r\n    window.addEventListener(\r\n      \"hashchange\",\r\n      function () {\r\n\r\n        var oldChapter =\r\n          state.chapter;\r\n\r\n        var oldTab =\r\n          state.tab;\r\n\r\n        readHash();\r\n\r\n        if (\r\n          oldChapter !==\r\n            state.chapter ||\r\n          oldTab !==\r\n            state.tab\r\n        ) {\r\n\r\n          render();\r\n\r\n        }\r\n\r\n      }\r\n    );\r\n\r\n\r\n    readHash();\r\n    render();\r\n\r\n  }\r\n\r\n\r\n  document.addEventListener(\r\n    \"DOMContentLoaded\",\r\n    init\r\n  );\r\n\r\n}());\r\n\u003c/script>\r\n\r\n\u003c/div>\n\u003c/body>\u003c/html>\n"},{"id":"drone","label":"無人機課程","file":"無人機課程/無人機種類、結構與飛行原理.html","html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-Hant\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>無人機種類、結構與飛行原理\u003c/title>\n\u003cstyle>\r\n.np-root,\r\n.np-root * {\r\n  box-sizing: border-box;\r\n}\r\n\r\n.np-root {\r\n  --np-navy: #2f4f9

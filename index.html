solid var(--np-coral);\r\n\r\n  background: linear-gradient(135deg, #fff7f4, #fff);\r\n\r\n  color: #6f3f36;\r\n\r\n  font-size: 1.04rem;\r\n  font-weight: 800;\r\n}\r\n\r\n.np-root .np-keywords {\r\n  display: flex;\r\n  flex-wrap: wrap;\r\n  gap: 8px;\r\n\r\n  margin: 15px 0;\r\n}\r\n\r\n.np-root .np-keyword {\r\n  padding: 8px 13px;\r\n\r\n  border: 1px solid #b8c9f4;\r\n  border-radius: 999px;\r\n\r\n  background: #f7f9ff;\r\n\r\n  color: var(--np-navy);\r\n\r\n  font-weight: 800;\r\n}\r\n\r\n/* Message */\r\n\r\n.np-root .np-message {\r\n  overflow: hidden;\r\n\r\n  border: 1px solid var(--np-line);\r\n  border-radius: 18px 5px 18px 5px;\r\n\r\n  background: #fff;\r\n}\r\n\r\n.np-root .np-message-head {\r\n  padding: 10px 14px;\r\n\r\n  color: #fff;\r\n  background: linear-gradient(110deg, var(--np-navy), #4e6bd2);\r\n\r\n  font-size: .82rem;\r\n  font-weight: 800;\r\n}\r\n\r\n.np-root .np-message-body {\r\n  padding: 18px;\r\n  white-space: pre-line;\r\n}\r\n\r\n.np-root .np-fake-action {\r\n  display: inline-block;\r\n  margin-top: 10px;\r\n  padding: 9px 15px;\r\n\r\n  border-radius: 8px;\r\n\r\n  background: var(--np-coral);\r\n  color: #fff;\r\n\r\n  font-weight: 900;\r\n}\r\n\r\n/* Images */\r\n\r\n.np-root .np-image-grid {\r\n  display: grid;\r\n  grid-template-columns: repeat(2, minmax(0,1fr));\r\n  gap: 15px;\r\n}\r\n\r\n.np-root .np-image-card {\r\n  margin: 0;\r\n  padding: 10px;\r\n\r\n  border: 1px solid var(--np-line);\r\n  border-radius: 18px 5px 18px 5px;\r\n\r\n  background: #fff;\r\n}\r\n\r\n.np-root .np-image-card img {\r\n  width: 100%;\r\n  height: auto;\r\n  display: block;\r\n\r\n  border-radius: 12px 4px 12px 4px;\r\n\r\n  object-fit: contain;\r\n}\r\n\r\n.np-root .np-image-card figcaption {\r\n  padding: 9px 5px 2px;\r\n\r\n  color: var(--np-muted);\r\n  font-size: .8rem;\r\n  font-weight: 800;\r\n  text-align: center;\r\n}\r\n\r\n/* Embedded media */\r\n\r\n.np-root .np-embed-box {\r\n  margin: 15px 0;\r\n\r\n  overflow: hidden;\r\n\r\n  border: 1px solid var(--np-line);\r\n  border-radius: 18px 5px 18px 5px;\r\n\r\n  background: #f5f8ff;\r\n}\r\n\r\n.np-root .np-embed-head {\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: space-between;\r\n  gap: 10px;\r\n\r\n  padding: 10px 14px;\r\n\r\n  border-bottom: 1px solid var(--np-line);\r\n\r\n  background: #edf3ff;\r\n}\r\n\r\n.np-root .np-embed-title {\r\n  min-width: 0;\r\n\r\n  color: var(--np-ink);\r\n  font-weight: 900;\r\n  font-size: .88rem;\r\n}\r\n\r\n.np-root .np-external-link {\r\n  flex: 0 0 auto;\r\n\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: 5px;\r\n\r\n  padding: 6px 10px;\r\n\r\n  border: 1px solid #aabce9;\r\n  border-radius: 9px 3px 9px 3px;\r\n\r\n  color: var(--np-navy) !important;\r\n  background: #fff;\r\n\r\n  font-size: .75rem;\r\n  font-weight: 900;\r\n  text-decoration: none;\r\n}\r\n\r\n.np-root .np-video {\r\n  position: relative;\r\n  width: 100%;\r\n  aspect-ratio: 16 / 9;\r\n\r\n  background: #0c1630;\r\n}\r\n\r\n.np-root .np-video iframe {\r\n  position: absolute;\r\n  inset: 0;\r\n\r\n  width: 100%;\r\n  height: 100%;\r\n\r\n  display: block;\r\n\r\n  border: 0;\r\n}\r\n\r\n.np-root .np-site-frame {\r\n  width: 100%;\r\n  height: clamp(520px, 70vh, 900px);\r\n\r\n  display: block;\r\n\r\n  border: 0;\r\n\r\n  background: #fff;\r\n}\r\n\r\n.np-root .np-site-note {\r\n  padding: 10px 14px;\r\n\r\n  border-top: 1px solid var(--np-line);\r\n\r\n  color: var(--np-muted);\r\n\r\n  background: #fbfcff;\r\n\r\n  font-size: .75rem;\r\n}\r\n\r\n/* Tables */\r\n\r\n.np-root .np-table-wrap {\r\n  width: 100%;\r\n  overflow-x: auto;\r\n\r\n  margin: 15px 0;\r\n\r\n  border: 1px solid var(--np-line);\r\n  border-radius: 15px 5px 15px 5px;\r\n}\r\n\r\n.np-root .np-table {\r\n  width: 100%;\r\n  min-width: 720px;\r\n\r\n  border-collapse: collapse;\r\n\r\n  background: #fff;\r\n}\r\n\r\n.np-root .np-table th,\r\n.np-root .np-table td {\r\n  padding: 11px 12px;\r\n\r\n  border-bottom: 1px solid #e2e9f7;\r\n\r\n  vertical-align: top;\r\n  text-align: left;\r\n}\r\n\r\n.np-root .np-table th {\r\n  color: #fff;\r\n  background: var(--np-navy);\r\n\r\n  font-size: .82rem;\r\n}\r\n\r\n.np-root .np-table td {\r\n  font-size: .86rem;\r\n}\r\n\r\n.np-root .np-table tr:last-child td {\r\n  border-bottom: 0;\r\n}\r\n\r\n.np-root .np-table tr:nth-child(even) td {\r\n  background: #f8faff;\r\n}\r\n\r\n/* Attack chain */\r\n\r\n.np-root .np-chain {\r\n  display: grid;\r\n  grid-template-columns:\r\n    minmax(0,1fr) auto\r\n    minmax(0,1fr) auto\r\n    minmax(0,1fr) auto\r\n    minmax(0,1fr) auto\r\n    minmax(0,1fr);\r\n\r\n  align-items: center;\r\n  gap: 8px;\r\n\r\n  margin: 25px 0;\r\n}\r\n\r\n.np-root .np-chain-step {\r\n  min-height: 94px;\r\n\r\n  display: grid;\r\n  place-items: center;\r\n\r\n  padding: 12px;\r\n\r\n  border: 1px solid #b9c9ee;\r\n  border-radius: 17px 5px 17px 5px;\r\n\r\n  background: linear-gradient(145deg, #fff, #edf3ff);\r\n\r\n  color: var(--np-navy);\r\n\r\n  font-weight: 900;\r\n  text-align: center;\r\n}\r\n\r\n.np-root .np-chain-arrow {\r\n  color: var(--np-coral);\r\n  font-size: 1.4rem;\r\n  font-weight: 900;\r\n}\r\n\r\n/* Stop Check Verify */\r\n\r\n.np-root .np-scv {\r\n  display: grid;\r\n  grid-template-columns: repeat(3, minmax(0,1fr));\r\n  gap: 14px;\r\n\r\n  margin: 18px 0;\r\n}\r\n\r\n.np-root .np-scv-card {\r\n  padding: 18px;\r\n\r\n  border: 1px solid var(--np-line);\r\n  border-radius: 19px 5px 19px 5px;\r\n\r\n  background: #fff;\r\n}\r\n\r\n.np-root .np-scv-letter {\r\n  width: 48px;\r\n  height: 48px;\r\n\r\n  display: grid;\r\n  place-items: center;\r\n\r\n  margin-bottom: 10px;\r\n\r\n  border-radius: 14px 4px 14px 4px;\r\n\r\n  color: #fff;\r\n  background: var(--np-blue);\r\n\r\n  font-size: 1.2rem;\r\n  font-weight: 900;\r\n}\r\n\r\n.np-root .np-scv-card:nth-child(1) .np-scv-letter {\r\n  background: var(--np-coral);\r\n}\r\n\r\n.np-root .np-scv-card:nth-child(3) .np-scv-letter {\r\n  background: var(--np-green);\r\n}\r\n\r\n/* Puzzle */\r\n\r\n.np-root .np-puzzle {\r\n  display: grid;\r\n  gap: 10px;\r\n}\r\n\r\n.np-root .np-puzzle-step {\r\n  position: relative;\r\n\r\n  padding: 14px 15px 14px 56px;\r\n\r\n  border: 1px solid var(--np-line);\r\n  border-radius: 15px 5px 15px 5px;\r\n\r\n  background: #fff;\r\n}\r\n\r\n.np-root .np-puzzle-step::before {\r\n  content: attr(data-step);\r\n\r\n  position: absolute;\r\n  left: 13px;\r\n  top: 13px;\r\n\r\n  width: 29px;\r\n  height: 29px;\r\n\r\n  display: grid;\r\n  place-items: center;\r\n\r\n  border-radius: 9px 3px 9px 3px;\r\n\r\n  color: #fff;\r\n  background: var(--np-blue);\r\n\r\n  font-size: .75rem;\r\n  font-weight: 900;\r\n}\r\n\r\n/* Checklist */\r\n\r\n.np-root .np-check-list {\r\n  display: grid;\r\n  grid-template-columns: repeat(2, minmax(0,1fr));\r\n  gap: 10px;\r\n\r\n  padding: 0;\r\n  margin: 0;\r\n\r\n  list-style: none;\r\n}\r\n\r\n.np-root .np-check-list li {\r\n  position: relative;\r\n\r\n  padding: 12px 14px 12px 42px;\r\n\r\n  border: 1px solid var(--np-soft-line);\r\n  border-radius: 13px 4px 13px 4px;\r\n\r\n  background: #fff;\r\n}\r\n\r\n.np-root .np-check-list li::before {\r\n  content: \"✓\";\r\n\r\n  position: absolute;\r\n  left: 13px;\r\n  top: 10px;\r\n\r\n  color: var(--np-green);\r\n\r\n  font-weight: 900;\r\n}\r\n\r\n/* Prompt */\r\n\r\n.np-root .np-prompt {\r\n  position: relative;\r\n\r\n  margin: 15px 0;\r\n  padding: 18px;\r\n\r\n  overflow-x: auto;\r\n\r\n  border-radius: 14px 4px 14px 4px;\r\n\r\n  color: #eaf2ff;\r\n  background: #17264b;\r\n\r\n  font-family:\r\n    \"JetBrains Mono\",\r\n    Consolas,\r\n    \"Microsoft JhengHei\",\r\n    monospace;\r\n\r\n  white-space: pre-wrap;\r\n}\r\n\r\n/* Controls */\r\n\r\n.np-root .np-controls {\r\n  display: grid;\r\n  grid-template-columns: 48px minmax(0,1fr) 48px;\r\n  align-items: center;\r\n  gap: 12px;\r\n\r\n  margin-top: 17px;\r\n}\r\n\r\n.np-root .np-control {\r\n  width: 48px;\r\n  height: 42px;\r\n\r\n  display: grid;\r\n  place-items: center;\r\n\r\n  border: 1px solid var(--np-line);\r\n  border-radius: 14px 5px 14px 5px;\r\n\r\n  color: var(--np-navy);\r\n  background: #fff;\r\n\r\n  font-size: 1.2rem;\r\n  font-weight: 900;\r\n\r\n  cursor: pointer;\r\n}\r\n\r\n.np-root .np-control:hover:not(:disabled) {\r\n  color: #fff;\r\n  background: var(--np-navy);\r\n}\r\n\r\n.np-root .np-control:disabled {\r\n  opacity: .3;\r\n  cursor: default;\r\n}\r\n\r\n.np-root .np-progress {\r\n  height: 8px;\r\n\r\n  overflow: hidden;\r\n\r\n  border-radius: 999px;\r\n  background: #e4ebfa;\r\n}\r\n\r\n.np-root .np-progress-bar {\r\n  width: 0;\r\n  height: 100%;\r\n\r\n  border-radius: inherit;\r\n\r\n  background:\r\n    linear-gradient(\r\n      90deg,\r\n      var(--np-navy),\r\n      var(--np-blue),\r\n      var(--np-coral)\r\n    );\r\n\r\n  transition: width .22s ease;\r\n}\r\n\r\n.np-root .np-page-count {\r\n  grid-column: 2;\r\n  justify-self: center;\r\n\r\n  margin-top: -6px;\r\n\r\n  color: var(--np-muted);\r\n\r\n  font-size: .74rem;\r\n  font-weight: 900;\r\n  letter-spacing: .12em;\r\n}\r\n\r\n/* Footer */\r\n\r\n.np-root .np-footer {\r\n  padding: 16px 22px;\r\n\r\n  border-top: 1px solid var(--np-line);\r\n\r\n  color: var(--np-muted);\r\n  background: #f0f5ff;\r\n\r\n  font-size: .76rem;\r\n  text-align: center;\r\n}\r\n\r\n/* Accessibility */\r\n\r\n.np-root .np-nav-button:focus-visible,\r\n.np-root .np-tab:focus-visible,\r\n.np-root .np-control:focus-visible,\r\n.np-root .np-external-link:focus-visible {\r\n  outline: 3px solid rgba(255,117,95,.5);\r\n  outline-offset: 2px;\r\n}\r\n\r\n/* Wide desktop / 16:9 classroom displays */\r\n\r\n@media (min-width: 1440px) {\r\n\r\n  .np-root {\r\n    width: calc(100% - 48px);\r\n    max-width: 1800px;\r\n  }\r\n\r\n  .np-root .np-main {\r\n    padding: 24px 28px 32px;\r\n  }\r\n\r\n  .np-root .np-stage {\r\n    padding: clamp(20px, 1.8vw, 32px);\r\n  }\r\n\r\n  .np-root .np-page-head h2 {\r\n    font-size: clamp(1.55rem, 2vw, 2.2rem);\r\n  }\r\n}\r\n\r\n\r\n/* Tablet */\r\n\r\n@media (max-width: 980px) {\r\n\r\n  .np-root {\r\n    border-radius: 20px;\r\n  }\r\n\r\n  .np-root .np-layout {\r\n    grid-template-columns: 190px minmax(0,1fr);\r\n  }\r\n\r\n  .np-root .np-main {\r\n    padding: 15px;\r\n  }\r\n\r\n  .np-root .np-card-grid {\r\n    grid-template-columns: 1fr;\r\n  }\r\n\r\n  .np-root .np-chain {\r\n    grid-template-columns: 1fr;\r\n  }\r\n\r\n  .np-root .np-chain-arrow {\r\n    transform: rotate(90deg);\r\n    text-align: center;\r\n  }\r\n}\r\n\r\n/* Mobile */\r\n\r\n@media (max-width: 720px) {\r\n\r\n  .np-root {\r\n    width: 100%;\r\n    margin: 0 auto;\r\n    border-radius: 14px;\r\n  }\r\n\r\n  .np-root .np-masthead {\r\n    min-height: 92px;\r\n    padding: 15px;\r\n  }\r\n\r\n  .np-root .np-brand-icon {\r\n    width: 52px;\r\n    height: 52px;\r\n\r\n    border-radius: 14px 4px 14px 4px;\r\n\r\n    font-size: 1.4rem;\r\n  }\r\n\r\n  .np-root .np-titleblock h1 {\r\n    letter-spacing: .02em;\r\n  }\r\n\r\n  .np-root .np-titleblock p {\r\n    display: none;\r\n  }\r\n\r\n  .np-root .np-layout {\r\n    display: block;\r\n    min-height: 0;\r\n  }\r\n\r\n  .np-root .np-sidebar {\r\n    padding: 10px;\r\n\r\n    border-right: 0;\r\n    border-bottom: 1px solid var(--np-line);\r\n  }\r\n\r\n  .np-root .np-sidebar-title {\r\n    display: none;\r\n  }\r\n\r\n  .np-root .np-nav {\r\n    display: flex;\r\n    gap: 6px;\r\n\r\n    overflow-x: auto;\r\n\r\n    padding-bottom: 5px;\r\n  }\r\n\r\n  .np-root .np-nav-button {\r\n    flex: 0 0 auto;\r\n\r\n    width: auto;\r\n    max-width: 170px;\r\n  }\r\n\r\n  .np-root .np-nav-label {\r\n    white-space: nowrap;\r\n  }\r\n\r\n  .np-root .np-main {\r\n    padding: 11px 8px 16px;\r\n  }\r\n\r\n  .np-root .np-stage {\r\n    min-height: 0;\r\n    padding: 12px;\r\n    border-radius: 16px 5px 16px 5px;\r\n  }\r\n\r\n  .np-root .np-page-head {\r\n    gap: 9px;\r\n  }\r\n\r\n  .np-root .np-page-number {\r\n    min-width: 40px;\r\n    height: 40px;\r\n  }\r\n\r\n  .np-root .np-card-grid,\r\n  .np-root .np-image-grid,\r\n  .np-root .np-scv,\r\n  .np-root .np-check-list {\r\n    grid-template-columns: 1fr;\r\n  }\r\n\r\n  .np-root .np-site-frame {\r\n    height: 70vh;\r\n    min-height: 480px;\r\n  }\r\n\r\n  .np-root .np-embed-head {\r\n    align-items: flex-start;\r\n    flex-direction: column;\r\n  }\r\n\r\n  .np-root .np-external-link {\r\n    align-self: flex-start;\r\n  }\r\n}\r\n\r\n@media (prefers-reduced-motion: reduce) {\r\n\r\n  .np-root *,\r\n  .np-root *::before,\r\n  .np-root *::after {\r\n    animation-duration: .01ms !important;\r\n    transition-duration: .01ms !important;\r\n    scroll-behavior: auto !important;\r\n  }\r\n}\r\n\u003c/style>\n\u003cstyle>\n/* Local readability and image sizing overrides; reference theme and navigation are retained. */\n.np-root{font-size:20px;}\n.np-root .np-titleblock p,.np-root .np-sidebar-title,.np-root .np-nav-index,.np-root .np-nav-label,.np-root .np-tab,.np-root .np-page-number,.np-root .np-page-head p,.np-root .np-quote,.np-root .np-message-head,.np-root .np-image-card figcaption,.np-root .np-embed-title,.np-root .np-external-link,.np-root .np-site-note,.np-root .np-table th,.np-root .np-table td,.np-root .np-puzzle-step::before,.np-root .np-control,.np-root .np-page-count,.np-root .np-footer{font-size:20px;}\n.np-root .np-section h3{font-size:clamp(20px,2vw,1.3rem);}\n.np-root .np-nav-button{grid-template-columns:40px minmax(0,1fr);}\n.np-root .np-nav-index{width:36px;height:36px;}\n.np-root .np-nav-label{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;line-height:1.4;}\n.np-root .np-tab{line-height:1.4;}\n.np-root .np-footer{line-height:1.7;}\n@media(max-width:720px){.np-root .np-nav-button{max-width:240px;}}\n.np-root .vision-figure{margin:18px auto;width:100%;}\n.np-root .vision-figure img{height:auto;object-fit:contain;}\n.np-root .np-section p{overflow-wrap:anywhere;}\n\u003c/style>\n\r\n\r\n\r\n\r\n\r\n\u003c/head>\u003cbody>\n\u003cdiv class=\"np-root\">\r\n\r\n\u003cheader class=\"np-masthead\">\r\n  \u003cdiv class=\"np-brand-icon\" aria-hidden=\"true\">📷\u003c/div>\r\n\r\n  \u003cdiv class=\"np-titleblock\">\r\n    \u003ch1>影像辨識原理與生活應用\u003c/h1>\r\n    \u003cp>從像素到模型判斷｜處理流程・辨識任務・生活應用\u003c/p>\r\n  \u003c/div>\r\n\u003c/header>\r\n\r\n\u003cdiv class=\"np-layout\">\r\n\r\n\u003caside class=\"np-sidebar\">\r\n  \u003cp class=\"np-sidebar-title\">COURSE CONTENT\u003c/p>\r\n  \u003cnav class=\"np-nav\" id=\"np-nav\" aria-label=\"課程章節\">\u003c/nav>\r\n\u003c/aside>\r\n\r\n\u003cmain class=\"np-main\">\r\n\r\n\u003cdiv class=\"np-tabs-wrap\">\r\n  \u003cdiv class=\"np-tabs\" id=\"np-tabs\" role=\"tablist\" aria-label=\"章節內容\">\r\n  \u003c/div>\r\n\u003c/div>\r\n\r\n\u003csection class=\"np-stage\" id=\"np-stage\" aria-live=\"polite\">\r\n\r\n\u003carticle class=\"np-page\" data-title=\"一、什麼是影像辨識？\">\n\u003cdiv class=\"np-section\" data-tab-title=\"一、什麼是影像辨識？\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">01\u003c/div>\u003cdiv>\u003ch2>一、什麼是影像辨識？\u003c/h2>\u003cp>一、什麼是影像辨識？\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"np-callout\">依 HackMD 最新講義製作。段落圖片採 AI 高解析重製，完整圖表保留原始版本；圖中分數為示意。\u003c/div>\u003cp>影像辨識是一種讓電腦分析影像，辨別其中物件、模式或特徵的技術。例如從照片判斷有沒有貓、從道路畫面找出汽車與行人，或把招牌上的文字轉成可搜尋的文字資料。\u003c/p>\u003cp>人看照片時會直接理解場景；電腦首先接收到的是數值，再透過影像處理與模型運算產生判斷。學習時可以先掌握三個問題：輸入什麼資料、希望系統回答什麼問題，以及如何確認結果可靠。\u003c/p>\u003cdetails>\u003csummary>展開完整資訊圖表\u003c/summary>\u003cfigure class=\"np-image-card vision-figure\" style=\"max-width:900px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/833309a99e79e202e2960c1167c048f75ab54871c4c95cc56932fe3fcb78197c.jpeg\" alt=\"完整圖表\" decoding=\"async\">\u003cfigcaption>完整圖表\u003c/figcaption>\u003c/figure>\u003c/details>\u003c/div>\n\u003c/article>\n\u003carticle class=\"np-page\" data-title=\"二、核心原理：影像辨識的處理流程\">\n\u003cdiv class=\"np-section\" data-tab-title=\"概覽\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">02\u003c/div>\u003cdiv>\u003ch2>概覽\u003c/h2>\u003cp>二、核心原理：影像辨識的處理流程\u003c/p>\u003c/div>\u003c/div>\u003cp>原圖以五個步驟說明從影像到辨識結果的過程：\u003cstrong>影像輸入 → 前處理 → 特徵擷取 → 模型判斷 → 輸出結果\u003c/strong>。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"影像輸入\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">02\u003c/div>\u003cdiv>\u003ch2>2.1 影像輸入：取得視覺資料\u003c/h2>\u003cp>二、核心原理：影像辨識的處理流程\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vision-figure\" style=\"max-width:408px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/641852d3e4cf83c1d38b0d6b489f3b5c756abba61ee4f3c7fe20795bc5a9ee31.png\" alt=\"影像輸入\" decoding=\"async\">\u003cfigcaption>影像輸入\u003c/figcaption>\u003c/figure>\u003cp>相機、手機或影像感測器先取得照片或影片。輸入畫面的清晰度、拍攝角度與光線，會影響後續可取得的資訊。例如物件太小或嚴重模糊時，即使模型能力很好，也可能無法辨認。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"前處理\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">02\u003c/div>\u003cdiv>\u003ch2>2.2 前處理：整理輸入影像\u003c/h2>\u003cp>二、核心原理：影像辨識的處理流程\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vision-figure\" style=\"max-width:404px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/c5950f311a9e73344babc1a795c86b7d7555ffbe42f5835c524a564edd4049da.png\" alt=\"前處理\" decoding=\"async\">\u003cfigcaption>前處理\u003c/figcaption>\u003c/figure>\u003cp>前處理是在辨識前調整影像，常見方式包括去除雜訊、調整尺寸及增強對比。原圖以貓照片及影像直方圖說明：先讓資料符合系統需要，再送入後續步驟。\u003c/p>\u003cp>\u003cstrong>教學補充：\u003c/strong> 前處理依任務而定。彩色辨識可能需要保留顏色，並非所有影像都應轉成灰階；過度去雜訊也可能消除重要細節。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"特徵擷取\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">02\u003c/div>\u003cdiv>\u003ch2>2.3 特徵擷取：找出可辨別的線索\u003c/h2>\u003cp>二、核心原理：影像辨識的處理流程\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vision-figure\" style=\"max-width:412px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/9070e556a9e043402b9898f6a3aa912aee0744a3423538773747411ca84ce6f4.png\" alt=\"特徵擷取\" decoding=\"async\">\u003cfigcaption>特徵擷取\u003c/figcaption>\u003c/figure>\u003cp>特徵是用來區分物件的資訊，例如邊緣、紋理、形狀與顏色。原圖從貓的影像取出眼睛顏色、毛髮紋理與輪廓線索，說明模型不一定直接使用人類熟悉的物件名稱，而是依影像中的數值與模式進行運算。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"模型判斷\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">02\u003c/div>\u003cdiv>\u003ch2>2.4 模型判斷：根據特徵做分類或預測\u003c/h2>\u003cp>二、核心原理：影像辨識的處理流程\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vision-figure\" style=\"max-width:399px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/91a10ebdc84578ecdcb20fc64a6f512a31dc928fe81fe2812a2641ef9d2193a5.png\" alt=\"模型判斷\" decoding=\"async\">\u003cfigcaption>模型判斷\u003c/figcaption>\u003c/figure>\u003cp>系統利用演算法或神經網路處理影像特徵，再產生預測。原圖以卷積神經網路（CNN）作為深度學習模型的例子，透過多層運算學習影像中的規律。\u003c/p>\u003cp>\u003cstrong>教學補充：\u003c/strong> 深度學習可在訓練時學習特徵，因此特徵擷取與判斷可能整合在同一個模型中；五步驟是理解流程的教學架構。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"輸出結果\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">02\u003c/div>\u003cdiv>\u003ch2>2.5 輸出結果：把預測轉成可用資訊\u003c/h2>\u003cp>二、核心原理：影像辨識的處理流程\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vision-figure\" style=\"max-width:403px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/f11770d916a7ad0a40154f001b8be28725eb8e2cbe71082a71d75a8d410c2652.png\" alt=\"輸出結果\" decoding=\"async\">\u003cfigcaption>輸出結果\u003c/figcaption>\u003c/figure>\u003cp>辨識結果可能是物件名稱、所在位置或影像中的區域。原圖以「貓」為例，顯示類別、分數及框選位置；位置可以用 x、y、寬度、高度表示，但實際座標定義依系統而異。\u003c/p>\u003cp>\u003cstrong>教學補充：\u003c/strong> 圖上的 0.98／98% 是示意模型分數，不表示這張圖一定有 98% 的正確機率，也不是整套系統在所有照片上的正確率。\u003c/p>\u003c/div>\n\u003c/article>\n\u003carticle class=\"np-page\" data-title=\"三、電腦看到的影像是什麼？\">\n\u003cdiv class=\"np-section\" data-tab-title=\"像素（Pixel）\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">03\u003c/div>\u003cdiv>\u003ch2>3.1 像素（Pixel）：影像的基本單位\u003c/h2>\u003cp>三、電腦看到的影像是什麼？\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vision-figure\" style=\"max-width:708px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/de98e352b131bd0a62dda86825ec5d65098be999f7916157bc8e56f31549e877.png\" alt=\"像素\" decoding=\"async\">\u003cfigcaption>像素\u003c/figcaption>\u003c/figure>\u003cp>影像由許多小方格組成，每一格稱為像素。像素以數值表示亮度或顏色；常見的 RGB 彩色影像使用紅、綠、藍三個色彩通道描述每個位置的顏色。放大照片後看到的格子，就是理解像素的直觀方式。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"特徵\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">03\u003c/div>\u003cdiv>\u003ch2>3.2 特徵：邊緣、角點與紋理\u003c/h2>\u003cp>三、電腦看到的影像是什麼？\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vision-figure\" style=\"max-width:711px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/921d96b227d179ce8d0a8002b0ec136fd872c5c765592f32cc157c97e265f71e.png\" alt=\"特徵\" decoding=\"async\">\u003cfigcaption>特徵\u003c/figcaption>\u003c/figure>\u003cp>邊緣是亮度或顏色明顯變化的地方；角點常出現在輪廓方向變化的位置；紋理則描述毛髮、布料或木紋等重複的局部模式。這些線索能協助區分物件，但單一線索通常不足以保證判斷正確。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"資料集訓練\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">03\u003c/div>\u003cdiv>\u003ch2>3.3 資料集訓練：從範例學習\u003c/h2>\u003cp>三、電腦看到的影像是什麼？\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vision-figure\" style=\"max-width:900px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/a178ac83421c9b4b30285a30f91a4635091def0ddb4bc470e32d5d13543bcca5.png\" alt=\"資料集訓練\" decoding=\"async\">\u003cfigcaption>資料集訓練\u003c/figcaption>\u003c/figure>\u003cp>原圖以貓、狗、汽車與飛機等有標註圖片，說明監督式學習：先提供圖片與對應標籤，讓模型在訓練過程中調整參數，學習不同類別的共同特徵。\u003c/p>\u003cp>\u003cstrong>教學補充：\u003c/strong> 應保留未參與訓練的資料檢查表現，不能只看模型是否記住訓練圖片。資料也應涵蓋不同角度、光線與背景；圖片很多，仍不代表內容足夠多樣或標註正確。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"機器學習與深度學習\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">03\u003c/div>\u003cdiv>\u003ch2>3.4 機器學習與深度學習\u003c/h2>\u003cp>三、電腦看到的影像是什麼？\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vision-figure\" style=\"max-width:711px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/7055776c55fc10f876a0f58f1db3ba6299d69325409e2112aa185bbd8527b9d8.png\" alt=\"機器學習與深度學習\" decoding=\"async\">\u003cfigcaption>機器學習與深度學習\u003c/figcaption>\u003c/figure>\u003cp>機器學習讓系統從資料中學習規律；深度學習是其中一類方法，通常使用多層神經網路學習特徵與輸出之間的關係。訓練完成後，把新影像送入模型得到預測，稱為推論。\u003c/p>\u003cdiv class=\"np-table-wrap\">\u003ctable class=\"np-table\">\u003cthead>\u003ctr>\u003cth>階段\u003c/th>\u003cth>輸入與工作\u003c/th>\u003cth>產出\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>訓練\u003c/td>\u003ctd>使用訓練資料，調整模型參數\u003c/td>\u003ctd>學習後的模型\u003c/td>\u003c/tr>\u003ctr>\u003ctd>推論\u003c/td>\u003ctd>將新影像交給既有模型\u003c/td>\u003ctd>類別、位置、區域或文字等結果\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003c/article>\n\u003carticle class=\"np-page\" data-title=\"四、常見的影像辨識任務\">\n\u003cdiv class=\"np-section\" data-tab-title=\"影像分類\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">04\u003c/div>\u003cdiv>\u003ch2>4.1 影像分類：這張圖主要是什麼？\u003c/h2>\u003cp>四、常見的影像辨識任務\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vision-figure\" style=\"max-width:461px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/a2c516ef3b16b7beaa705f201b3db9a2a98ab0a17f3a3c04a329b707f1e27640.png\" alt=\"影像分類\" decoding=\"async\">\u003cfigcaption>影像分類\u003c/figcaption>\u003c/figure>\u003cp>分類是判斷整張影像屬於哪個類別。例如原圖輸出「這是一隻狗」。它主要回答類別問題，通常不提供每個物件的精確位置。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"物件偵測\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">04\u003c/div>\u003cdiv>\u003ch2>4.2 物件偵測：有哪些物件、在哪裡？\u003c/h2>\u003cp>四、常見的影像辨識任務\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vision-figure\" style=\"max-width:405px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/7d86879fcb75028c1c9fee0d31febb59f5bf94971125bb35b363127de5099f3e.png\" alt=\"物件偵測\" decoding=\"async\">\u003cfigcaption>物件偵測\u003c/figcaption>\u003c/figure>\u003cp>物件偵測會找出物件位置與類別。道路畫面可同時標示汽車、行人及腳踏車，並用框線表示位置；同一張影像可以有多個偵測結果。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"影像分割\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">04\u003c/div>\u003cdiv>\u003ch2>4.3 影像分割：每個像素屬於哪個區域？\u003c/h2>\u003cp>四、常見的影像辨識任務\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vision-figure\" style=\"max-width:413px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/a607fdedd5d471951f94f425594cfc24ab269da2122bdb522e5a91d254493e1b.png\" alt=\"影像分割\" decoding=\"async\">\u003cfigcaption>影像分割\u003c/figcaption>\u003c/figure>\u003cp>分割會標示影像區域的邊界與範圍，比矩形框更細緻。原圖用不同顏色區分貓、背景、地毯與沙發，說明系統可以逐像素判斷區域所屬的類別。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"OCR 文字辨識\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">04\u003c/div>\u003cdiv>\u003ch2>4.4 OCR 文字辨識：圖片裡寫了什麼？\u003c/h2>\u003cp>四、常見的影像辨識任務\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vision-figure\" style=\"max-width:416px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/ea23f401d51a545f4b747e8be6da81fed12b3ec4805e935d8c4aebc65a3ddd1a.png\" alt=\"OCR文字辨識\" decoding=\"async\">\u003cfigcaption>OCR文字辨識\u003c/figcaption>\u003c/figure>\u003cp>OCR 是光學字元辨識，可把照片中的文字轉成文字資料。例如辨識站牌上的「台北車站」與「Taipei Main Station」，之後便能用於搜尋、翻譯或資料輸入。字體、角度、模糊與遮擋都可能造成錯字。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"人臉辨識\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">04\u003c/div>\u003cdiv>\u003ch2>4.5 人臉辨識：比較臉部特徵\u003c/h2>\u003cp>四、常見的影像辨識任務\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vision-figure\" style=\"max-width:391px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/d37b69cb2f9cb684cc104475cedc0f77a62bc2f71feffeab79c87f1aac188d41.png\" alt=\"人臉辨識\" decoding=\"async\">\u003cfigcaption>人臉辨識\u003c/figcaption>\u003c/figure>\u003cp>人臉辨識會擷取臉部特徵並進行比對。原圖顯示「已識別」與相似度，用來說明系統可把目前影像與已登錄的特徵比較。\u003c/p>\u003cp>\u003cstrong>教學補充：\u003c/strong> 找出畫面中的臉稱為人臉偵測；判斷是否與某個登錄者相符，才涉及身分比對。圖上的 99.3% 是示意相似度，不等於身分確認絕對可靠。\u003c/p>\u003cdiv class=\"np-table-wrap\">\u003ctable class=\"np-table\">\u003cthead>\u003ctr>\u003cth>任務\u003c/th>\u003cth>主要回答\u003c/th>\u003cth>原圖例子\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>分類\u003c/td>\u003ctd>是哪一類？\u003c/td>\u003ctd>狗\u003c/td>\u003c/tr>\u003ctr>\u003ctd>偵測\u003c/td>\u003ctd>有什麼、在哪裡？\u003c/td>\u003ctd>車、人、自行車的框\u003c/td>\u003c/tr>\u003ctr>\u003ctd>分割\u003c/td>\u003ctd>每個區域的範圍？\u003c/td>\u003ctd>貓、背景、地毯、沙發\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OCR\u003c/td>\u003ctd>寫了哪些文字？\u003c/td>\u003ctd>車站中英文名稱\u003c/td>\u003c/tr>\u003ctr>\u003ctd>人臉辨識\u003c/td>\u003ctd>臉部特徵是否相符？\u003c/td>\u003ctd>與已登錄特徵比較\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003c/article>\n\u003carticle class=\"np-page\" data-title=\"五、傳統方法與深度學習\">\n\u003cdiv class=\"np-section\" data-tab-title=\"傳統影像處理\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">05\u003c/div>\u003cdiv>\u003ch2>5.1 傳統影像處理\u003c/h2>\u003cp>五、傳統方法與深度學習\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vision-figure\" style=\"max-width:656px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/a8e5a960732160fa058cb18e416d8b8c83f7c47bfa7d8825763495d7693b22c4.png\" alt=\"傳統影像處理\" decoding=\"async\">\u003cfigcaption>傳統影像處理\u003c/figcaption>\u003c/figure>\u003cp>傳統方法常由人設計處理規則或特徵，例如利用邊緣、紋理與形狀來分析影像。若拍攝環境固定、問題明確，規則式方法便可能有效，例如在固定背景下檢查物件輪廓。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"深度學習辨識\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">05\u003c/div>\u003cdiv>\u003ch2>5.2 深度學習辨識\u003c/h2>\u003cp>五、傳統方法與深度學習\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vision-figure\" style=\"max-width:659px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/80581988c6ffb91c1cd74e5aa975934cece8c59777af979440ab5f9607b28064.png\" alt=\"深度學習辨識\" decoding=\"async\">\u003cfigcaption>深度學習辨識\u003c/figcaption>\u003c/figure>\u003cp>深度學習透過多層神經網路學習特徵，能處理較複雜的影像模式。原圖強調自動學習特徵、需要大量資料與較強的辨識能力；實際效果仍取決於資料、模型、運算資源及評估方式。\u003c/p>\u003cp>\u003cstrong>教學補充：\u003c/strong> 兩者可以搭配使用，例如先校正影像與調整尺寸，再交給深度學習模型。不能只憑方法名稱就判斷哪一套系統一定比較準。\u003c/p>\u003c/div>\n\u003c/article>\n\u003carticle class=\"np-page\" data-title=\"六、生活中的應用\">\n\u003cdiv class=\"np-section\" data-tab-title=\"智慧手機\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">06\u003c/div>\u003cdiv>\u003ch2>6.1 智慧手機\u003c/h2>\u003cp>六、生活中的應用\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vision-figure\" style=\"max-width:518px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/8d1f2080141338bf4e0638f911f3649b838eb0d4a842829f766430b84d8c0cd4.png\" alt=\"智慧手機\" decoding=\"async\">\u003cfigcaption>智慧手機\u003c/figcaption>\u003c/figure>\u003cp>相簿可依人像或場景整理照片，人臉解鎖則利用臉部相關資訊完成驗證。不同功能需要不同模型與硬體，照片分類能力不代表具備相同的身分驗證能力。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"醫療影像\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">06\u003c/div>\u003cdiv>\u003ch2>6.2 醫療影像\u003c/h2>\u003cp>六、生活中的應用\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vision-figure\" style=\"max-width:520px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/f07bcff95c6f0ead92b462ac3e866d5219f6f8c5c6653aae40c4e5a621eb5b4f.png\" alt=\"醫療影像\" decoding=\"async\">\u003cfigcaption>醫療影像\u003c/figcaption>\u003c/figure>\u003cp>系統可協助分析 X 光或 MRI 等影像，提示需要進一步查看的區域。本例重點是影像分析的輔助用途，辨識結果仍須由相關專業人員依完整資訊判讀。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"自動駕駛\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">06\u003c/div>\u003cdiv>\u003ch2>6.3 自動駕駛\u003c/h2>\u003cp>六、生活中的應用\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vision-figure\" style=\"max-width:520px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/77802855c766ab4ddfb325cafeef384b9280aa7bcbfb554f433672a60378b0d7.png\" alt=\"自動駕駛\" decoding=\"async\">\u003cfigcaption>自動駕駛\u003c/figcaption>\u003c/figure>\u003cp>道路影像可用來辨識行人、車道與車輛，提供環境資訊。從影像辨識到車輛行動之間，還包含追蹤、規劃與控制等環節；看出物件只是整體流程的一部分。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"智慧製造\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">06\u003c/div>\u003cdiv>\u003ch2>6.4 智慧製造\u003c/h2>\u003cp>六、生活中的應用\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vision-figure\" style=\"max-width:900px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/76758f957029fe393ef286cddcae70e2f29959dfcebcbe21059389a4e8dc8477.png\" alt=\"智慧製造\" decoding=\"async\">\u003cfigcaption>智慧製造\u003c/figcaption>\u003c/figure>\u003cp>工廠可檢查產品外觀、偵測刮痕或缺件，協助品質控制。原圖以「正常／瑕疵」作為比較，說明系統會依任務定義判斷是否符合標準。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"零售服務\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">06\u003c/div>\u003cdiv>\u003ch2>6.5 零售服務\u003c/h2>\u003cp>六、生活中的應用\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vision-figure\" style=\"max-width:520px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/e704a403f95db88cb5ded2a084112cb40bfc3970bde8ea5e8956714343e6b9b6.png\" alt=\"零售服務\" decoding=\"async\">\u003cfigcaption>零售服務\u003c/figcaption>\u003c/figure>\u003cp>商品辨識可協助自助結帳及商品管理。系統需面對包裝相似、物件重疊或拍攝角度改變等問題，因此實際流程常需要核對機制。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"農業監測\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">06\u003c/div>\u003cdiv>\u003ch2>6.6 農業監測\u003c/h2>\u003cp>六、生活中的應用\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vision-figure\" style=\"max-width:520px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/9a8b3dc3ca8a39c99132b2438494ca8f97c8d386dd1d4760ab8e28bfcbfc90d4.png\" alt=\"農業監測\" decoding=\"async\">\u003cfigcaption>農業監測\u003c/figcaption>\u003c/figure>\u003cp>葉片或作物影像可用來觀察病徵，協助作物照護與監測。原圖圈出葉片病斑，說明如何把影像中的局部特徵轉成需要關注的提示。\u003c/p>\u003c/div>\n\u003c/article>\n\u003carticle class=\"np-page\" data-title=\"七、優勢與挑戰\">\n\u003cdiv class=\"np-section\" data-tab-title=\"主要優勢\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">07\u003c/div>\u003cdiv>\u003ch2>7.1 主要優勢\u003c/h2>\u003cp>七、優勢與挑戰\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vision-figure\" style=\"max-width:764px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/ac2f8a972af904a0e9ecd102ca1d65d05fa10b8daefa015abc9a8afbc6821021.png\" alt=\"主要優勢\" decoding=\"async\">\u003cfigcaption>主要優勢\u003c/figcaption>\u003c/figure>\u003cp>影像辨識能快速處理大量圖片，協助提高重複檢查工作的效率，並在設備與流程允許時持續自動運作。例如大量監視畫面或產品照片，可以先由系統篩選需要人工關注的內容。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"面臨挑戰\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">07\u003c/div>\u003cdiv>\u003ch2>7.2 面臨挑戰\u003c/h2>\u003cp>七、優勢與挑戰\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vision-figure\" style=\"max-width:900px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/7e98651341a007b440dbd688107e9cff420e287cdf22e2e7fa5cab338a48b6ec.png\" alt=\"面臨挑戰\" decoding=\"async\">\u003cfigcaption>面臨挑戰\u003c/figcaption>\u003c/figure>\u003cp>光線與角度改變、物件遮擋、複雜背景，都可能讓同一個物件呈現不同樣貌。若訓練資料缺少這些情況，模型便可能誤判；資料偏差與標註品質也會影響辨識結果。\u003c/p>\u003cp>原圖也提醒隱私與倫理問題。影像可能包含可識別的人與場所，因此應清楚界定蒐集目的、授權與使用範圍。辨識能力提高，仍需要合適的資料管理與人工核對流程。\u003c/p>\u003c/div>\n\u003c/article>\n\u003carticle class=\"np-page\" data-title=\"八、學習重點整理\">\n\u003cdiv class=\"np-section\" data-tab-title=\"八、學習重點整理\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">08\u003c/div>\u003cdiv>\u003ch2>八、學習重點整理\u003c/h2>\u003cp>八、學習重點整理\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card vision-figure\" style=\"max-width:900px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/75e7f51e8ede536a39b26771edffd0e0f3653fe84b798524841d309b04688cb3.png\" alt=\"學習重點\" decoding=\"async\">\u003cfigcaption>學習重點\u003c/figcaption>\u003c/figure>\u003col>\u003cli>影像辨識是讓電腦透過數值運算分析圖片，產生類別、位置或其他資訊。\u003c/li>\u003cli>核心流程包含輸入、前處理、特徵擷取、模型判斷與輸出。\u003c/li>\u003cli>分類、偵測、分割、OCR 與人臉辨識，各自回答不同問題。\u003c/li>\u003cli>影像辨識已應用於手機、醫療、交通、製造、零售與農業。\u003c/li>\u003cli>判斷系統是否可靠，還要考慮資料品質、使用情境、誤判與隱私。\u003c/li>\u003c/ol>\u003c/div>\n\u003c/article>\n\u003carticle class=\"np-page\" data-title=\"九、課堂思考與練習\">\n\u003cdiv class=\"np-section\" data-tab-title=\"九、課堂思考與練習\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">09\u003c/div>\u003cdiv>\u003ch2>九、課堂思考與練習\u003c/h2>\u003cp>九、課堂思考與練習\u003c/p>\u003c/div>\u003c/div>\u003col>\u003cli>相簿把照片分成「貓」與「狗」，主要屬於哪種任務？若要圈出照片中的每一隻貓，任務有何改變？\u003c/li>\u003cli>為什麼物件分割比物件偵測提供更細緻的位置資訊？\u003c/li>\u003cli>某模型顯示「貓 0.98」，能否直接宣稱整個系統有 98% 正確率？\u003c/li>\u003cli>如果所有訓練圖片都在白天拍攝，夜間使用可能出現什麼問題？\u003c/li>\u003cli>請選一項生活應用，列出輸入影像、希望取得的結果及一個可能誤判的情況。\u003c/li>\u003c/ol>\u003cdetails>\u003csummary>參考答案\u003c/summary>\u003col>\u003cli>前者是分類；圈出每隻貓的位置通常使用物件偵測。\u003c/li>\u003cli>偵測多以矩形框表示物件；分割能標示像素所屬區域，更貼近物件輪廓。\u003c/li>\u003cli>不能。單張影像的模型分數與整體測試資料的正確率是不同概念。\u003c/li>\u003cli>夜間的亮度、雜訊與對比可能不同，模型表現可能下降，需用符合情境的獨立資料驗證。\u003c/li>\u003cli>例：製造檢查輸入產品照片，輸出瑕疵位置；反光可能被誤判成刮痕。\u003c/li>\u003c/ol>\u003c/details>\u003c/div>\n\u003c/article>\n\u003carticle class=\"np-page\" data-title=\"十、圖片與來源說明\">\n\u003cdiv class=\"np-section\" data-tab-title=\"十、圖片與來源說明\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">10\u003c/div>\u003cdiv>\u003ch2>十、圖片與來源說明\u003c/h2>\u003cp>十、圖片與來源說明\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"np-callout\">網頁配圖說明：以下連結為 HackMD 原始裁切圖。本 HTML 內嵌的段落配圖另採 AI 高解析重製版本，並依原圖核對教學標示；完整資訊圖表維持原始版本。\u003c/div>\u003cp>原始資料為使用者提供的《影像辨識原理與生活應用》PNG（1672 × 941）。完整圖表另存 JPEG 供上傳，25 張段落圖直接裁切 PNG，保留原始圖片。以下網址由 HackMD 圖片上傳功能產生，可供後續編修使用。\u003c/p>\u003cul>\u003cli>\u003ca href=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/833309a99e79e202e2960c1167c048f75ab54871c4c95cc56932fe3fcb78197c.jpeg\" target=\"_blank\" rel=\"noopener noreferrer\">00_完整圖表 ↗\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/641852d3e4cf83c1d38b0d6b489f3b5c756abba61ee4f3c7fe20795bc5a9ee31.png\" target=\"_blank\" rel=\"noopener noreferrer\">01_影像輸入 ↗\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/c5950f311a9e73344babc1a795c86b7d7555ffbe42f5835c524a564edd4049da.png\" target=\"_blank\" rel=\"noopener noreferrer\">02_前處理 ↗\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/9070e556a9e043402b9898f6a3aa912aee0744a3423538773747411ca84ce6f4.png\" target=\"_blank\" rel=\"noopener noreferrer\">03_特徵擷取 ↗\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://raw.githubusercontent.com/max00189xp/emerging- r noreferrer\">19_自動駕駛 ↗\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/76758f957029fe393ef286cddcae70e2f29959dfcebcbe21059389a4e8dc8477.png\" target=\"_blank\" rel=\"noopener noreferrer\">20_智慧製造 ↗\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/e704a403f95db88cb5ded2a084112cb40bfc3970bde8ea5e8956714343e6b9b6.png\" target=\"_blank\" rel=\"noopener noreferrer\">21_零售服務 ↗\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/9a8b3dc3ca8a39c99132b2438494ca8f97c8d386dd1d4760ab8e28bfcbfc90d4.png\" target=\"_blank\" rel=\"noopener noreferrer\">22_農業監測 ↗\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/ac2f8a972af904a0e9ecd102ca1d65d05fa10b8daefa015abc9a8afbc6821021.png\" target=\"_blank\" rel=\"noopener noreferrer\">23_主要優勢 ↗\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/7e98651341a007b440dbd688107e9cff420e287cdf22e2e7fa5cab338a48b6ec.png\" target=\"_blank\" rel=\"noopener noreferrer\">24_面臨挑戰 ↗\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/75e7f51e8ede536a39b26771edffd0e0f3653fe84b798524841d309b04688cb3.png\" target=\"_blank\" rel=\"noopener noreferrer\">25_學習重點 ↗\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\n\u003c/article>\n\n\u003c/section>\r\n\r\n\r\n\u003cdiv class=\"np-controls\">\r\n\r\n\u003cbutton class=\"np-control\" id=\"np-prev\" type=\"button\" aria-label=\"上一頁\">\r\n  ←\r\n\u003c/button>\r\n\r\n\u003cdiv class=\"np-progress\" aria-hidden=\"true\">\r\n\r\n  \u003cdiv class=\"np-progress-bar\" id=\"np-progress\">\r\n  \u003c/div>\r\n\r\n\u003c/div>\r\n\r\n\u003cbutton class=\"np-control\" id=\"np-next\" type=\"button\" aria-label=\"下一頁\">\r\n  →\r\n\u003c/button>\r\n\r\n\u003cdiv class=\"np-page-count\" id=\"np-page-count\" aria-live=\"polite\">\r\n\u003c/div>\r\n\r\n\u003c/div>\r\n\r\n\u003c/main>\r\n\u003c/div>\r\n\r\n\r\n\u003cfooter class=\"np-footer\">影像辨識原理與生活應用｜新興科技教學\u003cbr>依 \u003ca href=\"https://hackmd.io/6TiF-Z6VRoSZgzu4DjqxHg\" target=\"_blank\" rel=\"noopener noreferrer\">HackMD 講義\u003c/a> 製作・圖片為原圖與 AI 高解析重製版本；圖中分數為示意。\u003c/footer>\r\n\r\n\r\n\u003cscript nonce=\"2avuI5xY1eK4tfLJpCzMO0nLNFviC4vJKOgT90KB\">\r\n(function () {\r\n  \"use strict\";\r\n\r\n  var root;\r\n  var nav;\r\n  var tabs;\r\n  var pages;\r\n  var prevButton;\r\n  var nextButton;\r\n  var progress;\r\n  var pageCount;\r\n\r\n  var state = {\r\n    chapter: 0,\r\n    tab: 0\r\n  };\r\n\r\n\r\n  function escapeHtml(value) {\r\n\r\n    return String(value).replace(\r\n      /[&\u003c>\"']/g,\r\n      function (character) {\r\n\r\n        return {\r\n          \"&\": \"&amp;\",\r\n          \"\u003c\": \"&lt;\",\r\n          \">\": \"&gt;\",\r\n          \"\\\"\": \"&quot;\",\r\n          \"'\": \"&#039;\"\r\n        }[character];\r\n\r\n      }\r\n    );\r\n\r\n  }\r\n\r\n\r\n  function pad(number) {\r\n    return String(number).padStart(2, \"0\");\r\n  }\r\n\r\n\r\n  function getPages() {\r\n\r\n    return Array.prototype.slice.call(\r\n      root.querySelectorAll(\".np-page\")\r\n    );\r\n\r\n  }\r\n\r\n\r\n  function getCurrentPage() {\r\n\r\n    return pages[state.chapter] || null;\r\n\r\n  }\r\n\r\n\r\n  function getSections(page) {\r\n\r\n    if (!page) {\r\n      return [];\r\n    }\r\n\r\n    return Array.prototype.slice.call(\r\n      page.querySelectorAll(\".np-section\")\r\n    );\r\n\r\n  }\r\n\r\n\r\n  function getTotalSubPages() {\r\n\r\n    var total = 0;\r\n\r\n    pages.forEach(\r\n      function (page) {\r\n\r\n        total += getSections(page).length;\r\n\r\n      }\r\n    );\r\n\r\n    return total;\r\n\r\n  }\r\n\r\n\r\n  function getCurr r\n  grid-template-columns: repeat(3, minmax(0,1fr));\r\n  gap: 14px;\r\n\r\n  margin: 18px 0;\r\n}\r\n\r\n.np-root .np-scv-card {\r\n  padding: 18px;\r\n\r\n  border: 1px solid var(--np-line);\r\n  border-radius: 19px 5px 19px 5px;\r\n\r\n  background: #fff;\r\n}\r\n\r\n.np-root .np-scv-letter {\r\n  width: 48px;\r\n  height: 48px;\r\n\r\n  display: grid;\r\n  place-items: center;\r\n\r\n  margin-bottom: 10px;\r\n\r\n  border-radius: 14px 4px 14px 4px;\r\n\r\n  color: #fff;\r\n  background: var(--np-blue);\r\n\r\n  font-size: 1.2rem;\r\n  font-weight: 900;\r\n}\r\n\r\n.np-root .np-scv-card:nth-child(1) .np-scv-letter {\r\n  background: var(--np-coral);\r\n}\r\n\r\n.np-root .np-scv-card:nth-child(3) .np-scv-letter {\r\n  background: var(--np-green);\r\n}\r\n\r\n/* Puzzle */\r\n\r\n.np-root .np-puzzle {\r\n  display: grid;\r\n  gap: 10px;\r\n}\r\n\r\n.np-root .np-puzzle-step {\r\n  position: relative;\r\n\r\n  padding: 14px 15px 14px 56px;\r\n\r\n  border: 1px solid var(--np-line);\r\n  border-radius: 15px 5px 15px 5px;\r\n\r\n  background: #fff;\r\n}\r\n\r\n.np-root .np-puzzle-step::before {\r\n  content: attr(data-step);\r\n\r\n  position: absolute;\r\n  left: 13px;\r\n  top: 13px;\r\n\r\n  width: 29px;\r\n  height: 29px;\r\n\r\n  display: grid;\r\n  place-items: center;\r\n\r\n  border-radius: 9px 3px 9px 3px;\r\n\r\n  color: #fff;\r\n  background: var(--np-blue);\r\n\r\n  font-size: .75rem;\r\n  font-weight: 900;\r\n}\r\n\r\n/* Checklist */\r\n\r\n.np-root .np-check-list {\r\n  display: grid;\r\n  grid-template-columns: repeat(2, minmax(0,1fr));\r\n  gap: 10px;\r\n\r\n  padding: 0;\r\n  margin: 0;\r\n\r\n  list-style: none;\r\n}\r\n\r\n.np-root .np-check-list li {\r\n  position: relative;\r\n\r\n  padding: 12px 14px 12px 42px;\r\n\r\n  border: 1px solid var(--np-soft-line);\r\n  border-radius: 13px 4px 13px 4px;\r\n\r\n  background: #fff;\r\n}\r\n\r\n.np-root .np-check-list li::before {\r\n  content: \"✓\";\r\n\r\n  position: absolute;\r\n  left: 13px;\r\n  top: polite\">\r\n\r\n\u003carticle class=\"np-page\" data-title=\"一、什麼是數位孿生？\">\n\u003cdiv class=\"np-section\" data-tab-title=\"一、什麼是數位孿生？\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">01\u003c/div>\u003cdiv>\u003ch2>一、什麼是數位孿生？\u003c/h2>\u003cp>一、什麼是數位孿生？\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"np-callout\">本講義依「數位孿生智慧應用資訊圖表」分段整理。圖中工廠、設備、教室數值與情境為概念示意；各節的「教學補充」及課堂活動為協助理解而新增的內容。\u003c/div>\u003cfigure class=\"np-image-card dt-figure\" style=\"max-width:900px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/01c2f8a1cda589570f8c16b0714f2ef4e248d85d63b33512b8293742498b641a.png\" alt=\"什麼是數位孿生\" decoding=\"async\" style=\"max-width:1983px\">\u003cfigcaption>什麼是數位孿生\u003c/figcaption>\u003c/figure>\u003cp>\u003cstrong>數位孿生（Digital Twin）是以真實資料驅動的虛擬分身，用來監測、模擬、預測與優化真實系統。\u003c/strong> 它有對應的實體對象，例如一台機器、一間教室或一座工廠，並透過感測器取得資料，持續更新數位模型。\u003c/p>\u003cp>理解這個概念，可以掌握三個重點：首先，模型對應真實系統；其次，模型會隨實體資料更新；最後，人們能利用模型分析狀態、預測變化並協助決策。原圖以「真實 ↔ 虛擬、持續同步」呈現兩者的連結。\u003c/p>\u003cp>\u003cstrong>教學補充：\u003c/strong> 「即時」表示依應用需求及時更新，不代表完全沒有延遲。模型的更新頻率、資料品質與分析能力，會影響它能回答的問題。\u003c/p>\u003c/div>\n\u003c/article>\n\u003carticle class=\"np-page\" data-title=\"二、數位孿生的六個核心組成\">\n\u003cdiv class=\"np-section\" data-tab-title=\"概覽\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">02\u003c/div>\u003cdiv>\u003ch2>概覽\u003c/h2>\u003cp>二、數位孿生的六個核心組成\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card dt-figure\" style=\"max-width:900px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/5e850ce2afa8c8c9689e996c017d69d4a4f9338785a124d48e351fcd8d1545ce.png\" alt=\"核心組成\" decoding=\"async\" style=\"max-width:1254px\">\u003cfigcaption>核心組成\u003c/figcaption>\u003c/figure>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"2.1 實體設備\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">02\u003c/div>\u003cdiv>\u003ch2>2.1 實體設備\u003c/h2>\u003cp>二、數位孿生的六個核心組成\u003c/p>\u003c/div>\u003c/div>\u003cp>實體設備是被觀察與管理的真實對象。原圖列出工廠生產線、建築、機械與城市設施。建立數位孿生前，應先界定要觀察哪個系統，以及要解決什麼問題。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"2.2 感測器與物聯網（IoT）\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">02\u003c/div>\u003cdiv>\u003ch2>2.2 感測器與物聯網（IoT）\u003c/h2>\u003cp>二、數位孿生的六個核心組成\u003c/p>\u003c/div>\u003c/div>\u003cp>感測器量測溫度、震動、位置等狀態，物聯網則讓設備能交換資料。例如，機器上的感測器可以持續記錄運轉時的溫度與震動，作為判斷設備狀況的依據。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"2.3 資料傳輸\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">02\u003c/div>\u003cdiv>\u003ch2>2.3 資料傳輸\u003c/h2>\u003cp>二、數位孿生的六個核心組成\u003c/p>\u003c/div>\u003c/div>\u003cp>量測資料透過網路傳送至雲端或本地平台。這個步驟把實體世界的變化帶入數位系統，使模型不只停留在建立當下的狀態。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"2.4 3D／數學模型\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">02\u003c/div>\u003cdiv>\u003ch2>2.4 3D／數學模型\u003c/h2>\u003cp>二、數位孿生的六個核心組成\u003c/p>\u003c/div>\u003c/div>\u003cp>模型描述設備的結構、運作規則與行為。3D 模型讓人看見形狀與空間關係；數學模型則描述變數之間的關係，協助推估條件改變後的結果。\u003c/p>\u003cp>\u003cstrong>教學補充：\u003c/strong> 外觀逼真的 3D 畫面本身不足以證明系統具有數位孿生能力；模型是否連結真實資料、能否支援所需分析，才是本講義的判讀重點。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"2.5 AI 分析\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">02\u003c/div>\u003cdiv>\u003ch2>2.5 AI 分析\u003c/h2>\u003cp>二、數位孿生的六個核心組成\u003c/p>\u003c/div>\u003c/div>\u003cp>原圖將資料分析、機器學習與預測列在這個環節。系統可以分析資料中的變化或異常，推估未來可能發生的情況，例如辨識設備是否出現故障徵兆。\u003c/p>\u003cp>\u003cstrong>教學補充：\u003c/strong> 數位孿生也能使用物理規則、統計或其他模型進行分析，AI 是可採用的分析工具之一；預測結果仍需檢查資料與模型是否適合當前情境。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"2.6 控制回饋\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">02\u003c/div>\u003cdiv>\u003ch2>2.6 控制回饋\u003c/h2>\u003cp>二、數位孿生的六個核心組成\u003c/p>\u003c/div>\u003c/div>\u003cp>分析結果回到實體系統，支援維修安排、運轉參數調整或其他管理決策。這使資料的用途從「看見狀態」進一步延伸到「改善運作」。\u003c/p>\u003cp>\u003cstrong>教學補充：\u003c/strong> 回饋可以由人員確認後執行，也可以在適當控制機制下自動執行；並非每個系統都直接自動控制設備。\u003c/p>\u003c/div>\n\u003c/article>\n\u003carticle class=\"np-page\" data-title=\"三、實體與虛擬如何形成資料循環？\">\n\u003cdiv class=\"np-section\" data-tab-title=\"三、實體與虛擬如何形成資料循環？\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">03\u003c/div>\u003cdiv>\u003ch2>三、實體與虛擬如何形成資料循環？\u003c/h2>\u003cp>三、實體與虛擬如何形成資料循環？\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card dt-figure\" style=\"max-width:900px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/cb69034c46cdc8b5a65630cec742795c8ea63acd67351bb3502ccf9fb0fcafe7.png\" alt=\"實體與虛擬資料循環\" decoding=\"async\" style=\"max-width:1475px\">\u003cfigcaption>實體與虛擬資料循環\u003c/figcaption>\u003c/figure>\u003cp>原圖中央以真實工廠與虛擬工廠說明資料循環。實體工廠的感測器收集設備運作資料，將溫度、震動、位置等資訊傳送至平台。平台負責資料儲存、運算與分析，讓虛擬模型反映實體工廠的狀態。\u003c/p>\u003cp>在虛擬端，人們可以進行即時監測、模擬分析、預測維修及優化決策。例如，從設備震動的變化找出異常跡象，再評估是否需要安排檢修。分析結果可形成預測、改善方案或控制指令，回饋真實工廠。\u003c/p>\u003cp>這個循環可整理為：\u003cstrong>實體設備 → 感測與傳輸 → 模型更新 → 分析與決策 → 回饋實體設備 → 再次量測。\u003c/strong> 持續取得後續資料，有助於確認調整後的效果。\u003c/p>\u003c/div>\n\u003c/article>\n\u003carticle class=\"np-page\" data-title=\"四、六步驟運作流程\">\n\u003cdiv class=\"np-section\" data-tab-title=\"四、六步驟運作流程\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">04\u003c/div>\u003cdiv>\u003ch2>四、六步驟運作流程\u003c/h2>\u003cp>四、六步驟運作流程\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card dt-figure\" style=\"max-width:1100px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/865bc8179e57db02225a425702df6967f2068062befb97a616b79f63eda199da.png\" alt=\"運作流程\" decoding=\"async\" style=\"max-width:2172px\">\u003cfigcaption>運作流程\u003c/figcaption>\u003c/figure>\u003cdiv class=\"np-table-wrap\">\u003ctable class=\"np-table\">\u003cthead>\u003ctr>\u003cth>步驟\u003c/th>\u003cth>原圖重點\u003c/th>\u003cth>閱讀說明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1. 蒐集資料\u003c/td>\u003ctd>由感測器／IoT 取得即時資料\u003c/td>\u003ctd>先知道實體系統目前的狀態。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2. 建立模型\u003c/td>\u003ctd>建立 3D／數學模型，描述系統行為\u003c/td>\u003ctd>把結構與運作規則轉成可分析的模型。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3. 即時同步\u003c/td>\u003ctd>將真實資料持續傳送至虛擬模型\u003c/td>\u003ctd>讓模型隨實際狀態更新。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4. 模擬分析\u003c/td>\u003ctd>進行情境模擬與 AI 分析\u003c/td>\u003ctd>探討不同條件可能造成的結果。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5. 優化決策\u003c/td>\u003ctd>提出最佳方案，如排程、調整參數\u003c/td>\u003ctd>比較選項，選擇符合目標與限制的方案。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6. 回饋控制\u003c/td>\u003ctd>將指令回饋至實體系統執行\u003c/td>\u003ctd>執行後再次量測，確認改善效果。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>教學補充：\u003c/strong> 表格是概念流程。實際建置時，模型設計、感測器配置與資料蒐集常需反覆調整；「最佳方案」也取決於成本、安全、產能或節能等目標，沒有適用所有情境的單一答案。\u003c/p>\u003c/div>\n\u003c/article>\n\u003carticle class=\"np-page\" data-title=\"五、與 3D 模型、模擬及 VR 有什麼不同？\">\n\u003cdiv class=\"np-section\" data-tab-title=\"五、與 3D 模型、模擬及 VR 有什麼不同？\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">05\u003c/div>\u003cdiv>\u003ch2>五、與 3D 模型、模擬及 VR 有什麼不同？\u003c/h2>\u003cp>五、與 3D 模型、模擬及 VR 有什麼不同？\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card dt-figure\" style=\"max-width:900px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/7f030a2d87864497f059dbc95dbb0dd9639f7706d12746cd403fb0ecb6b2f9f6.png\" alt=\"相關概念比較\" decoding=\"async\" style=\"max-width:1774px\">\u003cfigcaption>相關概念比較\u003c/figcaption>\u003c/figure>\u003cdiv class=\"np-table-wrap\">\u003ctable class=\"np-table\">\u003cthead>\u003ctr>\u003cth>概念\u003c/th>\u003cth>原圖中的主要特點\u003c/th>\u003cth>課堂判讀方式\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>3D 模型\u003c/td>\u003ctd>重視外觀，不一定連結真實資料\u003c/td>\u003ctd>能看見立體外形，不代表資料會更新。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>模擬\u003c/td>\u003ctd>可以測試情境，不一定即時同步\u003c/td>\u003ctd>可以回答「如果條件改變會如何」，但未必反映實體當下狀態。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>VR\u003c/td>\u003ctd>強調沉浸式體驗\u003c/td>\u003ctd>著重使用者如何觀看與互動。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>數位孿生\u003c/td>\u003ctd>有真實對應、持續更新、可分析預測\u003c/td>\u003ctd>關注實體對象、資料連結與分析用途。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>教學補充：\u003c/strong> 這些技術可以結合。例如，數位孿生可以用 3D 呈現、加入模擬功能，再透過 VR 讓人檢視；分類重點是各技術在系統中扮演的角色。\u003c/p>\u003c/div>\n\u003c/article>\n\u003carticle class=\"np-page\" data-title=\"六、數位孿生的六種智慧應用\">\n\u003cdiv class=\"np-section\" data-tab-title=\"影片欣賞\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">06\u003c/div>\u003cdiv>\u003ch2>影片欣賞\u003c/h2>\u003cp>六、數位孿生的六種智慧應用\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"np-embed-box\">\u003cdiv class=\"np-embed-head\">\u003cdiv class=\"np-embed-title\">影片欣賞\u003c/div>\u003c/div>\u003cdiv class=\"dt-video\">\u003ciframe id=\"dt-youtube\" data-src=\"https://www.youtube-nocookie.com/embed/DUNwtidawQI?playsinline=1&amp;rel=0\" title=\"數位孿生智慧應用影片\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" referrerpolicy=\"strict-origin-when-cross-origin\" allowfullscreen>\u003c/iframe>\u003c/div>\u003cp id=\"dt-video-status\" role=\"status\">\u003c/p>\u003c/div>\u003cp>\u003ca class=\"np-external-link\" href=\"https://www.youtube.com/watch?v=DUNwtidawQI\" target=\"_blank\" rel=\"noopener noreferrer\">▶ 在 YouTube 觀看影片 ↗\u003c/a>\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"6.1 智慧工廠\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">06\u003c/div>\u003cdiv>\u003ch2>6.1 智慧工廠：監控產線與預測維修\u003c/h2>\u003cp>六、數位孿生的六種智慧應用\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card dt-figure\" style=\"max-width:557px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/9cfd267e44b20b0e77870da0e339985b035fbef0f16af220b0f2553d7a02b197.png\" alt=\"智慧工廠\" decoding=\"async\" style=\"max-width:557px\">\u003cfigcaption>智慧工廠\u003c/figcaption>\u003c/figure>\u003cp>智慧工廠將產線設備與數位模型連結，監測設備運轉與生產狀況，並利用資料協助預測維修需求。原圖以機械手臂與生產線呈現這個場景。\u003c/p>\u003cp>\u003cstrong>教學補充例：\u003c/strong> 若馬達震動逐步增加，可先分析異常趨勢，再安排檢查或維修，降低突然停機的機會。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"6.2 智慧城市\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">06\u003c/div>\u003cdiv>\u003ch2>6.2 智慧城市：交通模擬與能源管理\u003c/h2>\u003cp>六、數位孿生的六種智慧應用\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card dt-figure\" style=\"max-width:558px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/13e4226ae6bc0757d1b4ec6cec44f6612e588298fe2991d06dd8ebcc761f5a31.png\" alt=\"智慧城市\" decoding=\"async\" style=\"max-width:558px\">\u003cfigcaption>智慧城市\u003c/figcaption>\u003c/figure>\u003cp>城市中的道路、交通與能源系統可以透過資料和模型協助管理。原圖列出交通模擬及能源管理，重點是利用虛擬環境評估城市系統的運作。\u003c/p>\u003cp>\u003cstrong>教學補充例：\u003c/strong> 先比較不同號誌方案對車流的影響，再評估是否調整路口設定。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"6.3 智慧教室\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">06\u003c/div>\u003cdiv>\u003ch2>6.3 智慧教室：環境監測與空調優化\u003c/h2>\u003cp>六、數位孿生的六種智慧應用\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card dt-figure\" style=\"max-width:557px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/832b779d5ddf778252857f63312840a2380242b392c59c66b9ced6b84d0b3a7d.png\" alt=\"智慧教室\" decoding=\"async\" style=\"max-width:557px\">\u003cfigcaption>智慧教室\u003c/figcaption>\u003c/figure>\u003cp>智慧教室可量測二氧化碳濃度、溫度與濕度，並在模型或介面中呈現環境變化，支援空調與通風管理。原圖的 26°C、濕度 58% 為畫面示例，不是通用設定標準。\u003c/p>\u003cp>\u003cstrong>教學補充例：\u003c/strong> 比較不同人數、時段與空調設定下的資料，討論如何兼顧舒適與能源使用。單純顯示感測數值的看板，仍需進一步檢視其模型與分析功能，才能判斷是否符合本講義的數位孿生特徵。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"6.4 醫療健康\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">06\u003c/div>\u003cdiv>\u003ch2>6.4 醫療健康：病患監測與治療模擬\u003c/h2>\u003cp>六、數位孿生的六種智慧應用\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card dt-figure\" style=\"max-width:558px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/b3a2e75237a429a7c3a83cb6846ad2bd73a00cab021d105e322cf9f83efc376d.png\" alt=\"醫療健康\" decoding=\"async\" style=\"max-width:558px\">\u003cfigcaption>醫療健康\u003c/figcaption>\u003c/figure>\u003cp>原圖以病患監測與治療模擬說明醫療領域的應用方向：結合觀察資料與模型，協助理解狀態及評估不同情境。\u003c/p>\u003cp>\u003cstrong>教學補充：\u003c/strong> 這裡是技術情境介紹；模型結果需要專業人員判讀，不能把示意圖理解成所有病患皆能獲得相同程度的精準預測。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"6.5 智慧農業\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">06\u003c/div>\u003cdiv>\u003ch2>6.5 智慧農業：溫室管理與灌溉調整\u003c/h2>\u003cp>六、數位孿生的六種智慧應用\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card dt-figure\" style=\"max-width:557px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/8392aa33c11ca14a3490d98237fd0c4e5c5dfbb05eec2a1010f0989f4cbf8ca0.png\" alt=\"智慧農業\" decoding=\"async\" style=\"max-width:557px\">\u003cfigcaption>智慧農業\u003c/figcaption>\u003c/figure>\u003cp>智慧農業可將溫室或農場的環境資料連結至模型，支援溫室管理與灌溉調整。原圖呈現溫室、作物與自動化設備。\u003c/p>\u003cp>\u003cstrong>教學補充例：\u003c/strong> 觀察土壤含水狀況與環境變化，評估不同灌溉安排，調整後再檢查水分及用水量的變化。\u003c/p>\u003c/div>\n\u003cdiv class=\"np-section\" data-tab-title=\"6.6 防災管理\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">06\u003c/div>\u003cdiv>\u003ch2>6.6 防災管理：淹水模擬與避難規劃\u003c/h2>\u003cp>六、數位孿生的六種智慧應用\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card dt-figure\" style=\"max-width:558px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/9b92046482bdd8283c0eeb013f295757ca088fae297c055e64f1b25faed3bf03.png\" alt=\"防災管理\" decoding=\"async\" style=\"max-width:558px\">\u003cfigcaption>防災管理\u003c/figcaption>\u003c/figure>\u003cp>防災管理可利用資料與模型推估不同情境下的淹水範圍，協助規劃避難路線與資源配置。原圖以城市淹水情境呈現這項應用。\u003c/p>\u003cp>\u003cstrong>教學補充：\u003c/strong> 模擬結果受輸入條件與模型假設影響，適合用來比較情境及支援規劃；課堂示意不作為實際災害中的行動指引。\u003c/p>\u003c/div>\n\u003c/article>\n\u003carticle class=\"np-page\" data-title=\"七、為什麼數位孿生重要？\">\n\u003cdiv class=\"np-section\" data-tab-title=\"七、為什麼數位孿生重要？\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">07\u003c/div>\u003cdiv>\u003ch2>七、為什麼數位孿生重要？\u003c/h2>\u003cp>七、為什麼數位孿生重要？\u003c/p>\u003c/div>\u003c/div>\u003cfigure class=\"np-image-card dt-figure\" style=\"max-width:900px\">\u003cimg src=\"https://raw.githubusercontent.com/max00189xp/emerging-technology-course-web/main/assets/69f0293349fbc8c9fa96077fac957ecd43b1d208ffc89c91515adff17ed700eb.png\" alt=\"為什麼重要\" decoding=\"async\" style=\"max-width:2172px\">\u003cfigcaption>為什麼重要\u003c/figcaption>\u003c/figure>\u003cp>原圖提出五項價值。\u003cstrong>降低測試成本\u003c/strong>是先在虛擬環境比較方案，減少部分真實試驗；\u003cstrong>提升安全與效率\u003c/strong>是協助降低風險、加快運作；\u003cstrong>提早發現問題\u003c/strong>是從監測與分析中辨識異常跡象；\u003cstrong>支援智慧決策\u003c/strong>是以數據比較選項；\u003cstrong>推動永續與節能\u003c/strong>則是改善資源使用，減少浪費與碳排放。\u003c/p>\u003cp>\u003cstrong>教學補充：\u003c/strong> 這些是應用目標，成效需要以實際資料驗證。可比較導入前後的停機時間、能源用量、用水量或測試成本，同時考量建置與維護所需資源。\u003c/p>\u003c/div>\n\u003c/article>\n\u003carticle class=\"np-page\" data-title=\"八、思考題與參考答案\">\n\u003cdiv class=\"np-section\" data-tab-title=\"題目\">\u003cdiv class=\"np-page-head\">\u003cdiv class=\"np-page-number\">08\u003c/div>\u003cdiv>\u003ch2>題目\u003c/h2>\u003cp>八、思考題與參考答案\u003c/p>\u003c/div>\u003c/div>\u003col>\u003cli>一個工廠的 3D 模型，只有外觀而沒有持續接收資料，是否符合本講義的數位孿生特徵？\u003c/li>\u003cli>為什麼只有感測器，仍不足以完成數位孿生的整個運作流程？\u003c/li>\u003cli>「即時同步」與「模擬分析」分別在做什麼？\u003c/li>\u003cli>為什麼執行調整後，還需要繼續量測？\u003c/li>\u003cli>若模型收到過時或不正確的資料，分析結果可能受到什麼影響？\u003c/li>\u003cli>請選擇一個應用，說明其實體對象、資料、模型用途與回饋方式。\u003c/li>\u003c/ol>\u003cdetails>\u003csummary>展開參考答案\u003c/summary>\u003col>\u003cli>尚未符合。它具有立體外觀，但缺少與實體持續連結及更新等特徵。\u003c/li>\u003cli>感測器負責量測；後續仍需要資料傳輸、模型、分析及回饋，才能形成完整流程。\u003c/li>\u003cli>即時同步讓模型反映實體狀態；模擬分析則用模型推估不同條件下的可能結果。\u003c/li>\u003cli>再次量測可確認實體是否依預期改變，並用後續資料評估改善效果。\u003c/li>\u003cli>模型可能無法正確反映現況，預測及決策品質也可能降低，因此需要檢查資料品質、時間與模型適用性。\u003c/li>\u003cli>例如智慧農業：實體對象為溫室；資料可包含環境與土壤水分；模型用於比較灌溉情境；回饋則是由管理者確認後調整灌溉，再量測效果。\u003c/li>\u003c/ol>\u003c/details>\u003c/div>\n\u003c/article>\n\n\u003c/section>\r\n\r\n\r\n\u003cdiv class=\"np-controls\">\r\n\r\n\u003cbutton class=\"np-control\" id=\"np-prev\" type=\"button\" aria-label=\"上一頁\">\r\n  ←\r\n\u003c/button>\r\n\r\n\u003cdiv class=\"np-progress\" aria-hidden=\"true\">\r\n\r\n  \u003cdiv class=\"np-progress-bar\" id=\"np-progress\">\r\n  \u003c/div>\r\n\r\n\u003c/div>\r\n\r\n\u003cbutton class=\"np-control\" id=\"np-next\" type=\"button\" aria-label=\"下一頁\">\r\n  →\r\n\u003c/button>\r\n\r\n\u003cdiv class=\"np-page-count\" id=\"np-page-count\" aria-live=\"polite\">\r\n\u003c/div>\r\n\r\n\u003c/div>\r\n\r\n\u003c/main>\r\n\u003c/div>\r\n\r\n\r\n\u003cfooter class=\"np-footer\">數位孿生智慧應用｜新興科技教學\u003cbr>依 \u003ca href=\"https://hackmd.io/B-MjM_hRSE2uBQHA0rJiEA\" target=\"_blank\" rel=\"noopener noreferrer\">HackMD 講義\u003c/a> 製作・圖片為原圖與 AI 高解析重製版本；情境與數值為示例；影片需要連線。\u003c/footer>\r\n\r\n\r\n\u003cscript nonce=\"2avuI5xY1eK4tfLJpCzMO0nLNFviC4vJKOgT90KB\">\r\n(function () {\r\n  \"use strict\";\r\n\r\n  var root;\r\n  var nav;\r\n  var tabs;\r\n  var pages;\r\n  var prevButton;\r\n  var nextButton;\r\n  var progress;\r\n  var pageCount;\r\n\r\n  var state = {\r\n    chapter: 0,\r\n    tab: 0\r\n  };\r\n\r\n\r\n  function escapeHtml(value) {\r\n\r\n    return String(value).replace(\r\n      /[&\u003c>\"']/g,\r\n      function (character) {\r\n\r\n        return {\r\n          \"&\": \"&amp;\",\r\n          \"\u003c\": \"&lt;\",\r\n          \">\": \"&gt;\",\r\n          \"\\\"\": \"&quot;\",\r\n          \"'\": \"&#039;\"\r\n        }[character];\r\n\r\n      }\r\n    );\r\n\r\n  }\r\n\r\n\r\n  function pad(number) {\r\n    return String(number).padStart(2, \"0\");\r\n  }\r\n\r\n\r\n  function getPages() {\r\n\r\n    return Array.prototype.slice.call(\r\n      root.querySelectorAll(\".np-page\")\r\n    );\r\n\r\n  }\r\n\r\n\r\n  function getCurrentPage() {\r\n\r\n    return pages[state.chapter] || null;\r\n\r\n  }\r\n\r\n\r\n  function getSections(page) {\r\n\r\n    if (!page) {\r\n      return [];\r\n    }\r\n\r\n    return Array.prototype.slice.call(\r\n      page.querySelectorAll(\".np-section\")\r\n    );\r\n\r\n  }\r\n\r\n\r\n  function getTotalSubPages() {\r\n\r\n    var total = 0;\r\n\r\n    pages.forEach(\r\n      function (page) {\r\n\r\n        total += getSections(page).length;\r\n\r\n      }\r\n    );\r\n\r\n    return total;\r\n\r\n  }\r\n\r\n\r\n  function getCurrentSubPageIndex() {\r\n\r\n    var index = 0;\r\n    var chapterIndex;\r\n\r\n    for (\r\n      chapterIndex = 0;\r\n      chapterIndex \u003c state.chapter;\r\n      chapterIndex += 1\r\n    ) {\r\n\r\n      index +=\r\n        getSections(\r\n          pages[chapterIndex]\r\n        ).length;\r\n\r\n    }\r\n\r\n    index += state.tab + 1;\r\n\r\n    return index;\r\n\r\n  }\r\n\r\n\r\n  function renderNavigation() {\r\n\r\n    var html = pages.map(\r\n      function (page, index) {\r\n\r\n        var title =\r\n          page.getAttribute(\"data-title\") ||\r\n          (\"章節 \" + (index + 1));\r\n\r\n        var current =\r\n          index === state.chapter;\r\n\r\n        return (\r\n          '\u003cbutton ' +\r\n            'class=\"np-nav-button\" ' +\r\n            'type=\"button\" ' +\r\n            'data-chapter=\"' +\r\n            index +\r\n            '\" ' +\r\n            'aria-current=\"' +\r\n            (current ? \"true\" : \"false\") +\r\n            '\">' +\r\n\r\n            '\u003cspan class=\"np-nav-index\">' +\r\n              pad(index + 1) +\r\n            '\u003c/span>' +\r\n\r\n            '\u003cspan class=\"np-nav-label\">' +\r\n              escapeHtml(title) +\r\n            '\u003c/span>' +\r\n\r\n          '\u003c/button>'\r\n        );\r\n\r\n      }\r\n    ).join(\"\");\r\n\r\n    nav.innerHTML = html;\r\n\r\n  }\r\n\r\n\r\n  function renderTabs() {\r\n\r\n    var currentPage =\r\n      getCurrentPage();\r\n\r\n    var sections =\r\n      getSections(currentPage);\r\n\r\n    var html =\r\n      sections.map(\r\n        function (section, index) {\r\n\r\n          var title =\r\n            section.getAttribute(\r\n              \"data-tab-title\"\r\n            ) ||\r\n            (\"內容 \" + (index + 1));\r\n\r\n          var selected =\r\n            index === state.tab;\r\n\r\n          return (\r\n            '\u003cbutton ' +\r\n              'class=\"np-tab\" ' +\r\n              'type=\"button\" ' +\r\n              'role=\"tab\" ' +\r\n              'data-tab=\"' +\r\n              index +\r\n              '\" ' +\r\n              'aria-selected=\"' +\r\n              (selected ? \"true\" : \"false\") +\r\n              '\">' +\r\n\r\n              escapeHtml(title) +\r\n\r\n            '\u003c/button>'\r\n          );\r\n\r\n        }\r\n      ).join(\"\");\r\n\r\n    tabs.innerHTML = html;\r\n\r\n  }\r\n\r\n\r\n  function showCurrentContent() {\r\n\r\n    pages.forEach(\r\n      function (page, index) {\r\n\r\n        page.classList.toggle(\r\n          \"is-active\",\r\n          index === state.chapter\r\n        );\r\n\r\n        var sections =\r\n          getSections(page);\r\n\r\n        sections.forEach(\r\n          function (\r\n            section,\r\n            sectionIndex\r\n          ) {\r\n\r\n            section.style.display =\r\n              (\r\n                index === state.chapter &&\r\n                sectionIndex === state.tab\r\n              )\r\n                ? \"block\"\r\n                : \"none\";\r\n\r\n          }\r\n        );\r\n\r\n      }\r\n    );\r\n\r\n  }\r\n\r\n\r\n  function updateControls() {\r\n\r\n    var total =\r\n      getTotalSubPages();\r\n\r\n    var current =\r\n      getCurrentSubPageIndex();\r\n\r\n    prevButton.disabled =\r\n      current \u003c= 1;\r\n\r\n    nextButton.disabled =\r\n      current >= total;\r\n\r\n    progress.style.width =\r\n      (\r\n        (current / total) *\r\n        100\r\n      ).toFixed(2) + \"%\";\r\n\r\n    pageCount.textContent =\r\n      pad(current) +\r\n      \" / \" +\r\n      pad(total);\r\n\r\n  }\r\n\r\n\r\n  function updateHash() {\r\n\r\n    var chapter =\r\n      pad(state.chapter + 1);\r\n\r\n    var tab =\r\n      state.tab + 1;\r\n\r\n    var newHash =\r\n      \"#chapter-\" +\r\n      chapter +\r\n      \"-tab-\" +\r\n      tab;\r\n\r\n    if (\r\n      location.hash !==\r\n      newHash\r\n    ) {\r\n\r\n      history.replaceState(\r\n        null,\r\n        \"\",\r\n        newHash\r\n      );\r\n\r\n    }\r\n\r\n  }\r\n\r\n\r\n  function scrollSelectedIntoView() {\r\n\r\n    var activeNav =\r\n      nav.querySelector(\r\n        '[aria-current=\"true\"]'\r\n      );\r\n\r\n    var activeTab =\r\n      tabs.querySelector(\r\n        '[aria-selected=\"true\"]'\r\n      );\r\n\r\n    if (activeNav) {\r\n\r\n      activeNav.scrollIntoView({\r\n        behavior: \"smooth\",\r\n        block: \"nearest\",\r\n        inline: \"center\"\r\n      });\r\n\r\n    }\r\n\r\n    if (activeTab) {\r\n\r\n      activeTab.scrollIntoView({\r\n        behavior: \"smooth\",\r\n        block: \"nearest\",\r\n        inline: \"center\"\r\n      });\r\n\r\n    }\r\n\r\n  }\r\n\r\n\r\n  function render() {\r\n\r\n    var currentPage =\r\n      getCurrentPage();\r\n\r\n    var sections =\r\n      getSections(currentPage);\r\n\r\n    if (\r\n      state.tab \u003c 0 ||\r\n      state.tab >= sections.length\r\n    ) {\r\n\r\n      state.tab = 0;\r\n\r\n    }\r\n\r\n    renderNavigation();\r\n    renderTabs();\r\n    showCurrentContent();\r\n    updateControls();\r\n    updateHash();\r\n    scrollSelectedIntoView();\r\n\r\n  }\r\n\r\n\r\n  function selectChapter(index) {\r\n\r\n    if (\r\n      !Number.isInteger(index) ||\r\n      index \u003c 0 ||\r\n      index >= pages.length\r\n    ) {\r\n\r\n      return;\r\n\r\n    }\r\n\r\n    state.chapter = index;\r\n    state.tab = 0;\r\n\r\n    render();\r\n\r\n  }\r\n\r\n\r\n  function selectTab(index) {\r\n\r\n    var currentPage =\r\n      getCurrentPage();\r\n\r\n    var sections =\r\n      getSections(currentPage);\r\n\r\n    if (\r\n      !Number.isInteger(index) ||\r\n      index \u003c 0 ||\r\n      index >= sections.length\r\n    ) {\r\n\r\n      return;\r\n\r\n    }\r\n\r\n    state.tab = index;\r\n\r\n    render();\r\n\r\n  }\r\n\r\n\r\n  /*\r\n   * 重點：\r\n   * 上一頁 / 下一頁改成以子題為單位移動。\r\n   */\r\n  function movePage(delta) {\r\n\r\n    var currentPage =\r\n      getCurrentPage();\r\n\r\n    var currentSections =\r\n      getSections(currentPage);\r\n\r\n\r\n    /* 下一頁 */\r\n    if (delta > 0) {\r\n\r\n      /*\r\n       * 同一主題仍有下一個子題\r\n       */\r\n      if (\r\n        state.tab \u003c\r\n        currentSections.length - 1\r\n      ) {\r\n\r\n        state.tab += 1;\r\n\r\n        render();\r\n\r\n        return;\r\n\r\n      }\r\n\r\n\r\n      /*\r\n       * 已經是本主題最後一個子題\r\n       * 才進入下一主題\r\n       */\r\n      if (\r\n        state.chapter \u003c\r\n        pages.length - 1\r\n      ) {\r\n\r\n        state.chapter += 1;\r\n        state.tab = 0;\r\n\r\n        render();\r\n\r\n      }\r\n\r\n      return;\r\n\r\n    }\r\n\r\n\r\n    /* 上一頁 */\r\n    if (delta \u003c 0) {\r\n\r\n      /*\r\n       * 同一主題仍有上一個子題\r\n       */\r\n      if (\r\n        state.tab > 0\r\n      ) {\r\n\r\n        state.tab -= 1;\r\n\r\n        render();\r\n\r\n        return;\r\n\r\n      }\r\n\r\n\r\n      /*\r\n       * 已經是本主題第一個子題\r\n       * 回到上一主題最後一個子題\r\n       */\r\n      if (\r\n        state.chapter > 0\r\n      ) {\r\n\r\n        state.chapter -= 1;\r\n\r\n        var previousPage =\r\n          getCurrentPage();\r\n\r\n        var previousSections =\r\n          getSections(\r\n            previousPage\r\n          );\r\n\r\n        state.tab =\r\n          Math.max(\r\n            0,\r\n            previousSections.length - 1\r\n          );\r\n\r\n        render();\r\n\r\n      }\r\n\r\n    }\r\n\r\n  }\r\n\r\n\r\n  function readHash() {\r\n\r\n    var match =\r\n      location.hash.match(\r\n        /^#chapter-(\\d{1,2})-tab-(\\d{1,2})$/\r\n      );\r\n\r\n    if (!match) {\r\n      return;\r\n    }\r\n\r\n    var chapter =\r\n      Number(match[1]) - 1;\r\n\r\n    var tab =\r\n      Number(match[2]) - 1;\r\n\r\n    if (\r\n      Number.isInteger(chapter) &&\r\n      chapter >= 0 &&\r\n      chapter \u003c pages.length\r\n    ) {\r\n\r\n      state.chapter =\r\n        chapter;\r\n\r\n      var sections =\r\n        getSections(\r\n          pages[chapter]\r\n        );\r\n\r\n      if (\r\n        Number.isInteger(tab) &&\r\n        tab >= 0 &&\r\n        tab \u003c sections.length\r\n      ) {\r\n\r\n        state.tab =\r\n          tab;\r\n\r\n      } else {\r\n\r\n        state.tab = 0;\r\n\r\n      }\r\n\r\n    }\r\n\r\n  }\r\n\r\n\r\n  function init() {\r\n\r\n    root =\r\n      document.querySelector(\r\n        \".np-root\"\r\n      );\r\n\r\n    if (!root) {\r\n      return;\r\n    }\r\n\r\n    nav =\r\n      root.querySelector(\r\n        \"#np-nav\"\r\n      );\r\n\r\n    tabs =\r\n      root.querySelector(\r\n        \"#np-tabs\"\r\n      );\r\n\r\n    prevButton =\r\n      root.querySelector(\r\n        \"#np-prev\"\r\n      );\r\n\r\n    nextButton =\r\n      root.querySelector(\r\n        \"#np-next\"\r\n      );\r\n\r\n    progress =\r\n      root.querySelector(\r\n        \"#np-progress\"\r\n      );\r\n\r\n    pageCount =\r\n      root.querySelector(\r\n        \"#np-page-count\"\r\n      );\r\n\r\n    pages =\r\n      getPages();\r\n\r\n\r\n    nav.addEventListener(\r\n      \"click\",\r\n      function (event) {\r\n\r\n        var button =\r\n          event.target.closest(\r\n            \"[data-chapter]\"\r\n          );\r\n\r\n        if (\r\n          !button ||\r\n          !nav.contains(button)\r\n        ) {\r\n\r\n          return;\r\n\r\n        }\r\n\r\n        selectChapter(\r\n          Number(\r\n            button.getAttribute(\r\n              \"data-chapter\"\r\n            )\r\n          )\r\n        );\r\n\r\n      }\r\n    );\r\n\r\n\r\n    tabs.addEventListener(\r\n      \"click\",\r\n      function (event) {\r\n\r\n        var button =\r\n          event.target.closest(\r\n            \"[data-tab]\"\r\n          );\r\n\r\n        if (\r\n          !button ||\r\n          !tabs.contains(button)\r\n        ) {\r\n\r\n          return;\r\n\r\n        }\r\n\r\n        selectTab(\r\n          Number(\r\n            button.getAttribute(\r\n              \"data-tab\"\r\n            )\r\n          )\r\n        );\r\n\r\n      }\r\n    );\r\n\r\n\r\n    prevButton.addEventListener(\r\n      \"click\",\r\n      function () {\r\n\r\n        movePage(-1);\r\n\r\n      }\r\n    );\r\n\r\n\r\n    nextButton.addEventListener(\r\n      \"click\",\r\n      function () {\r\n\r\n        movePage(1);\r\n\r\n      }\r\n    );\r\n\r\n\r\n    document.addEventListener(\r\n      \"keydown\",\r\n      function (event) {\r\n\r\n        var target =\r\n          event.target;\r\n\r\n        var tagName =\r\n          target &&\r\n          target.tagName\r\n            ? target.tagName.toLowerCase()\r\n            : \"\";\r\n\r\n        if (\r\n          tagName === \"input\" ||\r\n          tagName === \"textarea\" ||\r\n          tagName === \"select\"\r\n        ) {\r\n\r\n          return;\r\n\r\n        }\r\n\r\n        if (\r\n          event.key ===\r\n          \"ArrowLeft\"\r\n        ) {\r\n\r\n          movePage(-1);\r\n\r\n        }\r\n\r\n        if (\r\n          event.key ===\r\n          \"ArrowRight\"\r\n        ) {\r\n\r\n          movePage(1);\r\n\r\n        }\r\n\r\n      }\r\n    );\r\n\r\n\r\n    window.addEventListener(\r\n      \"hashchange\",\r\n      function () {\r\n\r\n        var oldChapter =\r\n          state.chapter;\r\n\r\n        var oldTab =\r\n          state.tab;\r\n\r\n        readHash();\r\n\r\n        if (\r\n          old <script>
(() => {
  'use strict';
  const courses = JSON.parse(document.getElementById('course-data').textContent);
  const buttons = [...document.querySelectorAll('[data-course]')];
  const frames = new Map();
  const positions = new Map();
  let selected;
  function parseHash() {
    const match = location.hash.match(/^#(vr|drone|vision|twin)(?:\/chapter-(\d{1,2})-tab-(\d{1,2}))?$/);
    return match ? {id:match[1], hash:match[2] ? '#chapter-'+match[2]+'-tab-'+match[3] : null} : {id:'vr',hash:null};
  }
  function syncAddress(id, frame) {
    const hash = frame.contentWindow.location.hash;
    if (!/^#chapter-\d{1,2}-tab-\d{1,2}$/.test(hash)) return;
    positions.set(id,hash);
    if (selected !== id) return;
    const next = '#'+id+'/'+hash.slice(1);
    if (location.hash !== next) history.replaceState(null,'',next);
  }
  function selectCourse(id, requestedHash) {
    const course = courses.find(c=>c.id===id);
    if (!course) return;
    selected = id;
    buttons.forEach(button=>{
      const active = button.dataset.course === id;
      button.setAttribute('aria-selected',String(active));
      button.tabIndex = active ? 0 : -1;
    });
    frames.forEach((frame,key)=>{ frame.hidden = key !== id; });
    let frame = frames.get(id);
    if (!frame) {
      frame = document.createElement('iframe');
      frame.id = 'course-'+id;
      frame.title = course.label+'教學內容';
      frame.setAttribute('role','tabpanel');
      frame.setAttribute('aria-labelledby','tab-'+id);
      frame.setAttribute('allow','fullscreen');
      frame.allowFullscreen = true;
      const initialHash = requestedHash || positions.get(id);
      frame.addEventListener('load',()=>{
        const doc = frame.contentDocument;
        if (!doc || !doc.querySelector('.np-root')) return;
        const win = frame.contentWindow;
        if (initialHash) {
          win.history.replaceState(null,'','about:srcdoc'+initialHash);
          win.dispatchEvent(new win.HashChangeEvent('hashchange'));
        }
        const counter = doc.getElementById('np-page-count');
        if (!counter) return;
        new win.MutationObserver(()=>syncAddress(id,frame)).observe(counter,{childList:true,subtree:true,characterData:true});
        syncAddress(id,frame);
      });
      frames.set(id,frame);
      document.getElementById('course-content').append(frame);
      frame.srcdoc = course.html.replace(/<head\b[^>]*>/i,'$&<base href="about:srcdoc">');
    } else {
      frame.hidden = false;
      if (requestedHash && frame.contentDocument?.querySelector('.np-root')) {
        const win = frame.contentWindow;
        win.history.replaceState(null,'',win.location.href.split('#')[0]+requestedHash);
        win.dispatchEvent(new win.HashChangeEvent('hashchange'));
      }
      syncAddress(id,frame);
    }
    document.title = course.label+'｜新興科技・科技介紹課程';
  }
  buttons.forEach((button,index)=>{
    button.addEventListener('click',()=>selectCourse(button.dataset.course));
    button.addEventListener('keydown',event=>{
      let next;
      if(event.key==='ArrowRight') next=(index+1)%buttons.length;
      if(event.key==='ArrowLeft') next=(index+buttons.length-1)%buttons.length;
      if(event.key==='Home') next=0;
      if(event.key==='End') next=buttons.length-1;
      if(next!==undefined){event.preventDefault();buttons[next].focus();selectCourse(buttons[next].dataset.course);}
    });
  });
  function restore(){ const target=parseHash(); selectCourse(target.id,target.hash); }
  window.addEventListener('hashchange',restore);
  restore();
})();
</script>
